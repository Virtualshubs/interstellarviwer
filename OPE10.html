<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>

<script>

// ======================================================
// 🌍 EARTH + SUN SYSTEM (UNCHANGED CORE - OK)
// ======================================================
let scene, camera, renderer;
let earth, earthGroup, sunLight, ambientLight;

let startTime = Date.now();

// camera
let distance = 3;
let targetDistance = 3;
let rotY = 0, targetRotY = 0;
let rotX = 0, targetRotX = 0;
let isDragging = false;

// ======================================================
// 🛰️ SATELLITES ENGINE
// ======================================================
const SAT_INFO = {
  "25544": { name:"ISS", type:"Station", mission:"Microgravity" },

  "39634": { name:"Sentinel-1A", type:"Radar", mission:"Copernicus" },
  "39084": { name:"Sentinel-1B", type:"Radar", mission:"Copernicus" },
  "29780": { name:"Sentinel-2A", type:"Optical", mission:"Copernicus" },
  "42063": { name:"Sentinel-2B", type:"Optical", mission:"Copernicus" },
  "28654": { name:"Sentinel-3A", type:"Ocean", mission:"Copernicus" },
  "43618": { name:"Sentinel-5P", type:"Atmosphere", mission:"Copernicus" },

  "25338": { name:"NOAA-15", type:"Meteorological", mission:"Weather" },
  "38552": { name:"Meteosat-10", type:"Geo Weather", mission:"Weather" }
};

let satMeshes = {};
let satrecs = {};
let currentSat = "25544";

// 🔥 CACHE TLE (CRÍTICO PARA NO BLOQUEAR)
const TLE_CACHE = {};

// ======================================================
// 🎨 COLORS
// ======================================================
const COLORS = {
  COPERNICUS: 0xff7a18,
  WEATHER: 0xb06cff,
  ISS: 0x4aa3ff
};

function getColor(id){
  const sat = SAT_INFO[id];
  if(!sat) return 0xffffff;

  const name = sat.name.toLowerCase();

  if(name.includes("sentinel")) return COLORS.COPERNICUS;
  if(name.includes("noaa") || name.includes("meteosat")) return COLORS.WEATHER;
  if(name.includes("iss")) return COLORS.ISS;

  return 0xffffff;
}

// ======================================================
// INIT
// ======================================================
init();
animate();

function init(){

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
  );

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // =========================
  // 🌍 LIGHTS (UNCHANGED)
  // =========================
  sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
  scene.add(sunLight);
  scene.add(sunLight.target);

  ambientLight = new THREE.AmbientLight(0xffffff, 0.12);
  scene.add(ambientLight);

  // =========================
  // 🌍 EARTH
  // =========================
  earthGroup = new THREE.Group();
  scene.add(earthGroup);

  earthGroup.rotation.z = THREE.MathUtils.degToRad(23.44);

  const tex = new THREE.TextureLoader().load(
    "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
  );

  earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 64, 64),
    new THREE.MeshStandardMaterial({
      map: tex,
      roughness: 1,
      metalness: 0,
      emissive: new THREE.Color(0x0a0a0a),
      emissiveIntensity: 0.25
    })
  );

  earth.rotation.y = Math.PI;
  earthGroup.add(earth);

// =========================
// 🌫️ ATMOSPHERE LAYERS
// =========================
function createAtmosphereLayer(radius, color, opacity) {
  const geometry = new THREE.SphereGeometry(radius, 64, 64);

  const material = new THREE.MeshBasicMaterial({
    color: color,
    transparent: true,
    opacity: opacity,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  return new THREE.Mesh(geometry, material);
}


  // =========================
// 🌫️ ATMOSPHERE (REALISTIC LAYERS)
// =========================

// capa baja (troposfera visual)
const atm1 = createAtmosphereLayer(1.03, 0x4aa3ff, 0.25);

// estratosfera (más difusa)
const atm2 = createAtmosphereLayer(1.06, 0x2f7bff, 0.12);

// borde superior (ionosfera glow)
const atm3 = createAtmosphereLayer(1.12, 0x1a3cff, 0.06);

earth.add(atm1);
earth.add(atm2);
earth.add(atm3);


  // glow extra hacia borde de planeta
const glowGeometry = new THREE.SphereGeometry(1.02, 64, 64);

const glowMaterial = new THREE.MeshBasicMaterial({
  color: 0x6fb6ff,
  transparent: true,
  opacity: 0.08,
  side: THREE.BackSide,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const atmosphereGlow = new THREE.Mesh(glowGeometry, glowMaterial);
earth.add(atmosphereGlow);

// =========================
// 🌐 ECUADOR
// =========================
const equator = createLatCircle(1.01, 0);
earth.add(equator);

// =========================
// 🌐 MERIDIANO GREENWICH
// =========================
const greenwich = createLonCircle(1.01, 0);
earth.add(greenwich);

// =========================
// 🌐 MERIDIANOS EXTRA (opcional visual)
// =========================
for (let lon = -180; lon <= 180; lon += 30) {
  const meridian = createLonCircle(1.01, lon);
  earth.add(meridian);
}
function createPoleLabel(text, color = 0x66ccff) {

  const canvas = document.createElement("canvas");
  const size = 256;
  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, size, size);

  ctx.font = "bold 140px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // glow más limpio (menos “mancha”, más ciencia)
  ctx.shadowColor = "#66ccff";
  ctx.shadowBlur = 25;

  ctx.fillStyle = "#66ccff";
  ctx.fillText(text, size / 2, size / 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.needsUpdate = true;

  const material = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthWrite: false,
    depthTest: false, // 👈 importante para que no “se esconda” en la esfera
    blending: THREE.AdditiveBlending
  });

  const sprite = new THREE.Sprite(material);

  // 👇 más fino y menos “pegado”
  sprite.scale.set(0.22, 0.22, 0.22);

  return sprite;
}


  // =========================
// 🧭 POLOS NORTE / SUR
// =========================

const POLE_OFFSET = 1.08; // 👈 separación real de la superficie

const northPole = createPoleLabel("N");
northPole.position.copy(latLonToVec3(90, 0, POLE_OFFSET));
earth.add(northPole);

const southPole = createPoleLabel("S");
southPole.position.copy(latLonToVec3(-90, 0, POLE_OFFSET));
earth.add(southPole);

  // Madrid pin
  const pin = new THREE.Mesh(
    new THREE.SphereGeometry(0.02, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xff0000 })
  );

  pin.position.copy(latLonToVec3(40.4168, -3.7038, 1.01));
  earth.add(pin);

  // =========================
  // UI
  // =========================
  const select = document.getElementById("satSelect");

  for(const id in SAT_INFO){
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = SAT_INFO[id].name;
    select.appendChild(opt);
  }

  select.value = currentSat;

select.addEventListener("change", async (e)=>{
  currentSat = e.target.value;

  if (!satrecs[currentSat]) {
    await loadTLE(currentSat);
  }

  updateUI();
});

  updateUI();

  // 🔥 SOLO CARGAR ISS AL INICIO
 // loadTLE("25544");

  document.getElementById("calcBtn").addEventListener("click", () => {
  loadSelectedSatellite();
});

  // controls
  window.addEventListener("wheel",(e)=>{
    targetDistance += e.deltaY * 0.002;
    targetDistance = Math.max(1.8, Math.min(8, targetDistance));
  });

  window.addEventListener("mousedown",()=> isDragging = true);
  window.addEventListener("mouseup",()=> isDragging = false);

  window.addEventListener("mousemove",(e)=>{
    if(!isDragging) return;
    targetRotY += e.movementX * 0.005;
    targetRotX += e.movementY * 0.005;
  });

  window.addEventListener("resize", onResize);
}





function createLatCircle(radius, lat, segments = 128) {
  const points = [];

  const phi = THREE.MathUtils.degToRad(90 - lat);

  for (let i = 0; i <= segments; i++) {
    const theta = (i / segments) * Math.PI * 2;

    const x = radius * Math.sin(phi) * Math.cos(theta);
    const y = radius * Math.cos(phi);
    const z = radius * Math.sin(phi) * Math.sin(theta);

    points.push(new THREE.Vector3(x, y, z));
  }

  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const material = new THREE.LineBasicMaterial({
    color: 0x00ffff,
    transparent: true,
    opacity: 0.35,
      blending: THREE.AdditiveBlending,
  depthWrite: false
  });

  return new THREE.LineLoop(geometry, material);
}


  function createLonCircle(radius, lon, segments = 128) {
  const points = [];

  const theta = THREE.MathUtils.degToRad(lon + 180);

  for (let i = 0; i <= segments; i++) {
    const phi = (i / segments) * Math.PI;

    const x = radius * Math.sin(phi) * Math.cos(theta);
    const y = radius * Math.cos(phi);
    const z = radius * Math.sin(phi) * Math.sin(theta);

    points.push(new THREE.Vector3(x, y, z));
  }

  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const material = new THREE.LineBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.15,
      blending: THREE.AdditiveBlending,
  depthWrite: false
  });

  return new THREE.Line(geometry, material);
}



  

  function loadSelectedSatellite() {
  const id = document.getElementById("satSelect").value;

  if (!id) return;

  if (!satrecs[id]) {
    loadTLE(id);
  }

  currentSat = id;
  updateUI();
}

// ======================================================
// 🛰️ TLE LOADER (FIXED + CACHE)
// ======================================================
async function loadTLE(id){

  if (TLE_CACHE[id]) {
    satrecs[id] = TLE_CACHE[id];
    createSatMesh(id);
    return;
  }

  const url = `https://celestrak.org/NORAD/elements/gp.php?CATNR=${id}&FORMAT=tle`;
  const res = await fetch(url);
  const text = await res.text();

  const lines = text.trim().split("\n");
  if(lines.length < 3) return;

  const satrec = satellite.twoline2satrec(lines[1], lines[2]);

  TLE_CACHE[id] = satrec;
  satrecs[id] = satrec;

  createSatMesh(id);
}

// ======================================================
// 🛰️ CREATE VISUAL SATELLITE
// ======================================================
function createSatMesh(id){

  if (satMeshes[id]) return;

  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.03, 10, 10),
    new THREE.MeshBasicMaterial({ color: getColor(id) })
  );

  scene.add(mesh);
  satMeshes[id] = mesh;
}

// ======================================================
// 🛰️ UPDATE SATELLITES
// ======================================================
function updateSatellites(){

  const now = new Date();
  const gmst = satellite.gstime(now);

  for(const id in satrecs){

    const satrec = satrecs[id];
    const pv = satellite.propagate(satrec, now);
    if(!pv.position) continue;

    const geo = satellite.eciToGeodetic(pv.position, gmst);

    const lat = satellite.degreesLat(geo.latitude);
    const lon = satellite.degreesLong(geo.longitude);

    const mesh = satMeshes[id];
    if(!mesh) continue;

    mesh.position.copy(latLonToVec3(lat, lon, 1.4));

    if(id === currentSat){
      mesh.scale.set(2,2,2);
      mesh.material.color.set(0x00ff00);
    } else {
      mesh.scale.set(1,1,1);
      mesh.material.color.set(getColor(id));
    }
  }
}

// ======================================================
// 🌍 LATLON
// ======================================================
function latLonToVec3(lat, lon, r){

  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon + 180);

  return new THREE.Vector3(
    -(r * Math.sin(phi) * Math.cos(theta)),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

// ======================================================
// 🧠 UI
// ======================================================
function updateUI(){
  const sat = SAT_INFO[currentSat];
  document.getElementById("satInfo").innerHTML =
    `<b>${sat.name}</b><br>${sat.type}<br>${sat.mission}`;
}

// ======================================================
// 🔁 LOOP
// ======================================================
function animate(){

  requestAnimationFrame(animate);

  const now = new Date();

  // 🌍 EARTH ROTATION (UNCHANGED)
  const elapsedSeconds = (Date.now() - startTime) / 1000;
  const rotation = (elapsedSeconds / 86400) * (2 * Math.PI);
  earthGroup.rotation.y = rotation;

  // ☀️ SUN (NO TOUCH - STABLE SYSTEM)
  const dayOfYear = Math.floor(
    (now - new Date(now.getFullYear(),0,0)) / 86400000
  );

  const decl = THREE.MathUtils.degToRad(
    23.44 * Math.sin((2*Math.PI/365) * (dayOfYear - 81))
  );

  const frac = (now.getTime() % 86400000) / 86400000;
  const angle = frac * Math.PI * 2;

  const sunDir = new THREE.Vector3(
    Math.cos(angle),
    Math.sin(decl),
    Math.sin(angle)
  ).normalize();

  sunLight.position.copy(sunDir.clone().multiplyScalar(50));
  sunLight.target.position.set(0,0,0);

  // 🛰️ SATELLITES
  updateSatellites();

  // 🎥 CAMERA
  rotY += (targetRotY-rotY)*0.08;
  rotX += (targetRotX-rotX)*0.08;
  distance += (targetDistance-distance)*0.08;

  camera.position.x = distance*Math.cos(rotX)*Math.sin(rotY);
  camera.position.y = distance*Math.sin(rotX);
  camera.position.z = distance*Math.cos(rotX)*Math.cos(rotY);

  camera.lookAt(0,0,0);

  renderer.render(scene,camera);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

</script>
