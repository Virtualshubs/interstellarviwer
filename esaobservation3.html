<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ESA DATA v0.3</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
background:#0b1018;color:#fff;height:100vh;
display:flex;justify-content:center;align-items:center
}

#panel{
width:100vh;height:99vh;background:#141b25;
border:1px solid #2b3647;border-radius:12px;
display:flex;flex-direction:column;overflow:hidden
}

#header{
background:#182230;padding:14px 18px;
display:flex;gap:10px;align-items:center
}

#search{
flex:1;padding:10px;background:#0f1622;color:#fff;
border:1px solid #33435b;border-radius:6px
}

button{
background:#ff8c00;color:#fff;border:none;
padding:10px 16px;border-radius:6px;
cursor:pointer;font-weight:bold
}

#status{
padding:8px 18px;
border-bottom:1px solid #263240;
color:#8fb8ff
}

#content{
display:grid;
grid-template-columns:420px 1fr;
height:100%
}

#cards,#detail{
overflow:auto;
padding:16px
}

.card{
background:#1a2432;
border:1px solid #2d3d52;
border-radius:8px;
padding:14px;
margin-bottom:12px
}

.card h3{
color:#ffb04d;
margin-bottom:8px
}

.card p{
font-size:13px;
color:#cfd8e6;
margin:4px 0
}

.open{margin-top:10px}

.row{
display:flex;
padding:7px 0;
border-bottom:1px solid rgba(255,255,255,.08)
}

.key{
width:170px;
color:#7bc3ff;
font-weight:bold
}

.value{
flex:1;
word-break:break-word
}

input{
background:#0f1622;
border:1px solid #33435b;
color:#fff;
padding:6px;
border-radius:5px;
width:180px
}

details{margin-top:18px}

pre{
white-space:pre-wrap;
font-size:12px
}

#queryBox{
margin-top:20px;
padding:12px;
border:1px solid #2d3d52;
border-radius:8px;
background:#111923
}

  #dataGrid{

display:grid;
grid-template-columns:repeat(4,55px);
gap:5px;
margin-top:15px;

}


.dataCell{

height:55px;

display:flex;
align-items:center;
justify-content:center;

font-size:11px;

cursor:pointer;

border-radius:6px;

color:white;

background:#222;

}

</style>
</head>

<body>

<div id="panel">
  <div id="header">
    <input id="search" value="Biomass">
    <button id="load">SEARCH</button>
  </div>

  <div id="status">Ready</div>

  <div id="content">
    <div id="cards"></div>

    <div id="detail">
      <h2>Select a collection</h2>
      <div id="meta"></div>
      <div id="queryBox"></div>

      <details>
        <summary>Raw JSON</summary>
        <pre id="raw"></pre>
      </details>

    </div>
  </div>
</div>
  
<script>

const BASE="https://catalog.maap.eo.esa.int/catalogue";

let collections=[];
let activeDataset=null;

let observationGrid=[];
let currentItems=[];


// ===============================
// LOAD CATALOG
// ===============================

document.getElementById("load").onclick=load;


async function load(){

const q=document.getElementById("search").value.trim();

document.getElementById("status").textContent="Loading...";


const res=await fetch(
`${BASE}/collections?q=${encodeURIComponent(q)}`
);


const data=await res.json();


collections=data.collections||[];


renderCards();


document.getElementById("status").textContent=
`${collections.length} collections`;

}


// ===============================
// RENDER COLLECTION CARDS
// ===============================

function renderCards(){

const c=document.getElementById("cards");

c.innerHTML="";


collections.forEach(col=>{

const d=document.createElement("div");

d.className="card";


d.innerHTML=`

<h3>${col.id}</h3>

<p><b>${col.title||""}</b></p>

<p>
${(col.description||"").substring(0,180)}...
</p>

<button class="open">
OPEN
</button>

`;


d.querySelector("button").onclick=
()=>show(col);


c.appendChild(d);

});

}


// ===============================
// SHOW COLLECTION
// ===============================

function show(col){

const meta=document.getElementById("meta");

meta.innerHTML="";


document.getElementById("queryBox").innerHTML="";


add(meta,"ID",col.id);
add(meta,"Title",col.title);
add(meta,"Version",col.version);
add(meta,"Created",col.created);
add(meta,"Updated",col.updated);
add(meta,"Description",col.description);


if(col.keywords)
add(meta,"Keywords",col.keywords.join(", "));



activeDataset=parseCollection(col);



add(meta,"DATA START",activeDataset.startDate||"");
add(meta,"DATA END",activeDataset.endDate||"");


document.getElementById("raw").textContent=
JSON.stringify(col,null,2);



loadItems(activeDataset);

}


// ===============================
// PARSE COLLECTION
// ===============================

function parseCollection(col){

return{

id:col.id,

title:col.title,


startDate:
col.extent?.temporal?.interval?.[0]?.[0]||null,


endDate:
col.extent?.temporal?.interval?.[0]?.[1]||null,


items:
col.links?.find(
l=>l.rel==="items"
)?.href||null


};

}


// ===============================
// LOAD AVAILABLE ITEMS
// ===============================

async function loadItems(data){

if(!data.items)
return;


document.getElementById("status").textContent=
"Reading dataset...";


try{


const url=
`${data.items}?limit=100`;


console.log("ITEM QUERY:",url);


const res=await fetch(url);


const json=await res.json();



console.log("ITEMS:",json);



renderAvailableData(json);



document.getElementById("raw").textContent=
JSON.stringify(json,null,2);



document.getElementById("status").textContent=
`${json.numberMatched||json.features.length} products indexed`;



}


catch(e){

console.error(e);

document.getElementById("status").textContent=
"Items error";

}


}



// ===============================
// BUILD AVAILABLE DATA + CELLS
// ===============================

function renderAvailableData(json){

const box=document.getElementById("queryBox");


box.innerHTML=`

<h3 style="color:#ffb04d;margin-bottom:12px">
AVAILABLE DATA
</h3>

`;



if(!json.features||json.features.length===0){

box.innerHTML+=`
<p>No products found</p>
`;

return;

}


// guardar observaciones

currentItems=json.features;



const dates={};



json.features.forEach(item=>{


const dt=
item.properties?.datetime;


if(!dt)
return;


const day=
dt.split("T")[0];


if(!dates[day])
dates[day]=0;


dates[day]++;


});



Object.keys(dates)
.sort()
.forEach(date=>{


const r=document.createElement("div");


r.className="row";


r.innerHTML=`

<div class="key">
${date}
</div>

<div class="value">
${dates[date]} observations
</div>

`;


box.appendChild(r);


});


// NUEVA CAPA CELDAS

const title=document.createElement("h3");

title.style.color="#66ccff";
title.style.marginTop="20px";

title.textContent="DATA CELLS";


box.appendChild(title);



const grid=document.createElement("div");

grid.id="dataGrid";


box.appendChild(grid);



createDataGrid(json.features);


}



// ===============================
// CREATE DATA GRID
// ===============================

function createDataGrid(items){


const grid=document.getElementById("dataGrid");

grid.innerHTML="";


observationGrid=[];


const size=4;



for(let y=0;y<size;y++){


for(let x=0;x<size;x++){



const cell={


x,
y,


state:-1,


items:[],


latMin:
-90 + y*(180/size),


latMax:
-90 +(y+1)*(180/size),


lonMin:
-180+x*(360/size),


lonMax:
-180+(x+1)*(360/size)


};



observationGrid.push(cell);



const div=document.createElement("div");

div.className="dataCell";


div.textContent=
`${x},${y}`;



div.onclick=
()=>showCellData(cell);



grid.appendChild(div);



}

}



// asignar observaciones

items.forEach(item=>{


const geom=item.geometry;


if(!geom)
return;



let coords=null;



if(geom.type==="Point")
coords=geom.coordinates;



if(!coords)
return;



const lon=coords[0];
const lat=coords[1];



const cell=
observationGrid.find(c=>

lat>=c.latMin &&
lat<c.latMax &&
lon>=c.lonMin &&
lon<c.lonMax

);



if(cell){

cell.state=0;

cell.items.push(item);

}


});



updateGrid();



createGridSearch();



}



function createDataGrid(items){

const grid=document.getElementById("dataGrid");

grid.innerHTML="";


observationGrid=[];


// agrupamos por fecha

const dates={};


items.forEach(item=>{


const dt=item.properties?.datetime;


if(!dt) return;


const day=dt.split("T")[0];


if(!dates[day])
dates[day]=[];


dates[day].push(item);


});



// crear una celda por fecha

Object.keys(dates)
.sort()
.forEach((date,i)=>{


const cell={

id:i,

date,

state:0,

items:dates[date]

};


observationGrid.push(cell);



const div=document.createElement("div");

div.className="dataCell";


div.textContent=
`${date}\n${cell.items.length} obs`;



div.style.background="#16803c";


div.onclick=
()=>showCellData(cell);



grid.appendChild(div);



});


}


// ===============================
// FILTER CELL
// ===============================

function searchGrid(){


const lat=
Number(document.getElementById("gridLat").value);


const lon=
Number(document.getElementById("gridLon").value);



observationGrid.forEach(c=>{


if(

lat>=c.latMin &&
lat<c.latMax &&
lon>=c.lonMin &&
lon<c.lonMax &&
c.items.length

){

c.state=1;

}

else if(c.items.length){

c.state=0;

}

else{

c.state=-1;

}


});


updateGrid();


}



// ===============================
// UPDATE COLORS
// ===============================

function updateGrid(){


const cells=
document.querySelectorAll(".dataCell");


cells.forEach((div,i)=>{


const cell=
observationGrid[i];



if(cell.state===-1){

div.style.background="#222";

}


if(cell.state===0){

div.style.background="#16803c";

}


if(cell.state===1){

div.style.background="#ff8c00";

}



});


}



// ===============================
// SHOW CELL DATA
// ===============================

function showCellData(cell){


document.getElementById("raw").textContent=

JSON.stringify(

{

cell,

observations:cell.items

},

null,
2

);


}



// ===============================
// ADD ROW
// ===============================

function add(container,key,value){

if(value===undefined)
return;


const r=document.createElement("div");


r.className="row";


r.innerHTML=`

<div class="key">${key}</div>
<div class="value">${value}</div>

`;


container.appendChild(r);

}


</script>
</body>
</html>
