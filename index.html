<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

<script>

let scene, camera, renderer;
let currentObject = null;

let isDragging = false;
let prevMouse = { x: 0, y: 0 };

let distance = 6;
let rotationY = 0;
let rotationX = 0;

init();

function init() {

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  camera.position.z = distance;

  addControls();
  animate();
}

/* =========================
   CONTROLES DE CÁMARA
========================= */

function addControls() {

  // ROTACIÓN
  window.addEventListener("mousedown", (e) => {
    isDragging = true;
    prevMouse.x = e.clientX;
    prevMouse.y = e.clientY;
  });

  window.addEventListener("mouseup", () => {
    isDragging = false;
  });

  window.addEventListener("mousemove", (e) => {
    if (!isDragging || !currentObject) return;

    rotationY += (e.clientX - prevMouse.x) * 0.005;
    rotationX += (e.clientY - prevMouse.y) * 0.005;

    prevMouse.x = e.clientX;
    prevMouse.y = e.clientY;
  });

  // ZOOM
  window.addEventListener("wheel", (e) => {
    distance += e.deltaY * 0.01;
    distance = Math.max(2, Math.min(20, distance));
  });
}

/* =========================
   LOOP
========================= */

function animate() {

  requestAnimationFrame(animate);

  if (currentObject) {
    currentObject.rotation.y = rotationY;
    currentObject.rotation.x = rotationX;
  }

  camera.position.z += (distance - camera.position.z) * 0.1;

  renderer.render(scene, camera);
}

/* =========================
   DETECTOR (simple + estable)
========================= */

function detectType(text) {

  let starScore = 0;
  let galaxyScore = 0;

  if (/Spectral type|Parallaxes|Proper motions/i.test(text)) starScore += 4;
  if (/Fluxes|V\s+[0-9.]+/i.test(text)) starScore += 2;

  if (/NGC|IC/i.test(text)) galaxyScore += 4;
  if (/redshift|Morphological|Sb|Sa|Sc/i.test(text)) galaxyScore += 3;
  if (/HII|Galaxy/i.test(text)) galaxyScore += 2;

  return starScore >= galaxyScore ? "star" : "galaxy";
}

/* =========================
   TEMPERATURA → COLOR REALISTA
========================= */

function temperatureToColor(temp) {

  // simplificación tipo Kelvin → RGB

  let r, g, b;

  temp = temp / 100;

  if (temp <= 66) {
    r = 255;
    g = 99.4708 * Math.log(temp) - 161.1196;
    b = temp <= 19 ? 0 : 138.5177 * Math.log(temp - 10) - 305.0448;
  } else {
    r = 329.6987 * Math.pow(temp - 60, -0.1332);
    g = 288.1222 * Math.pow(temp - 60, -0.0755);
    b = 255;
  }

  return new THREE.Color(
    clamp(r)/255,
    clamp(g)/255,
    clamp(b)/255
  );
}

function clamp(x) {
  return Math.max(0, Math.min(255, x));
}

/* =========================
   ESTRELLA
========================= */

function parseStar(text) {

  const get = (r) => (text.match(r)?.[1] || null);

  const spectral = get(/Spectral type:\s*([A-Z0-9]+)/i);

  return {
    spectral,
    parallax: parseFloat(get(/Parallaxes?.*?:\s*([0-9.]+)/i)),
    V: parseFloat(get(/\bV\s+([0-9.]+)/)),
    binary: /\*\*|Double|Multiple/i.test(text)
  };
}

function spectralToTemp(type) {

  if (!type) return 5800;

  if (type.startsWith("O")) return 30000;
  if (type.startsWith("B")) return 15000;
  if (type.startsWith("A")) return 9000;
  if (type.startsWith("F")) return 7000;
  if (type.startsWith("G")) return 5800;
  if (type.startsWith("K")) return 4500;
  if (type.startsWith("M")) return 3200;

  return 5800;
}

/* =========================
   GALAXIA
========================= */

function createGalaxy() {

  const group = new THREE.Group();

  for (let i = 0; i < 2000; i++) {

    const t = i * 0.15;
    const r = 0.005 * i;

    const x = Math.cos(t) * r;
    const z = Math.sin(t) * r;

    const star = new THREE.Mesh(
      new THREE.SphereGeometry(0.01),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );

    star.position.set(x, (Math.random()-0.5)*0.2, z);

    group.add(star);
  }

  return group;
}

/* =========================
   GENERADOR
========================= */

function generateObject() {

  const text = document.getElementById("input").value;
  const info = document.getElementById("info");

  const type = detectType(text);

  if (currentObject) scene.remove(currentObject);

  if (type === "star") {

    const s = parseStar(text);

    const temp = spectralToTemp(s.spectral);
    const color = temperatureToColor(temp);

    const size = s.V ? Math.max(0.5, 3 - s.V * 0.2) : 1.2;

    const geo = new THREE.SphereGeometry(size, 32, 32);

    const mat = new THREE.MeshStandardMaterial({
      color: color,
      emissive: color,
      emissiveIntensity: 1.5
    });

    currentObject = new THREE.Mesh(geo, mat);
    scene.add(currentObject);

    info.innerHTML =
      `⭐ STAR<br>
      Spectral: ${s.spectral}<br>
      Temp: ${temp}K<br>
      Binary: ${s.binary}<br>
      Distance proxy: ${(s.parallax ? (1/s.parallax).toFixed(2) : "unknown")}`;

    if (s.binary) {
      const geo2 = new THREE.SphereGeometry(size * 0.6, 32, 32);
      const mat2 = new THREE.MeshStandardMaterial({ color: 0xffffff });

      const star2 = new THREE.Mesh(geo2, mat2);
      star2.position.x = size * 2;

      scene.add(star2);
    }
  }

  else {

    currentObject = createGalaxy();
    scene.add(currentObject);

    info.innerHTML = `🌌 GALAXY`;
  }

  camera.position.z = distance;
}

</script>
