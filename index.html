<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Star Visualizer</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050914;
  color: white;
  overflow: hidden;
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 360px;
  z-index: 10;
}

textarea {
  width: 100%;
  height: 240px;
  background: #0b1220;
  color: white;
  border: 1px solid #2a3a5a;
  padding: 10px;
  border-radius: 8px;
  font-size: 12px;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  background: #4a6cff;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 8px;
}

#info {
  margin-top: 10px;
  font-size: 12px;
  opacity: 0.85;
  line-height: 1.4;
}

canvas { display: block; }
</style>
</head>

<body>

<div id="ui">
  <textarea id="input" placeholder="Pega aquí datos SIMBAD / Gaia / galaxias..."></textarea>
  <button onclick="generateObject()">Previsualizar objeto</button>
  <div id="info"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

<script>

let scene, camera, renderer;
let currentObject;

const SUN_SCALE = 1;

init();

function init() {

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  camera.position.z = 6;

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  animate();
}

function animate() {
  requestAnimationFrame(animate);

  if (currentObject) currentObject.rotation.y += 0.002;

  renderer.render(scene, camera);
}

/* =========================
   DETECTOR ROBUSTO
========================= */

function detectType(text) {

  let starScore = 0;
  let galaxyScore = 0;

  // =========================
  // ⭐ EVIDENCIA ESTRELLA
  // =========================
  if (/Spectral type/i.test(text)) starScore += 3;
  if (/Parallaxes/i.test(text)) starScore += 3;
  if (/Proper motions/i.test(text)) starScore += 2;
  if (/Radial velocity/i.test(text)) starScore += 1;
  if (/Fluxes/i.test(text)) starScore += 1;

  // =========================
  // 🌌 EVIDENCIA GALAXIA
  // =========================
  if (/NGC|IC\b/.test(text)) galaxyScore += 4;
  if (/Galaxy/i.test(text)) galaxyScore += 3;
  if (/redshift|z\(emission|cz/i.test(text)) galaxyScore += 3;
  if (/Morphological type/i.test(text)) galaxyScore += 3;
  if (/Sb|Sa|Sc\b/.test(text)) galaxyScore += 1;
  if (/HII/i.test(text)) galaxyScore += 1;

  // =========================
  // DECISIÓN FINAL
  // =========================
  if (starScore >= galaxyScore && starScore > 0) {
    return "star";
  }

  if (galaxyScore > starScore) {
    return "galaxy";
  }

  return "star";
}

/* =========================
   PARSER ESTRELLA
========================= */

function parseStar(text) {

  const get = (r) => (text.match(r)?.[1] || null);

  return {
    spectral: get(/Spectral type:\s*([A-Z0-9]+)/i),
    parallax: parseFloat(get(/Parallaxes?.*?:\s*([0-9.]+)/i)),
    B: parseFloat(get(/\bB\s+([0-9.]+)/)),
    V: parseFloat(get(/\bV\s+([0-9.]+)/)),
    G: parseFloat(get(/\bG\s+([0-9.]+)/)),
    binary: /\*\*|Double|Multiple/i.test(text)
  };
}

/* =========================
   EMISIVIDAD
========================= */

function getEmission(type) {
  if (!type) return 1.2;

  if (type.startsWith("O")) return 3.0;
  if (type.startsWith("B")) return 2.5;
  if (type.startsWith("A")) return 2.0;
  if (type.startsWith("F")) return 1.5;
  if (type.startsWith("G")) return 1.2;
  if (type.startsWith("K")) return 0.8;
  if (type.startsWith("M")) return 0.5;

  return 1;
}

/* =========================
   MODELO ESTRELLA
========================= */

function buildStar(s) {

  let color = 0xffffff;

  if (s.spectral?.startsWith("O")) color = 0x9bbcff;
  else if (s.spectral?.startsWith("B")) color = 0xaecbff;
  else if (s.spectral?.startsWith("A")) color = 0xcfe8ff;
  else if (s.spectral?.startsWith("F")) color = 0xfff2cc;
  else if (s.spectral?.startsWith("G")) color = 0xffe08a;
  else if (s.spectral?.startsWith("K")) color = 0xffb36b;
  else if (s.spectral?.startsWith("M")) color = 0xff6b6b;

  let size = s.V ? Math.max(0.5, 3 - s.V * 0.2) : 1.2;

  return {
    color,
    size,
    emission: getEmission(s.spectral),
    binary: s.binary
  };
}

/* =========================
   GALAXIA MEJORADA
========================= */

function createGalaxy() {

  const group = new THREE.Group();

  const arms = 2;

  for (let i = 0; i < 2000; i++) {

    const t = i * 0.15;
    const r = 0.005 * i;

    const arm = (i % arms) * Math.PI;

    const x = Math.cos(t + arm) * r;
    const z = Math.sin(t + arm) * r;

    const star = new THREE.Mesh(
      new THREE.SphereGeometry(0.008),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );

    star.position.set(
      x + (Math.random()-0.5)*0.02,
      (Math.random()-0.5)*0.1,
      z + (Math.random()-0.5)*0.02
    );

    group.add(star);
  }

  return group;
}

/* =========================
   RENDER PRINCIPAL
========================= */

function generateObject() {

  const text = document.getElementById("input").value;
  const info = document.getElementById("info");

  const type = detectType(text);

  if (currentObject) scene.remove(currentObject);

  /* ================= STAR ================= */
  if (type === "star") {

    const s = parseStar(text);
    const star = buildStar(s);

    const geo = new THREE.SphereGeometry(star.size, 32, 32);

    const mat = new THREE.MeshStandardMaterial({
      color: star.color,
      emissive: star.color,
      emissiveIntensity: star.emission
    });

    currentObject = new THREE.Mesh(geo, mat);

    info.innerHTML =
      `⭐ STAR<br>
      Spectral: ${s.spectral}<br>
      Binary: ${s.binary}<br>
      Emission: ${star.emission}<br>
      ☀ ~ ${(star.size / SUN_SCALE).toFixed(2)}x Sol`;

    if (s.binary) {
      const geo2 = new THREE.SphereGeometry(star.size * 0.6, 32, 32);
      const mat2 = new THREE.MeshStandardMaterial({ color: 0xffffff });

      const star2 = new THREE.Mesh(geo2, mat2);
      star2.position.x = star.size * 2;

      scene.add(star2);
    }

  }

  /* ================= GALAXY ================= */
  else if (type === "galaxy") {

    currentObject = createGalaxy();

    info.innerHTML = `🌌 GALAXY detected (spiral render)`;
  }

  scene.add(currentObject);
  camera.position.z = 6;
}

</script>

</body>
</html>
