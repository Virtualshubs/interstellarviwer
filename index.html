<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Star / Galaxy Visualizer</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050914;
  color: white;
  overflow: hidden;
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 360px;
  z-index: 10;
}

textarea {
  width: 100%;
  height: 240px;
  background: #0b1220;
  color: white;
  border: 1px solid #2a3a5a;
  padding: 10px;
  border-radius: 8px;
  font-size: 12px;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  background: #4a6cff;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 8px;
}

#info {
  margin-top: 10px;
  font-size: 12px;
  opacity: 0.85;
  line-height: 1.4;
}

canvas { display: block; }
</style>
</head>

<body>

<div id="ui">
  <textarea id="input"></textarea>
  <button onclick="generateObject()">Previsualizar objeto</button>
  <div id="info"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

<script>

let scene, camera, renderer;
let currentObject, currentGlow;

let distance = 6;
let rotX = 0;
let rotY = 0;

let dragging = false;
let last = {x:0,y:0};

init();

function init() {

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  camera.position.z = distance;

  addControls();
  animate();
}

/* =========================
   CONTROLES
========================= */

function addControls() {

  window.addEventListener("mousedown", e => {
    dragging = true;
    last.x = e.clientX;
    last.y = e.clientY;
  });

  window.addEventListener("mouseup", () => dragging = false);

  window.addEventListener("mousemove", e => {
    if (!dragging || !currentObject) return;

    rotY += (e.clientX - last.x) * 0.005;
    rotX += (e.clientY - last.y) * 0.005;

    last.x = e.clientX;
    last.y = e.clientY;
  });

  window.addEventListener("wheel", e => {
    distance += e.deltaY * 0.01;
    distance = Math.max(2, Math.min(20, distance));
  });
}

/* =========================
   LOOP
========================= */

function animate() {
  requestAnimationFrame(animate);

  if (currentObject) {
    currentObject.rotation.y = rotY;
    currentObject.rotation.x = rotX;
  }

  if (currentGlow) {
    currentGlow.rotation.copy(currentObject.rotation);
  }

  camera.position.z += (distance - camera.position.z) * 0.1;

  renderer.render(scene, camera);
}

/* =========================
   ⭐ DETECTOR REAL FIX
========================= */

function detectType(text) {

  // 🔥 HARD LOCK: ESTRELLAS (catálogos)
  if (/HD|BD|TYC|HIP|Gaia|V\*/i.test(text)) return "star";

  // 🔥 HARD LOCK: GALAXIAS
  if (/NGC|IC\b|LEDA|PGC/i.test(text)) return "galaxy";

  // SCORE SYSTEM (fallback)
  let starScore = 0;
  let galaxyScore = 0;

  if (/Spectral type/i.test(text)) starScore += 5;
  if (/Parallaxes/i.test(text)) starScore += 5;
  if (/Proper motions/i.test(text)) starScore += 4;

  if (/Morphological type/i.test(text)) galaxyScore += 5;
  if (/redshift|cz|z\(emission\)/i.test(text)) galaxyScore += 5;

  return starScore >= galaxyScore ? "star" : "galaxy";
}

/* =========================
   TEMPERATURA
========================= */

function spectralToTemp(s){

  if(!s) return 5800;

  if(s.startsWith("O")) return 30000;
  if(s.startsWith("B")) return 15000;
  if(s.startsWith("A")) return 9000;
  if(s.startsWith("F")) return 7000;
  if(s.startsWith("G")) return 5800;
  if(s.startsWith("K")) return 4500;
  if(s.startsWith("M")) return 3200;

  return 5800;
}

/* =========================
   BLACKBODY
========================= */

function tempToColor(temp) {

  temp = temp / 100;

  let r,g,b;

  if (temp <= 66) {
    r = 255;
    g = 99.47 * Math.log(temp) - 161.12;
    b = temp <= 19 ? 0 : 138.52 * Math.log(temp-10) - 305.04;
  } else {
    r = 329.7 * Math.pow(temp - 60, -0.133);
    g = 288.1 * Math.pow(temp - 60, -0.075);
    b = 255;
  }

  return new THREE.Color(
    clamp(r)/255,
    clamp(g)/255,
    clamp(b)/255
  );
}

function clamp(x){
  return Math.max(0,Math.min(255,x));
}

/* =========================
   PARSER
========================= */

function parseStar(text){

  const get = r => (text.match(r)?.[1] || null);

  return {
    spectral: get(/Spectral type:\s*([A-Z0-9]+)/i),
    parallax: parseFloat(get(/Parallaxes?.*?:\s*([0-9.]+)/i)),
    V: parseFloat(get(/\bV\s+([0-9.]+)/)),
    B: parseFloat(get(/\bB\s+([0-9.]+)/)),
    J: parseFloat(get(/\bJ\s+([0-9.]+)/)),
    K: parseFloat(get(/\bK\s+([0-9.]+)/)),
    binary: /\*\*|Double|Multiple/i.test(text)
  };
}

/* =========================
   GALAXY
========================= */

function createGalaxy(){

  const g = new THREE.Group();

  for(let i=0;i<2500;i++){

    const t = i * 0.15;
    const r = 0.005 * i;

    const arm = (i % 2) * Math.PI;

    const x = Math.cos(t + arm) * r;
    const z = Math.sin(t + arm) * r;

    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.008),
      new THREE.MeshBasicMaterial({color:0xffffff})
    );

    m.position.set(
      x + (Math.random()-0.5)*0.02,
      (Math.random()-0.5)*0.2,
      z + (Math.random()-0.5)*0.02
    );

    g.add(m);
  }

  return g;
}

/* =========================
   MAIN
========================= */

function generateObject(){

  const text = document.getElementById("input").value;
  const info = document.getElementById("info");

  const type = detectType(text);

  if(currentObject) scene.remove(currentObject);
  if(currentGlow) scene.remove(currentGlow);

  if(type === "star"){

    const s = parseStar(text);

    let temp = spectralToTemp(s.spectral);

    // photometry correction
    if(s.B && s.V) temp *= (1 - 0.04 * (s.B - s.V));
    if(s.J && s.K) temp *= (1 - 0.02 * (s.J - s.K));

    const color = tempToColor(temp);

    const size = s.V ? Math.max(0.5, 3 - s.V * 0.2) : 1.2;

    const geo = new THREE.SphereGeometry(size,32,32);

    const mat = new THREE.MeshBasicMaterial({color});

    currentObject = new THREE.Mesh(geo,mat);
    scene.add(currentObject);

    currentGlow = new THREE.Mesh(
      new THREE.SphereGeometry(size*1.4,32,32),
      new THREE.MeshBasicMaterial({
        color,
        transparent:true,
        opacity:0.25
      })
    );

    scene.add(currentGlow);

    info.innerHTML =
      `⭐ STAR<br>
      Spectral: ${s.spectral}<br>
      Temp: ${Math.round(temp)}K<br>
      Parallax: ${s.parallax}<br>
      Binary: ${s.binary}<br>
      Size: ${(size).toFixed(2)}x Sun`;

  } else {

    currentObject = createGalaxy();
    scene.add(currentObject);

    info.innerHTML = "🌌 GALAXY detected";
  }

  camera.position.z = distance;
}

</script>

</body>
</html>
