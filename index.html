<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Star Visualizer</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050914;
  color: white;
  overflow: hidden;
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 360px;
  z-index: 10;
}

textarea {
  width: 100%;
  height: 240px;
  background: #0b1220;
  color: white;
  border: 1px solid #2a3a5a;
  padding: 10px;
  border-radius: 8px;
  font-size: 12px;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  background: #4a6cff;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 8px;
}

#info {
  margin-top: 10px;
  font-size: 12px;
  opacity: 0.8;
}

canvas {
  display: block;
}
</style>
</head>

<body>

<div id="ui">
  <textarea id="input" placeholder="Pega aquí datos SIMBAD / Gaia..."></textarea>
  <button onclick="generateStar()">Previsualizar estrella</button>
  <div id="info"></div>
</div>

<!-- Three.js r134 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

<script>
let scene, camera, renderer, starMesh, glowMesh;

init();

function init() {

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  camera.position.z = 5;

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  if (starMesh) starMesh.rotation.y += 0.002;
  renderer.render(scene, camera);
}

/* =========================
   PARSER GENÉRICO
========================= */

function parseStar(text) {

  const get = (regex) => {
    const match = text.match(regex);
    return match ? match[1].trim() : null;
  };

  const spectral = get(/Spectral type:\s*([A-Z0-9]+)/i);
  const parallax = parseFloat(get(/Parallaxes?.*?:\s*([0-9.]+)/i));
  const B = parseFloat(get(/\bB\s+([0-9.]+)/));
  const V = parseFloat(get(/\bV\s+([0-9.]+)/));
  const G = parseFloat(get(/\bG\s+([0-9.]+)/));

  const binary = /\*\*|Double|Multiple/i.test(text);

  return {
    spectral,
    parallax,
    B, V, G,
    binary
  };
}

/* =========================
   TRADUCCIÓN A FÍSICA VISUAL
========================= */

function buildStarModel(s) {

  let color = 0xffffff;
  let size = 1.2;

  // COLOR por tipo espectral
  if (s.spectral?.startsWith("O")) color = 0x9bbcff;
  else if (s.spectral?.startsWith("B")) color = 0xaecbff;
  else if (s.spectral?.startsWith("A")) color = 0xcfe8ff;
  else if (s.spectral?.startsWith("F")) color = 0xfff2cc;
  else if (s.spectral?.startsWith("G")) color = 0xffe08a;
  else if (s.spectral?.startsWith("K")) color = 0xffb36b;
  else if (s.spectral?.startsWith("M")) color = 0xff6b6b;

  // tamaño por brillo (aprox con V)
  if (s.V) {
    size = Math.max(0.5, 3 - s.V * 0.2);
  }

  return { color, size, binary: s.binary };
}

/* =========================
   RENDER
========================= */

function generateStar() {

  const text = document.getElementById("input").value;
  const info = document.getElementById("info");

  const data = parseStar(text);
  const star = buildStarModel(data);

  info.innerHTML =
    "Spectral: " + data.spectral + "<br>" +
    "Parallax: " + data.parallax + "<br>" +
    "Binary: " + data.binary;

  if (starMesh) {
    scene.remove(starMesh);
    scene.remove(glowMesh);
  }

  const geometry = new THREE.SphereGeometry(star.size, 32, 32);
  const material = new THREE.MeshBasicMaterial({
    color: star.color
  });

  starMesh = new THREE.Mesh(geometry, material);
  scene.add(starMesh);

  // Glow simple (segunda esfera)
  const glowGeo = new THREE.SphereGeometry(star.size * 1.4, 32, 32);
  const glowMat = new THREE.MeshBasicMaterial({
    color: star.color,
    transparent: true,
    opacity: 0.15
  });

  glowMesh = new THREE.Mesh(glowGeo, glowMat);
  scene.add(glowMesh);

  // binaria
  if (star.binary) {
    const geo2 = new THREE.SphereGeometry(star.size * 0.6, 32, 32);
    const mat2 = new THREE.MeshBasicMaterial({ color: 0xffffff });

    const star2 = new THREE.Mesh(geo2, mat2);
    star2.position.x = 2;

    scene.add(star2);
  }

  camera.position.z = 5;
}

</script>

</body>
</html>
