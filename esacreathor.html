<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OPE Terrain Builder</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070b12;
    color:white;
}

/*=========================
LAYOUT
=========================*/

#app{

    width:100%;
    height:100%;

    display:grid;

    grid-template-columns:420px 1fr;

}

/*=========================
LEFT PANEL
=========================*/

#sidebar{

    background:#0e141d;

    border-right:1px solid rgba(255,255,255,.08);

    display:flex;
    flex-direction:column;

}

/*=========================
HEADER
=========================*/

#header{

    padding:20px;

    border-bottom:1px solid rgba(255,255,255,.08);

}

#title{

    font-size:22px;
    font-weight:700;

}

#subtitle{

    opacity:.55;
    margin-top:6px;
    font-size:13px;

}

/*=========================
SEARCH
=========================*/

#search{

    padding:20px;

    display:flex;
    flex-direction:column;

    gap:12px;

}

label{

    font-size:12px;
    opacity:.6;

}

input{

    width:100%;

    padding:10px 12px;

    border:none;

    border-radius:8px;

    background:#141d29;

    color:white;

    outline:none;

}

button{

    height:42px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    background:#ff8a00;

    color:white;

    font-weight:bold;

    transition:.2s;

}

button:hover{

    background:#ff9e2e;

}

/*=========================
SECTIONS
=========================*/

.section{

    padding:18px;

    border-top:1px solid rgba(255,255,255,.06);

}

.section h2{

    font-size:14px;

    margin-bottom:12px;

    color:#ff9d35;

}

/*=========================
GRID
=========================*/

#grid{

    display:grid;

    grid-template-columns:repeat(8,1fr);

    gap:6px;

}

.cell{

    aspect-ratio:1;

    background:#16202d;

    border-radius:4px;

    cursor:pointer;

    transition:.2s;

}

.cell:hover{

    background:#2d6cff;

}

.cell.active{

    background:#ff8a00;

}

/*=========================
LIST
=========================*/

.list{

    display:flex;

    flex-direction:column;

    gap:8px;

}

.item{

    background:#141d29;

    border-radius:6px;

    padding:8px 10px;

    font-size:13px;

}

.item span{

    opacity:.55;

}

/*=========================
CANVAS
=========================*/

#viewer{

    position:relative;

    width:100%;
    height:100%;

}

#three{

    position:absolute;

    inset:0;

}

/*=========================
PLACEHOLDER
=========================*/

#placeholder{

    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    pointer-events:none;

}

#placeholder h1{

    font-size:34px;

    opacity:.12;

}

#placeholder p{

    opacity:.3;

    margin-top:12px;

}

</style>

</head>

<body>

<div id="app">

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <div id="sidebar">

        <div id="header">

            <div id="title">
                OPE Terrain Builder
            </div>

            <div id="subtitle">
                Experimental STAC 3D Reconstruction
            </div>

        </div>

        <div id="search">

            <label>Latitude</label>
            <input id="lat" value="38.995">

            <label>Longitude</label>
            <input id="lon" value="-1.855">

            <label>Radius (meters)</label>
            <input id="radius" value="500">

            <button id="load">

                LOAD OBSERVATIONS

            </button>

        </div>

        <div class="section">

            <h2>Spatial Grid</h2>

            <div id="grid">

                <!-- generado por JS -->

            </div>

        </div>

        <div class="section">

            <h2>Available Products</h2>

            <div id="products" class="list">

            </div>

        </div>

        <div class="section">

            <h2>Available Layers</h2>

            <div id="layers" class="list">

            </div>

        </div>

        <div class="section">

            <button id="build">

                GENERATE GEOMETRY

            </button>

        </div>

    </div>

    <!-- ========================= -->
    <!-- VIEWER -->
    <!-- ========================= -->

    <div id="viewer">

        <canvas id="three"></canvas>

        <div id="placeholder">

            <h1>THREE.JS</h1>

            <p>
                Waiting for observations...
            </p>

        </div>

    </div>

</div>

<!-- ===================================================== -->
<!-- THREE.JS R234 -->
<!-- ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/three@0.234.0/build/three.min.js"></script>

<!-- ===================================================== -->
<!-- YOUR SCRIPT -->
<!-- ===================================================== -->

<script>
  // ======================================================
// SIMPLE SPATIAL DATA EXPLORER
// Three.js r234
// ======================================================


// ======================================================
// STATE
// ======================================================

let scene;
let camera;
let renderer;

let selectedCell = null;

let gridData = [];

let currentLocation = {
    lat: 38.995,
    lon: -1.855,
    radius:500
};


// ======================================================
// INIT THREE
// ======================================================

function initThree(){

    const canvas = document.getElementById("three");


    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x070b12);


    camera = new THREE.PerspectiveCamera(
        45,
        canvas.clientWidth / canvas.clientHeight,
        0.1,
        1000
    );


    camera.position.set(
        0,
        3,
        5
    );


    renderer = new THREE.WebGLRenderer({

        canvas,
        antialias:true

    });


    renderer.setSize(
        canvas.clientWidth,
        canvas.clientHeight
    );


    const light = new THREE.DirectionalLight(
        0xffffff,
        2
    );

    light.position.set(
        5,
        5,
        5
    );

    scene.add(light);


    const ambient = new THREE.AmbientLight(
        0xffffff,
        .5
    );

    scene.add(ambient);


    animate();

}



// ======================================================
// LOOP
// ======================================================

function animate(){

    requestAnimationFrame(animate);

    renderer.render(
        scene,
        camera
    );

}



// ======================================================
// CREATE GRID
// ======================================================

function createGrid(){


    const grid = document.getElementById("grid");

    grid.innerHTML="";


    gridData=[];


    const size = 8;


    for(let y=0;y<size;y++){


        for(let x=0;x<size;x++){


            const cell={

                id:y*size+x,

                x,
                y,

                lat:

                currentLocation.lat +

                ((y-size/2)*0.05),


                lon:

                currentLocation.lon +

                ((x-size/2)*0.05),


                observations:[]


            };


            gridData.push(cell);



            const div=document.createElement("div");


            div.className="cell";


            div.dataset.id=cell.id;



            div.onclick=()=>{

                selectCell(cell);

            };



            grid.appendChild(div);



        }

    }


}



// ======================================================
// SELECT CELL
// ======================================================

function selectCell(cell){


    selectedCell=cell;


    document
    .querySelectorAll(".cell")
    .forEach(c=>c.classList.remove("active"));



    document
    .querySelector(`[data-id="${cell.id}"]`)
    .classList.add("active");



    console.log(
        "Selected cell",
        cell
    );



    showCellData(cell);


}



// ======================================================
// SHOW DATA
// ======================================================

function showCellData(cell){


    const products =
    document.getElementById("products");


    products.innerHTML="";



    addItem(
        products,
        "CELL",
        cell.id
    );


    addItem(
        products,
        "LAT",
        cell.lat.toFixed(4)
    );


    addItem(
        products,
        "LON",
        cell.lon.toFixed(4)
    );


    addItem(
        products,
        "OBSERVATIONS",
        cell.observations.length
    );



    document
    .getElementById("layers")
    .innerHTML="";


    addItem(
        layers,
        "STATUS",
        "Waiting STAC query"
    );



}



// ======================================================
// UI HELPERS
// ======================================================

function addItem(container,key,value){


    const div=document.createElement("div");


    div.className="item";


    div.innerHTML=
    `
    <span>${key}</span><br>
    ${value}
    `;


    container.appendChild(div);


}



// ======================================================
// LOAD OBSERVATIONS
// ======================================================

document
.getElementById("load")
.onclick=function(){



    currentLocation.lat =
    Number(
        document.getElementById("lat").value
    );


    currentLocation.lon =
    Number(
        document.getElementById("lon").value
    );


    currentLocation.radius =
    Number(
        document.getElementById("radius").value
    );



    createGrid();



    console.log(
        "Spatial search:",
        currentLocation
    );



};



// ======================================================
// GEOMETRY PLACEHOLDER
// ======================================================

document
.getElementById("build")
.onclick=function(){


    if(!selectedCell){

        alert(
            "Select a cell first"
        );

        return;

    }



    createTestTerrain();


};



// ======================================================
// TEST TERRAIN
// ======================================================

function createTestTerrain(){


    const geometry =
    new THREE.PlaneGeometry(
        3,
        3,
        30,
        30
    );


    const position =
    geometry.attributes.position;


    for(
        let i=0;
        i<position.count;
        i++
    ){

        const x =
        position.getX(i);


        const y =
        position.getY(i);


        position.setZ(
            i,
            Math.sin(x*3)*
            Math.cos(y*3)*
            .2
        );

    }


    geometry.computeVertexNormals();



    const material =
    new THREE.MeshStandardMaterial({

        color:0x557755,

        wireframe:false

    });



    const mesh =
    new THREE.Mesh(
        geometry,
        material
    );


    mesh.rotation.x =
    -Math.PI/2;



    scene.add(mesh);


}



// ======================================================
// START
// ======================================================

initThree();

createGrid();
</script>

</body>
</html>
