
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JANUS | Scientific Observation Reader</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #F3F1EA;
  --surface: #FAF9F5;
  --surface-hover: #EFEEE7;
  --border: #D8D6CD;

  --text: #242522;
  --text-soft: #686963;

  --blue: #416D80;
  --blue-hover: #345969;
  --orange: #E5682E;
  --green: #657B54;

  --success: #4D7855;
  --warning: #B77A2D;
  --danger: #B64C3B;

  --radius: 12px;

  --heading: "Space Grotesk", sans-serif;
  --body: "IBM Plex Sans", sans-serif;
  --mono: "IBM Plex Mono", monospace;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--text);
  padding: clamp(22px, 4vw, 60px);
  max-width: 1700px;
  margin: auto;
  line-height: 1.6;
}

/* =========================================
   EDITORIAL HEADER
========================================= */

h1 {
  font-family: var(--heading);
  font-size: clamp(38px, 5vw, 66px);
  font-weight: 600;
  line-height: 1;
  letter-spacing: -.055em;
  margin-bottom: 16px;
}

h1::after {
  content: "";
  display: block;
  width: 58px;
  height: 3px;
  margin-top: 22px;
  background: var(--orange);
}

.subtitle {
  color: var(--text-soft);
  font-size: 16px;
  margin-bottom: 42px;
  max-width: 700px;
  letter-spacing: .01em;
}

/* =========================================
   SECTION HEADINGS
========================================= */

h2 {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 20px;
}

/* =========================================
   CARDS
========================================= */

.card {
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: clamp(20px, 2.4vw, 32px);
  margin-bottom: 24px;
  transition: border-color .18s ease, background .18s ease;
}

.card:hover {
  border-color: #B8C2C2;
}

#summary {
  margin-bottom: 42px;
}

/* =========================================
   DATASET OVERVIEW
========================================= */

.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 28px;
}

.stat {
  min-width: 0;
  padding: 18px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
}

.statTitle {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: .13em;
  color: var(--text-soft);
  margin-bottom: 10px;
}

.statValue {
  font-family: var(--heading);
  font-size: clamp(20px, 2.2vw, 30px);
  font-weight: 600;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

#status {
  font-family: var(--body);
  font-size: 15px;
  font-weight: 600;
}

/* =========================================
   METADATA ROWS
========================================= */

.details {
  border-top: 1px solid var(--border);
  padding-top: 8px;
}

.row {
  display: flex;
  gap: 24px;
  align-items: flex-start;
  padding: 13px 0;
  border-bottom: 1px solid rgba(36,37,34,.09);
}

.row:last-child {
  border: none;
  padding-bottom: 0;
}

.label {
  width: 170px;
  flex-shrink: 0;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--text-soft);
}

.value {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
  color: var(--text);
  font-size: 14px;
}

/* =========================================
   OBSERVATIONS GRID
========================================= */

#observations {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  align-items: start;
}

#observations > .card {
  margin-bottom: 0;
  min-width: 0;
}

#observations > .card h2 {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 15px;
  border-bottom: 1px solid var(--border);
}

#observations > .card .row {
  gap: 16px;
}

#observations > .card .label {
  width: 105px;
  font-size: 9px;
}

#observations > .card .value {
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.7;
}

/* =========================================
   ASSETS
========================================= */

.asset {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 12px;
  padding: 16px;
  margin-top: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  transition: background .18s ease, border-color .18s ease;
}

.asset:hover {
  background: var(--surface-hover);
  border-color: #B8C2C2;
}

.assetHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
}

.assetInfo {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.assetName {
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: 13px;
  font-weight: 600;
}

.assetType {
  color: var(--text-soft);
  font-family: var(--mono);
  font-size: 10px;
  overflow-wrap: anywhere;
}

.asset a {
  flex-shrink: 0;
  font-size: 12px;
}

.assetPreview {
  display: block;
  width: 100%;
  max-width: 360px;
  max-height: 240px;
  margin-top: 2px;
  object-fit: cover;
  object-position: center;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: #E6E4DC;
  cursor: pointer;
  transition: opacity .18s ease;
}

.assetPreview:hover {
  opacity: .86;
}

/* =========================================
   BUTTONS
========================================= */

button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--blue);
  color: #FFFFFF;
  border: 1px solid var(--blue);
  padding: 10px 16px;
  border-radius: var(--radius);
  cursor: pointer;
  font-family: var(--body);
  font-size: 12px;
  font-weight: 600;
  transition: background .18s ease, border-color .18s ease;
}

button:hover {
  background: var(--blue-hover);
  border-color: var(--blue-hover);
}

button:active {
  transform: translateY(1px);
}

button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--orange);
  outline-offset: 3px;
}

#observations button {
  margin-top: 18px;
}

/* =========================================
   LINKS
========================================= */

a {
  color: var(--blue);
  text-decoration: none;
  font-weight: 600;
}

a:hover {
  color: var(--blue-hover);
  text-decoration: underline;
}

/* =========================================
   RAW JSON
========================================= */

pre {
  margin-top: 16px;
  padding: 18px;
  background: #202522;
  border: 1px solid #414943;
  border-radius: 8px;
  overflow: auto;
  max-height: 450px;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.7;
  color: #D4E1D5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* =========================================
   SCROLLBARS
========================================= */

::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}

::-webkit-scrollbar-track {
  background: var(--bg);
}

::-webkit-scrollbar-thumb {
  background: #C8C8BF;
  border-radius: 30px;
}

::-webkit-scrollbar-thumb:hover {
  background: #A9ACA4;
}

/* =========================================
   RESPONSIVE
========================================= */

@media (min-width: 1400px) {
  #observations {
    gap: 24px;
  }
}

@media (max-width: 1000px) {
  body {
    padding: 28px;
  }

  #observations {
    grid-template-columns: 1fr;
  }

  .stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  body {
    padding: 18px 14px;
  }

  h1 {
    font-size: 40px;
  }

  .subtitle {
    font-size: 14px;
    margin-bottom: 30px;
  }

  .card {
    padding: 18px;
    border-radius: 10px;
  }

  .stats {
    gap: 8px;
  }

  .stat {
    padding: 13px;
  }

  .statValue {
    font-size: 22px;
  }

  .row {
    flex-direction: column;
    gap: 5px;
  }

  .label {
    width: auto;
  }

  #observations > .card .row {
    gap: 5px;
  }

  #observations > .card .label {
    width: auto;
  }

  .asset {
    padding: 12px;
  }

  .assetHeader {
    align-items: flex-start;
  }

  .assetPreview {
    max-width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <h1>JANUS</h1>
  <p class="subtitle">Scientific Observation Reader</p>
</header>

<section id="summary" class="card">

  <h2>Dataset Overview</h2>

  <div class="stats">

    <div class="stat">
      <div class="statTitle">STATUS</div>
      <div class="statValue" id="status">Loading...</div>
    </div>

    <div class="stat">
      <div class="statTitle">OBSERVATIONS</div>
      <div class="statValue" id="count">-</div>
    </div>

    <div class="stat">
      <div class="statTitle">CELL</div>
      <div class="statValue" id="cellId">-</div>
    </div>

    <div class="stat">
      <div class="statTitle">ASSETS</div>
      <div class="statValue" id="assetCount">-</div>
    </div>

  </div>

  <div class="details">

    <div class="row">
      <div class="label">Latitude</div>
      <div class="value" id="latRange">-</div>
    </div>

    <div class="row">
      <div class="label">Longitude</div>
      <div class="value" id="lonRange">-</div>
    </div>

    <div class="row">
      <div class="label">State</div>
      <div class="value" id="cellState">-</div>
    </div>

  </div>

</section>

<section id="observations"></section>

<script>
const DATASET = "https://3d.staratlas.es/renderdata.json";

async function load() {
  try {
    const res = await fetch(DATASET);

    if (!res.ok) {
      throw new Error("HTTP " + res.status);
    }

    const text = await res.text();
    const json = JSON.parse(text);

    console.log("JSON OK");
    renderDataset(json);

  } catch (e) {
    console.error(e);

    document.getElementById("status").textContent =
      "Unable to load dataset";
  }
}

load();


// ==========================================
// RENDER DATASET
// ==========================================

function renderDataset(json) {
  const info = json.CELL_INFO || {};
  const observations = json.OBSERVATIONS || [];

  document.getElementById("status").textContent =
    "Dataset Loaded";

  document.getElementById("count").textContent =
    observations.length;

  document.getElementById("cellId").textContent =
    info.id || "-";

  document.getElementById("latRange").textContent =
    info.latRange || "-";

  document.getElementById("lonRange").textContent =
    info.lonRange || "-";

  document.getElementById("cellState").textContent =
    info.state ?? "-";

  const totalAssets = observations.reduce((total, obs) => {
    return total + Object.keys(obs.assets || {}).length;
  }, 0);

  document.getElementById("assetCount").textContent =
    totalAssets;

  const container = document.getElementById("observations");
  container.innerHTML = "";

  observations.forEach((obs, index) => {
    const assets = Object.keys(obs.assets || {}).length;

    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h2");
    title.textContent = "Observation " + (index + 1);
    card.appendChild(title);

    const fields = [
      ["ID", obs.id || "-"],
      ["Collection", obs.collection || "-"],
      ["Datetime", obs.properties?.datetime || "-"],
      ["Assets", assets]
    ];

    fields.forEach(([labelText, valueText]) => {
      const row = document.createElement("div");
      row.className = "row";

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = labelText;

      const value = document.createElement("div");
      value.className = "value";
      value.textContent = valueText;

      row.append(label, value);
      card.appendChild(row);
    });

    const assetsContainer = document.createElement("div");
    assetsContainer.id = "assets" + index;
    card.appendChild(assetsContainer);

    const rawButton = document.createElement("button");
    rawButton.type = "button";
    rawButton.textContent = "RAW JSON";
    rawButton.addEventListener("click", () => toggleRaw(index));
    card.appendChild(rawButton);

    const raw = document.createElement("pre");
    raw.id = "raw" + index;
    raw.style.display = "none";
    raw.textContent = JSON.stringify(obs, null, 2);
    card.appendChild(raw);

    container.appendChild(card);

    renderAssets(obs, index);
  });
}


// ==========================================
// RENDER ASSETS
// ==========================================

function renderAssets(obs, index) {
  const box = document.getElementById("assets" + index);

  if (!obs.assets) return;

  Object.entries(obs.assets).forEach(([name, asset]) => {
    const div = document.createElement("div");
    div.className = "asset";

    const header = document.createElement("div");
    header.className = "assetHeader";

    const info = document.createElement("div");
    info.className = "assetInfo";

    const title = document.createElement("div");
    title.className = "assetName";
    title.textContent = name;

    const type = document.createElement("div");
    type.className = "assetType";
    type.textContent = asset.type || "Unknown";

    info.append(title, type);
    header.appendChild(info);

    const link = document.createElement("a");
    link.href = asset.href || "#";
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Open";
    header.appendChild(link);

    div.appendChild(header);

    if ((asset.type || "").startsWith("image/") && asset.href) {
      const preview = document.createElement("img");
      preview.className = "assetPreview";
      preview.src = asset.href;
      preview.alt = "Preview: " + name;
      preview.loading = "lazy";
      preview.onerror = () => {
        preview.style.display = "none";
      };

      preview.addEventListener("click", () => {
        window.open(asset.href, "_blank", "noopener,noreferrer");
      });

      div.appendChild(preview);
    }

    box.appendChild(div);
  });
}


// ==========================================
// RAW JSON TOGGLE
// ==========================================

function toggleRaw(i) {
  const pre = document.getElementById("raw" + i);

  pre.style.display =
    pre.style.display === "none" ? "block" : "none";
}
</script>

</body>
</html>
