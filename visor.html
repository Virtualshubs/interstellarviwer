<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JANUS Reader</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:"Segoe UI",Arial,sans-serif;
background:#070b12;
background-image:
radial-gradient(circle at top,#12304d 0%,transparent 45%),
linear-gradient(#070b12,#090d16);
color:#d8e4f2;
padding:35px;
}
h1{
font-size:34px;
font-weight:300;
letter-spacing:4px;
text-transform:uppercase;
color:#8fd8ff;
margin-bottom:25px;
text-shadow:0 0 15px rgba(0,180,255,.35);
}
h2{
font-size:18px;
font-weight:500;
letter-spacing:2px;
text-transform:uppercase;
color:#ffc857;
margin-bottom:16px;
}
.card{
background:rgba(17,25,38,.85);
backdrop-filter:blur(12px);
border:1px solid rgba(95,175,255,.18);
border-radius:14px;
padding:22px;
margin-bottom:22px;
box-shadow:
0 0 30px rgba(0,0,0,.35),
inset 0 0 0 1px rgba(255,255,255,.03);
transition:.25s;
}
.card:hover{
border-color:#4ab8ff;
box-shadow:
0 0 18px rgba(74,184,255,.25),
0 0 45px rgba(0,0,0,.45);
transform:translateY(-2px);
}
.row{
display:flex;
align-items:flex-start;
gap:18px;
padding:8px 0;
border-bottom:1px solid rgba(255,255,255,.05);
}
.row:last-child{
border:none;
}
.label{
width:180px;
color:#63c9ff;
font-size:12px;
font-weight:700;
letter-spacing:1px;
text-transform:uppercase;
}
.value{
flex:1;
color:#f1f5fb;
word-break:break-word;
line-height:1.6;
}
.observation{
margin-top:28px;
}
.asset{
margin-top:12px;
padding:14px;
background:linear-gradient(180deg,#182231,#121b28);
border:1px solid rgba(87,173,255,.15);
border-radius:10px;
transition:.25s;
}
.asset:hover{
border-color:#61cfff;
background:#1a2636;
}
button{
padding:10px 18px;
background:linear-gradient(180deg,#36b5ff,#187dff);
border:none;
border-radius:8px;
color:white;
font-size:13px;
font-weight:600;
letter-spacing:.5px;
cursor:pointer;
transition:.25s;
}
button:hover{
transform:translateY(-1px);
box-shadow:0 0 18px rgba(70,170,255,.45);
}
a{
color:#79d8ff;
text-decoration:none;
}
a:hover{
color:white;
}
img{
display:block;
max-width:100%;
margin-top:12px;
border-radius:8px;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 8px 30px rgba(0,0,0,.35);
}
pre{
background:#06090f;
border:1px solid rgba(70,170,255,.18);
border-radius:10px;
padding:18px;
margin-top:14px;
max-height:450px;
overflow:auto;
color:#7ef3ff;
font-size:12px;
line-height:1.5;
}
::-webkit-scrollbar{
width:10px;
height:10px;
}
::-webkit-scrollbar-track{
background:#0d131c;
}
::-webkit-scrollbar-thumb{
background:#2e5e8c;
border-radius:20px;
}
::-webkit-scrollbar-thumb:hover{
background:#4ea4ff;
}
</style>
</head>

<body>

<h1>JANUS Reader</h1>

<div id="summary" class="card">

<h2>Dataset</h2>

<div class="row">
<div class="label">Status</div>
<div class="value" id="status">Loading...</div>
</div>

<div class="row">
<div class="label">Observations</div>
<div class="value" id="count">-</div>
</div>

</div>



<div id="observations"></div>



<script>

const DATASET = "https://3d.staratlas.es/renderdata.json";

async function load(){

    const res = await fetch(DATASET);

    const text = await res.text();

    console.log(text);

    try{

        const json = JSON.parse(text);

        console.log("JSON OK");

        renderDataset(json);

    }

    catch(e){

        console.error(e);

        console.log("---------------");
        console.log(text);
        console.log("---------------");

    }

}

load();


// ==========================================
// RENDER DATASET
// ==========================================

function renderDataset(json){

    //----------------------------------------------------
    // JANUS FORMAT
    //----------------------------------------------------

    const info =
    json.CELL_INFO;

    const observations =
    json.OBSERVATIONS || [];



    //----------------------------------------------------
    // SUMMARY
    //----------------------------------------------------

    document.getElementById("status").textContent =
    "Dataset loaded";

    document.getElementById("count").textContent =
    observations.length;



    //----------------------------------------------------
    // CELL INFO
    //----------------------------------------------------

    const summary =
    document.getElementById("summary");



    summary.innerHTML += `

    <div class="row">
        <div class="label">Cell ID</div>
        <div class="value">${info.id}</div>
    </div>

    <div class="row">
        <div class="label">Latitude</div>
        <div class="value">${info.latRange}</div>
    </div>

    <div class="row">
        <div class="label">Longitude</div>
        <div class="value">${info.lonRange}</div>
    </div>

    <div class="row">
        <div class="label">State</div>
        <div class="value">${info.state}</div>
    </div>

    `;



    //----------------------------------------------------
    // OBSERVATIONS
    //----------------------------------------------------

    const container =
    document.getElementById("observations");



    observations.forEach((obs,index)=>{

        const card =
        document.createElement("div");

        card.className="card";



        card.innerHTML=`

        <h2>

            Observation ${index+1}

        </h2>


        <div class="row">
            <div class="label">ID</div>
            <div class="value">${obs.id}</div>
        </div>


        <div class="row">
            <div class="label">Collection</div>
            <div class="value">${obs.collection}</div>
        </div>


        <div class="row">
            <div class="label">Datetime</div>
            <div class="value">

                ${obs.properties?.datetime || ""}

            </div>
        </div>


        <div class="row">
            <div class="label">Assets</div>
            <div class="value">

                ${Object.keys(obs.assets||{}).length}

            </div>
        </div>


        <div id="assets${index}"></div>


        <button onclick="toggleRaw(${index})">

            RAW JSON

        </button>


        <pre
            id="raw${index}"
            style="display:none"
        ></pre>

        `;



        container.appendChild(card);



        document.getElementById(

            "raw"+index

        ).textContent=

        JSON.stringify(

            obs,

            null,

            2

        );



        renderAssets(

            obs,

            index

        );



    });



}



// ==========================================
// RENDER ASSETS
// ==========================================

function renderAssets(obs,index){

    const box =
    document.getElementById("assets"+index);



    if(!obs.assets)
        return;



    Object.entries(obs.assets)

    .forEach(([name,asset])=>{

        const div =
        document.createElement("div");

        div.className="asset";



        div.innerHTML=`

            <b>${name}</b>

            <br>

            ${asset.type || "unknown"}

            <br><br>

            <a
                href="${asset.href}"
                target="_blank"
            >

                Open

            </a>

        `;



        box.appendChild(div);



    });



}



// ==========================================
// RAW
// ==========================================

function toggleRaw(i){

    const pre =
    document.getElementById(

        "raw"+i

    );



    pre.style.display=

    pre.style.display==="none"

    ?

    "block"

    :

    "none";

}

</script>

</body>

</html>
