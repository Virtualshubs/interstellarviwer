<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JANUS Reader</title>

<style>

:root{

--bg:#0d1117;
--surface:#161b22;
--surface-hover:#1c2128;
--border:#30363d;

--text:#e6edf3;
--text-soft:#8b949e;

--blue:#2f81f7;
--blue-hover:#4493f8;

--orange:#d29922;

--success:#238636;

--radius:12px;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

background:var(--bg);

color:var(--text);

padding:48px;

max-width:1500px;

margin:auto;

line-height:1.6;

}


h1{

font-size:38px;

font-weight:700;

letter-spacing:-1px;

margin-bottom:8px;

}

h1::after{

content:"";

display:block;

width:80px;

height:3px;

margin-top:18px;

background:var(--blue);

border-radius:50px;

}


.subtitle{

color:var(--text-soft);

font-size:15px;

margin-bottom:45px;

max-width:700px;

}


h2{

font-size:15px;

font-weight:700;

letter-spacing:1px;

text-transform:uppercase;

color:var(--orange);

margin-bottom:18px;

}



.card{

background:var(--surface);

border:1px solid var(--border);

border-radius:var(--radius);

padding:26px;

margin-bottom:24px;

transition:.18s;

}


.card:hover{

border-color:#4a5568;

}


#summary{

margin-bottom:40px;

}



#observations{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(560px,1fr));

gap:24px;

}



.row{

display:flex;

gap:24px;

align-items:flex-start;

padding:12px 0;

border-bottom:1px solid rgba(255,255,255,.05);

}

.row:last-child{

border:none;

padding-bottom:0;

}



.label{

width:170px;

flex-shrink:0;

font-size:12px;

font-weight:700;

letter-spacing:1px;

text-transform:uppercase;

color:var(--text-soft);

}


.value{

flex:1;

word-break:break-word;

color:var(--text);

}



.asset{

display:flex;

justify-content:space-between;

align-items:center;

padding:14px 18px;

margin-top:12px;

background:var(--surface-hover);

border:1px solid var(--border);

border-radius:10px;

transition:.18s;

}


.asset:hover{

background:#22272e;

}


.assetInfo{

display:flex;

flex-direction:column;

gap:2px;

}


.assetTitle{

font-size:14px;

font-weight:600;

}


.assetType{

font-size:12px;

color:var(--text-soft);

}



button{

background:var(--blue);

color:#fff;

border:none;

padding:10px 18px;

border-radius:8px;

cursor:pointer;

font-size:14px;

font-weight:600;

transition:.18s;

}


button:hover{

background:var(--blue-hover);

}


button:active{

transform:translateY(1px);

}



a{

color:var(--blue);

text-decoration:none;

font-weight:500;

}


a:hover{

text-decoration:underline;

}



img{

display:block;

width:100%;

max-width:260px;

margin-top:14px;

border-radius:8px;

border:1px solid var(--border);

}



pre{

margin-top:20px;

padding:18px;

background:#010409;

border:1px solid var(--border);

border-radius:10px;

overflow:auto;

max-height:450px;

font-size:12px;

line-height:1.5;

color:#79c0ff;

}



::-webkit-scrollbar{

width:10px;

height:10px;

}


::-webkit-scrollbar-track{

background:#0d1117;

}


::-webkit-scrollbar-thumb{

background:#30363d;

border-radius:30px;

}


::-webkit-scrollbar-thumb:hover{

background:#484f58;

}



@media(max-width:900px){

body{

padding:24px;

}

#observations{

grid-template-columns:1fr;

}

.row{

flex-direction:column;

gap:6px;

}

.label{

width:auto;

}

.card{

padding:20px;

}

h1{

font-size:30px;

}

}


    .assetPreview{

display:block;

width:100%;

max-width:320px;

max-height:220px;

margin-top:12px;

object-fit:cover;

border-radius:8px;

border:1px solid var(--border);

background:#0d1117;

cursor:pointer;

transition:.2s;

}

.assetPreview:hover{

transform:scale(1.02);

}

</style>
</head>

<body><h1>JANUS</h1>

<p class="subtitle">
Scientific Observation Reader
</p>

<div id="summary" class="card">

    <h2>Dataset Overview</h2>

    <div class="stats">

        <div class="stat">

            <div class="statTitle">
                STATUS
            </div>

            <div
                class="statValue"
                id="status"
            >
                Loading...
            </div>

        </div>


        <div class="stat">

            <div class="statTitle">
                OBSERVATIONS
            </div>

            <div
                class="statValue"
                id="count"
            >
                -
            </div>

        </div>


        <div class="stat">

            <div class="statTitle">
                CELL
            </div>

            <div
                class="statValue"
                id="cellId"
            >
                -
            </div>

        </div>


        <div class="stat">

            <div class="statTitle">
                ASSETS
            </div>

            <div
                class="statValue"
                id="assetCount"
            >
                -
            </div>

        </div>

    </div>



    <div class="details">

        <div class="row">

            <div class="label">
                Latitude
            </div>

            <div
                class="value"
                id="latRange"
            >
                -
            </div>

        </div>



        <div class="row">

            <div class="label">
                Longitude
            </div>

            <div
                class="value"
                id="lonRange"
            >
                -
            </div>

        </div>



        <div class="row">

            <div class="label">
                State
            </div>

            <div
                class="value"
                id="cellState"
            >
                -
            </div>

        </div>

    </div>

</div>



<div id="observations"></div>


<script>

const DATASET="https://3d.staratlas.es/renderdata.json";

async function load(){

try{

const res=await fetch(DATASET);
const text=await res.text();
const json=JSON.parse(text);

console.log("JSON OK");

renderDataset(json);

}

catch(e){

console.error(e);

document.getElementById("status").textContent=
"Unable to load dataset";

}

}

load();



// ==========================================
// RENDER DATASET
// ==========================================

function renderDataset(json){

const info=json.CELL_INFO||{};
const observations=json.OBSERVATIONS||[];



document.getElementById("status").textContent=
"Dataset Loaded";

document.getElementById("count").textContent=
observations.length;

document.getElementById("cellId").textContent=
info.id||"-";

document.getElementById("latRange").textContent=
info.latRange||"-";

document.getElementById("lonRange").textContent=
info.lonRange||"-";

document.getElementById("cellState").textContent=
info.state??"-";



const totalAssets=
observations.reduce((t,o)=>{

return t+Object.keys(o.assets||{}).length;

},0);



document.getElementById("assetCount").textContent=
totalAssets;



const container=
document.getElementById("observations");

container.innerHTML="";



observations.forEach((obs,index)=>{

const assets=
Object.keys(obs.assets||{}).length;



const card=
document.createElement("div");

card.className="card";



card.innerHTML=`

<h2>Observation ${index+1}</h2>

<div class="row">
<div class="label">ID</div>
<div class="value">${obs.id||"-"}</div>
</div>

<div class="row">
<div class="label">Collection</div>
<div class="value">${obs.collection||"-"}</div>
</div>

<div class="row">
<div class="label">Datetime</div>
<div class="value">${obs.properties?.datetime||"-"}</div>
</div>

<div class="row">
<div class="label">Assets</div>
<div class="value">${assets}</div>
</div>

<div id="assets${index}"></div>

<button onclick="toggleRaw(${index})">
RAW JSON
</button>

<pre id="raw${index}" style="display:none"></pre>

`;

container.appendChild(card);

document.getElementById("raw"+index).textContent=
JSON.stringify(obs,null,2);

renderAssets(obs,index);

});

}



// ==========================================
// RENDER ASSETS
// ==========================================

function renderAssets(obs,index){

const box=
document.getElementById("assets"+index);

if(!obs.assets)
return;



Object.entries(obs.assets).forEach(([name,asset])=>{

const div=
document.createElement("div");

div.className="asset";

const type=asset.type||"Unknown";

let html=`

<div class="assetHeader">

<div>

<div class="assetName">${name}</div>

<div class="assetType">${type}</div>

</div>

<a href="${asset.href}" target="_blank">
Open
</a>

</div>

`;



if(type.startsWith("image/")){

html+=`

<img
class="assetPreview"
src="${asset.href}"
loading="lazy"
onclick="window.open('${asset.href}','_blank')"
onerror="this.style.display='none';"
>

`;

}



div.innerHTML=html;

box.appendChild(div);

});

}



// ==========================================
// RAW
// ==========================================

function toggleRaw(i){

const pre=
document.getElementById("raw"+i);

pre.style.display=
pre.style.display==="none"
?
"block"
:
"none";

}

</script>

</body>

</html>
