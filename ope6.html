<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Earth + Copernicus Constellation (TLE)</title>

<style>
  body { margin:0; overflow:hidden; background:black; }

  #info {
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
    z-index:10;
  }

  #ui {
    position:absolute;
    top:10px;
    right:10px;
    color:white;
    font-family:Arial;
    z-index:20;
    background:rgba(0,0,0,0.5);
    padding:10px;
  }

  select { width:220px; margin-top:5px; }
</style>
</head>

<body>

<div id="info">Earth + Copernicus Satellite Constellation (REAL TLE)</div>

<div id="ui">
  🛰️ Satellite focus<br/>
  <select id="satSelect"></select>
  <div id="satInfo"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>

<script>

// ===================== CORE =====================
let scene, camera, renderer;
let earth, earthGroup, sunLight, ambientLight;

let startTime = Date.now();

// camera
let distance = 3;
let targetDistance = 3;
let rotY = 0, targetRotY = 0;
let rotX = 0, targetRotX = 0;
let isDragging = false;
let lastX = 0, lastY = 0;

// ===================== SATELLITES =====================
const SAT_INFO = {

  "25544": { name:"ISS", type:"Station", mission:"Microgravity" },

  "39634": { name:"Sentinel-1A", type:"Radar", mission:"Earth observation" },
  "39084": { name:"Sentinel-1B", type:"Radar", mission:"Earth observation" },

  "29780": { name:"Sentinel-2A", type:"Optical", mission:"Imaging Earth" },
  "42063": { name:"Sentinel-2B", type:"Optical", mission:"Imaging Earth" },

  "28654": { name:"Sentinel-3A", type:"Ocean", mission:"Climate" },

  "43618": { name:"Sentinel-5P", type:"Atmosphere", mission:"Air quality" },

  "25338": { name:"NOAA-15", type:"Meteorological", mission:"Weather monitoring" },
  "38552": { name:"Meteosat-10", type:"Geo Weather", mission:"Europe weather" }
};

let satMeshes = {};
let satrecs = {};
let currentSat = "25544";

// ===================== 🎨 MISSION COLORS =====================
const MISSION_COLOR = {
  "ISS": 0x4aa3ff,        // azul
  "Copernicus": 0xff7a18, // naranja fosforito
  "NOAA": 0xb06cff,       // violeta
  "Meteosat": 0xb06cff
};

function getMissionColor(id){

  const sat = SAT_INFO[id];
  if(!sat) return 0xffffff;

  const name = sat.name.toLowerCase();

  if(name.includes("sentinel")) return MISSION_COLOR["Copernicus"];
  if(name.includes("iss")) return MISSION_COLOR["ISS"];
  if(name.includes("noaa")) return MISSION_COLOR["NOAA"];
  if(name.includes("meteosat")) return MISSION_COLOR["Meteosat"];

  return 0xffffff;
}

// ===================== INIT =====================
init();
animate();

function init(){

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60, window.innerWidth/window.innerHeight, 0.1, 1000
  );

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // LIGHTS
  sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
  scene.add(sunLight);
  scene.add(sunLight.target);

  ambientLight = new THREE.AmbientLight(0xffffff, 0.12);
  scene.add(ambientLight);

  // EARTH
  earthGroup = new THREE.Group();
  scene.add(earthGroup);

  earthGroup.rotation.z = THREE.MathUtils.degToRad(23.44);

  const tex = new THREE.TextureLoader().load(
    "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
  );

  earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 64, 64),
    new THREE.MeshStandardMaterial({ map: tex })
  );

  earthGroup.add(earth);

  // MADRID PIN
  const madridPin = new THREE.Mesh(
    new THREE.SphereGeometry(0.02, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0x00ff00 })
  );

  madridPin.position.copy(latLonToVec3(40.4168, -3.7038, 1.01));
  earth.add(madridPin);

  // SATELLITES UI
  const select = document.getElementById("satSelect");

  for(const id in SAT_INFO){
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = SAT_INFO[id].name;
    select.appendChild(opt);
  }

  select.value = currentSat;

  select.addEventListener("change", (e)=>{
    currentSat = e.target.value;
    updateUI(currentSat);
  });

  updateUI(currentSat);

  // LOAD ALL TLEs
  for(const id in SAT_INFO){
    loadTLE(id);
  }

  // controls
  window.addEventListener("wheel",(e)=>{
    targetDistance += e.deltaY * 0.002;
    targetDistance = Math.max(1.8, Math.min(8, targetDistance));
  });

  window.addEventListener("mousedown",(e)=>{
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  });

  window.addEventListener("mouseup",()=> isDragging=false);

  window.addEventListener("mousemove",(e)=>{
    if(!isDragging) return;
    targetRotY += (e.clientX-lastX)*0.005;
    targetRotX += (e.clientY-lastY)*0.005;
    lastX = e.clientX;
    lastY = e.clientY;
  });

  window.addEventListener("resize", onResize);
}

// ===================== TLE LOADER =====================
async function loadTLE(id){

  try {
    const url = `https://celestrak.org/NORAD/elements/gp.php?CATNR=${id}&FORMAT=tle`;
    const res = await fetch(url);
    const text = await res.text();

    const lines = text.trim().split("\n");

    if(lines.length < 3) return;

    satrecs[id] = satellite.twoline2satrec(lines[1], lines[2]);

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.03, 10, 10),
      new THREE.MeshBasicMaterial({ color: getMissionColor(id) })
    );

    scene.add(mesh);
    satMeshes[id] = mesh;

  } catch(e){
    console.error("TLE error", id, e);
  }
}

// ===================== UPDATE SATS =====================
function updateSatellites(){

  const now = new Date();
  const gmst = satellite.gstime(now);

  for(const id in satrecs){

    const satrec = satrecs[id];
    const posVel = satellite.propagate(satrec, now);

    if(!posVel.position) continue;

    const geo = satellite.eciToGeodetic(posVel.position, gmst);

    const lat = satellite.degreesLat(geo.latitude);
    const lon = satellite.degreesLong(geo.longitude);

    const mesh = satMeshes[id];
    if(!mesh) continue;

    mesh.position.copy(latLonToVec3(lat, lon, 1.4));

    // highlight selected (SIEMPRE PRIORIDAD)
    if(id === currentSat){
      mesh.scale.set(2,2,2);
      mesh.material.color.set(0x00ff00);
    } else {
      mesh.scale.set(1,1,1);
      mesh.material.color.set(getMissionColor(id));
    }
  }
}

// ===================== UI =====================
function updateUI(id){
  const sat = SAT_INFO[id];
  document.getElementById("satInfo").innerHTML =
    `<b>${sat.name}</b><br>${sat.type}<br>${sat.mission}`;
}

// ===================== LATLON =====================
function latLonToVec3(lat, lon, r){

  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon + 180);

  return new THREE.Vector3(
    -(r * Math.sin(phi) * Math.cos(theta)),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

// ===================== LOOP =====================
function animate(){

  requestAnimationFrame(animate);

  const rot = ((Date.now()-startTime)/86400000)*(2*Math.PI);
  earthGroup.rotation.y = rot;

  const sunDir = new THREE.Vector3(1,1,0).normalize();
  sunLight.position.copy(sunDir.multiplyScalar(50));
  sunLight.target.position.set(0,0,0);

  updateSatellites();

  rotY += (targetRotY-rotY)*0.08;
  rotX += (targetRotX-rotX)*0.08;
  distance += (targetDistance-distance)*0.08;

  camera.position.x = distance*Math.cos(rotX)*Math.sin(rotY);
  camera.position.y = distance*Math.sin(rotX);
  camera.position.z = distance*Math.cos(rotX)*Math.cos(rotY);

  camera.lookAt(0,0,0);

  renderer.render(scene,camera);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

</script>

</body>
</html>
