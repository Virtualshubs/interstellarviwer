<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JANUS DATA V1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#050505;color:#fff}
canvas{display:block}
#ui,#info{
position:absolute;top:15px;width:290px;padding:15px;
background:rgba(15,15,15,.95);
border:1px solid #333;border-radius:8px;z-index:10}
#ui{left:15px} #info{right:15px}
h2,h3{margin-bottom:12px}
label{display:block;margin:10px 0 5px;color:#aaa;font-size:13px}
input{width:100%;padding:8px;background:#222;border:1px solid #444;color:#fff}
button{width:100%;padding:10px;margin-top:10px;background:#222;color:#fff;border:1px solid #444;cursor:pointer}
button:hover{background:#333}
.row{display:flex;justify-content:space-between;margin-top:8px}
hr{border:none;border-top:1px solid #333;margin:15px 0}
.small{font-size:12px;color:#888;line-height:18px}
#outputMessage,#cellInfo{line-height:20px}
</style>
</head>
<body>

<div id="ui">
<h2>JANUS DATA V1</h2>

<label>Message</label>
<input id="message" type="text" value="HELLO JANUS">

<button id="generate">Generate Universe</button>

<hr>

<div class="row"><span>Observed</span><span id="obs">0 / 0</span></div>
<div class="row"><span>Bits</span><span id="bitCount">--</span></div>
<div class="row"><span>Recovered</span><span id="bitRecovered">--</span></div>
<div class="row"><span>Accuracy</span><span id="acc">--</span></div>

<button id="observe">Observe</button>
<button id="reconstruct">Reconstruct</button>
<button id="reveal">Reveal</button>
</div>

<div id="info">
<h3>Information</h3>

<div id="cellInfo">
<b>Original</b><br><br>
<span id="originalMessage">Waiting...</span>

<hr>

<b>Recovered</b><br><br>
<div id="outputMessage">Waiting...</div>

<hr>

<div class="row"><span>Bytes</span><span id="byteCount">--</span></div>
<div class="row"><span>Bits</span><span id="infoBits">--</span></div>
<div class="row"><span>Grid</span><span id="gridInfo">--</span></div>
</div>

<div class="small">
JANUS DATA — Experimental distributed data representation.
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134/build/three.min.js"></script>
<script>

const CONFIG={

    background:0x050505,

    camera:{
        fov:45,
        near:0.1,
        far:2000,
        z:45
    },

    grid:{
        size:16,
        spacing:2.0,
        cellSize:1.6,
        cellDepth:0.35
    },

    colors:{
        empty:0x222222,
        zero:0xffffff,
        one:0xff4444,
        selected:0xffff00
    }

};

// ======================================================
// SCENE
// ======================================================

const scene=new THREE.Scene();
scene.background=new THREE.Color(CONFIG.background);

// ======================================================
// CAMERA
// ======================================================

const camera=new THREE.PerspectiveCamera(
    CONFIG.camera.fov,
    window.innerWidth/window.innerHeight,
    CONFIG.camera.near,
    CONFIG.camera.far
);

camera.position.set(0,0,CONFIG.camera.z);

// ======================================================
// RENDERER
// ======================================================

const renderer=new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(window.devicePixelRatio);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(renderer.domElement);

// ======================================================
// LIGHT
// ======================================================

scene.add(

    new THREE.AmbientLight(
        0xffffff,
        1
    )

);

// ======================================================
// GLOBAL DATA
// ======================================================

const universe={
    cells:[],
    size:CONFIG.grid.size,
    spacing:CONFIG.grid.spacing
};

const data={

    message:"",
    bytes:[],
    bits:[]

};

const observer={

    observed:[],
    predicted:[]

};


// ======================================================
// UNIVERSE ENGINE
// ======================================================

// ------------------------------------------------------
// CELL GEOMETRY
// ------------------------------------------------------

const cellGeometry=new THREE.BoxGeometry(
    CONFIG.grid.cellSize,
    CONFIG.grid.cellSize,
    CONFIG.grid.cellDepth
);

// ------------------------------------------------------
// CELL MATERIAL
// ------------------------------------------------------

function createCellMaterial(){

    return new THREE.MeshBasicMaterial({
        color:CONFIG.colors.empty
    });

}

// ------------------------------------------------------
// CREATE CELL
// ------------------------------------------------------

function createCell(x,y){

    const mesh=new THREE.Mesh(
        cellGeometry,
        createCellMaterial()
    );

    const center=(universe.size-1)/2;

    mesh.position.set(
        (x-center)*universe.spacing,
        -(y-center)*universe.spacing,
        0
    );

    const cell={

        id:universe.cells.length,

        x,
        y,

        // JANUS STATE
        // -1 = vacío
        //  0 = estado A
        //  1 = estado B

        state:-1,

        observed:false,

        mesh

    };

    mesh.userData.cell=cell;

    return cell;

}

// ------------------------------------------------------
// CLEAR
// ------------------------------------------------------

function clearUniverse(){

    for(const cell of universe.cells){

        scene.remove(cell.mesh);

    }

    universe.cells.length=0;

}

// ------------------------------------------------------
// BUILD
// ------------------------------------------------------

function buildUniverse(size){

    clearUniverse();

    universe.size=size;

    universe.spacing=Math.min(
        CONFIG.grid.spacing,
        30/size
    );

    for(let y=0;y<size;y++){

        for(let x=0;x<size;x++){

            const cell=createCell(x,y);

            universe.cells.push(cell);

            scene.add(cell.mesh);

        }

    }

    document.getElementById("gridInfo").textContent=
        size+" × "+size;

}

// ------------------------------------------------------
// RESET STATES
// ------------------------------------------------------

function resetStates(){

    for(const cell of universe.cells){

        cell.state=-1;
        cell.observed=false;

    }

}

// ------------------------------------------------------
// GET CELL
// ------------------------------------------------------

function getCell(x,y){

    if(
        x<0 ||
        y<0 ||
        x>=universe.size ||
        y>=universe.size
    ) return null;

    return universe.cells[
        y*universe.size+x
    ];

}

  // ======================================================
// DATA ENGINE
// ======================================================

// ------------------------------------------------------
// TEXT -> BYTES
// ------------------------------------------------------

function textToBytes(text){

    return Array.from(
        new TextEncoder().encode(text)
    );

}

// ------------------------------------------------------
// BYTES -> BITS
// ------------------------------------------------------

function bytesToBits(bytes){

    const bits=[];

    for(const byte of bytes){

        for(let i=7;i>=0;i--){

            bits.push(
                (byte>>i)&1
            );

        }

    }

    return bits;

}

// ------------------------------------------------------
// LOAD TEXT
// ------------------------------------------------------

function loadText(){

    data.message=
        document.getElementById("message").value;

    data.bytes=
        textToBytes(data.message);

    data.bits=
        bytesToBits(data.bytes);

    updateDataPanel();

    console.clear();

    console.log("MESSAGE");
    console.log(data.message);

    console.log("BYTES");
    console.log(data.bytes);

    console.log("BITS");
    console.log(data.bits.join(""));

}

// ------------------------------------------------------
// UPDATE UI
// ------------------------------------------------------

function updateDataPanel(){

    document.getElementById("originalMessage").textContent=
        data.message;

    document.getElementById("byteCount").textContent=
        data.bytes.length;

    document.getElementById("bitCount").textContent=
        data.bits.length;

    document.getElementById("infoBits").textContent=
        data.bits.length;

}

  // ======================================================
// SPATIAL DISTRIBUTION ENGINE
// ======================================================

// ------------------------------------------------------
// CLEAR STATES
// ------------------------------------------------------

function clearStates(){

    for(const cell of universe.cells){

        cell.state=-1;
        cell.observed=false;

    }

}

// ------------------------------------------------------
// LINEAR DISTRIBUTION
// (Primera implementación)
// ------------------------------------------------------

function distributeBits(){

    clearStates();

    let index=0;

    for(const cell of universe.cells){

        if(index<data.bits.length){

            cell.state=data.bits[index];

            index++;

        }else{

            cell.state=-1;

        }

    }

}

// ------------------------------------------------------
// EXPORT STATES
// ------------------------------------------------------

function getUniverseStates(){

    return universe.cells.map(cell=>cell.state);

}


  // ======================================================
// RENDER ENGINE
// ======================================================

// ------------------------------------------------------
// PAINT CELL
// ------------------------------------------------------

function paintCell(cell){

    switch(cell.state){

        case 1:

            cell.mesh.material.color.set(
                CONFIG.colors.one
            );

            break;

        case 0:

            cell.mesh.material.color.set(
                CONFIG.colors.zero
            );

            break;

        default:

            cell.mesh.material.color.set(
                CONFIG.colors.empty
            );

    }

}

// ------------------------------------------------------
// PAINT UNIVERSE
// ------------------------------------------------------

function paintUniverse(){

    for(const cell of universe.cells){

        paintCell(cell);

    }

}

// ------------------------------------------------------
// REFRESH
// ------------------------------------------------------
function refreshUniverse(){

    distributeBits();

    paintUniverse();

}
  
document.getElementById("generate").onclick=()=>{

    loadText();

    refreshUniverse();

};
  
// ======================================================
// RESIZE
// ======================================================

window.addEventListener("resize",()=>{

    camera.aspect=
    window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

// ======================================================
// LOOP
// ======================================================

function animate(){

    requestAnimationFrame(animate);

    renderer.render(
        scene,
        camera
    );

}

    // ======================================================
// MAIN
// ======================================================

buildUniverse(CONFIG.grid.size);

paintUniverse();

animate();
  
</script>

</body>
</html>
