<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Earth Fixed System (Clean Model)</title>

<style>
  body { margin:0; overflow:hidden; background:black; }
  #info {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
  z-index:10;
}
</style>
</head>

<body>
<div id="info">Earth fixed system (clean ECI/ECEF separation)</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js/dist/satellite.min.js"></script>

<script>

// =====================
// CORE
// =====================
let scene, camera, renderer;
let sunLight;

let earthTiltGroup;
let earthRotationGroup;
let earth;

// controls
let distance = 3;
let targetDistance = 3;
let rotY = 0;
let targetRotY = 0;

// =====================
// INIT
// =====================
init();
animate();

function init(){

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
  );

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // =====================
  // LIGHT
  // =====================
  sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
  scene.add(sunLight);

  // pequeña luz de lectura (NO física)
  scene.add(new THREE.AmbientLight(0xffffff, 0.06));

  // =====================
  // EARTH HIERARCHY (CLAVE)
  // =====================

  earthTiltGroup = new THREE.Group();
  scene.add(earthTiltGroup);

  // inclinación REAL
  earthTiltGroup.rotation.z = THREE.MathUtils.degToRad(23.44);

  earthRotationGroup = new THREE.Group();
  earthTiltGroup.add(earthRotationGroup);

  // =====================
  // EARTH
  // =====================
  const tex = new THREE.TextureLoader().load(
    "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
  );

  earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 64, 64),
    new THREE.MeshStandardMaterial({ map: tex })
  );

  // FIX fundamental de orientación del mapa
  earth.rotation.y = Math.PI;

  earthRotationGroup.add(earth);

  // =====================
  // MADRID PIN
  // =====================
  const pin = new THREE.Mesh(
    new THREE.SphereGeometry(0.02, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xff0000 })
  );

  pin.position.copy(latLonToVec3(40.4168, -3.7038, 1.01));
  earth.add(pin);

  // =====================
  // CONTROLS
  // =====================
  window.addEventListener("wheel", e=>{
    targetDistance = Math.min(6, Math.max(2, targetDistance + e.deltaY*0.002));
  });

  window.addEventListener("mousemove", e=>{
    if(e.buttons !== 1) return;
    targetRotY += e.movementX * 0.005;
  });

  window.addEventListener("resize", onResize);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// =====================
// LAT/LON
// =====================
function latLonToVec3(lat, lon, r){

  const phi = THREE.MathUtils.degToRad(90-lat);
  const theta = THREE.MathUtils.degToRad(lon+180);

  return new THREE.Vector3(
    -(r * Math.sin(phi) * Math.cos(theta)),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

// =====================
// SUN (stable simplified model)
// =====================
function getSunDirection(date){

  const ms = date.getTime();
  const t = ms / 86400000;

  const angle = (t % 1) * Math.PI * 2;

  return new THREE.Vector3(
    Math.cos(angle),
    0.25,
    Math.sin(angle)
  ).normalize();
}

// =====================
// LOOP
// =====================
function animate(){

  requestAnimationFrame(animate);

  const now = new Date();

  // =====================
  // EARTH ROTATION (GMST simplified stable)
  // =====================
  const earthRotationSpeed = (2*Math.PI)/86400;

  earthRotationGroup.rotation.y += earthRotationSpeed;

  // =====================
  // SUN
  // =====================
  const sunDir = getSunDirection(now);

  sunLight.position.copy(sunDir.clone().multiplyScalar(10));
  sunLight.target.position.set(0,0,0);

  // =====================
  // CAMERA
  // =====================
  rotY += (targetRotY - rotY)*0.08;

  camera.position.x = distance*Math.sin(rotY);
  camera.position.z = distance*Math.cos(rotY);
  camera.position.y = 1.2;

  camera.lookAt(0,0,0);

  renderer.render(scene,camera);
}

</script>

</body>
</html>
