<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Earth Sun System (GMST Unified)</title>

<style>
  body { margin:0; overflow:hidden; background:black; }
  #info {
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
    z-index:10;
  }
</style>
</head>

<body>
<div id="info">Earth-Sun system (GMST unified model)</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js/dist/satellite.min.js"></script>

<script>

// =====================
// CORE
// =====================
let scene, camera, renderer;
let earth, earthGroup;
let sunLight;

// camera controls
let distance = 3;
let targetDistance = 3;
let rotY = 0;
let targetRotY = 0;

// =====================
// INIT
// =====================
init();
animate();

function init(){

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
  );

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // =====================
  // LIGHT (SOL)
  // =====================
  sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
  scene.add(sunLight);

  scene.add(new THREE.AmbientLight(0xffffff, 0.06));

  // =====================
  // EARTH GROUP
  // =====================
  earthGroup = new THREE.Group();
  scene.add(earthGroup);

  // inclinación terrestre (OBLICUIDAD REAL)
  earthGroup.rotation.z = THREE.MathUtils.degToRad(23.44);

  // =====================
  // EARTH
  // =====================
  const tex = new THREE.TextureLoader().load(
    "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
  );

  earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 64, 64),
    new THREE.MeshStandardMaterial({ map: tex })
  );

  // FIX textura (longitud 0 alineada)
  earth.rotation.y = Math.PI;

  earthGroup.add(earth);

  // =====================
  // MADRID PIN
  // =====================
  const pin = new THREE.Mesh(
    new THREE.SphereGeometry(0.02, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xff0000 })
  );

  pin.position.copy(latLonToVec3(40.4168, -3.7038, 1.01));
  earth.add(pin);

  // =====================
  // CONTROLS
  // =====================
  window.addEventListener("wheel", e=>{
    targetDistance = Math.min(6, Math.max(2, targetDistance + e.deltaY*0.002));
  });

  window.addEventListener("mousemove", e=>{
    if(e.buttons !== 1) return;
    targetRotY += e.movementX * 0.005;
  });

  window.addEventListener("resize", onResize);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// =====================
// LAT/LON
// =====================
function latLonToVec3(lat, lon, r){

  const phi = THREE.MathUtils.degToRad(90-lat);
  const theta = THREE.MathUtils.degToRad(lon+180);

  return new THREE.Vector3(
    -(r * Math.sin(phi) * Math.cos(theta)),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

// =====================
// SUN (ECI → ECEF coherente)
// =====================
function getSunECI(date){

  const jd = date.getTime()/86400000 + 2440587.5;
  const n = jd - 2451545.0;

  const L = (280.46 + 0.9856474 * n) % 360;
  const g = THREE.MathUtils.degToRad((357.528 + 0.9856003 * n) % 360);

  const lambda = THREE.MathUtils.degToRad(
    L + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)
  );

  const epsilon = THREE.MathUtils.degToRad(23.439291);

  const x = Math.cos(lambda);
  const y = Math.cos(epsilon)*Math.sin(lambda);
  const z = Math.sin(epsilon)*Math.sin(lambda);

  return new THREE.Vector3(x,y,z).normalize();
}

// =====================
// GMST
// =====================
function getGMST(date){
  return satellite.gstime(date);
}

// =====================
// LOOP (CRÍTICO)
// =====================
function animate(){

  requestAnimationFrame(animate);

  const now = new Date();

  // =====================
  // EARTH ROTATION (ABSOLUTA, NO INTEGRADA)
  // =====================
  const gmst = getGMST(now);

  earthGroup.rotation.y = -gmst;

  // =====================
  // SUN (coherente con ECI → ECEF)
  // =====================
  const sunECI = getSunECI(now);

  const sunECEF = sunECI.clone().applyAxisAngle(
    new THREE.Vector3(0,1,0),
    gmst
  );

  sunLight.position.copy(sunECEF.multiplyScalar(10));
  sunLight.target.position.set(0,0,0);

  // =====================
  // CAMERA
  // =====================
  rotY += (targetRotY - rotY)*0.08;

  camera.position.x = distance*Math.sin(rotY);
  camera.position.z = distance*Math.cos(rotY);
  camera.position.y = 1.2;

  camera.lookAt(0,0,0);

  renderer.render(scene,camera);
}

</script>

</body>
</html>
