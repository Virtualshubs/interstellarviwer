<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Earth Sun System (Stable + Controls)</title>

<style>
  body { margin:0; overflow:hidden; background:black; }
  #info {
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
    z-index:10;
  }
</style>
</head>

<body>
<div id="info">Stable Earth-Sun system (with zoom & rotation)</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>

<script>

// =====================
// CORE
// =====================
let scene, camera, renderer;
let earth, earthGroup, sunLight;

// =====================
// CAMERA CONTROL
// =====================
let distance = 3;
let targetDistance = 3;

let rotY = 0;
let targetRotY = 0;

let isDragging = false;
let lastX = 0;

// =====================
// INIT
// =====================
init();
animate();

function init(){

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
  );

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // =====================
  // LIGHT
  // =====================
  sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
  scene.add(sunLight);
  scene.add(new THREE.AmbientLight(0xffffff, 0.05));

  // =====================
  // EARTH
  // =====================
  earthGroup = new THREE.Group();
  scene.add(earthGroup);

  earthGroup.rotation.z = THREE.MathUtils.degToRad(23.44);

  const tex = new THREE.TextureLoader().load(
    "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
  );

  earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 64, 64),
    new THREE.MeshStandardMaterial({ map: tex })
  );

  earth.rotation.y = Math.PI;

  earthGroup.add(earth);

  // =====================
  // PIN MADRID
  // =====================
  const pin = new THREE.Mesh(
    new THREE.SphereGeometry(0.02, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xff0000 })
  );

  pin.position.copy(latLonToVec3(40.4168, -3.7038, 1.01));
  earth.add(pin);

  // =====================
  // CONTROLS
  // =====================

  window.addEventListener("wheel", (e)=>{
    targetDistance += e.deltaY * 0.002;
    targetDistance = Math.max(1.8, Math.min(8, targetDistance));
  });

  window.addEventListener("mousedown", (e)=>{
    isDragging = true;
    lastX = e.clientX;
  });

  window.addEventListener("mouseup", ()=>{
    isDragging = false;
  });

  window.addEventListener("mousemove", (e)=>{
    if(!isDragging) return;
    targetRotY += (e.clientX - lastX) * 0.005;
    lastX = e.clientX;
  });

  window.addEventListener("resize", onResize);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// =====================
// LAT/LON
// =====================
function latLonToVec3(lat, lon, r){

  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon + 180);

  return new THREE.Vector3(
    -(r * Math.sin(phi) * Math.cos(theta)),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

// =====================
// SOL (estable)
// =====================
function getSunDirection(date){

  const now = date;

  const dayOfYear = Math.floor(
    (now - new Date(now.getFullYear(),0,0)) / 86400000
  );

  const decl = THREE.MathUtils.degToRad(
    23.44 * Math.sin((2*Math.PI/365) * (dayOfYear - 81))
  );

  const frac = (now.getTime() % 86400000) / 86400000;

  const angle = frac * Math.PI * 2;

  return new THREE.Vector3(
    Math.cos(angle),
    Math.sin(decl),
    Math.sin(angle)
  ).normalize();
}

// =====================
// LOOP
// =====================
function animate(){

  requestAnimationFrame(animate);

  const now = new Date();

  // =====================
  // ROTACIÓN TIERRA
  // =====================
  const rotationSpeed = (2*Math.PI)/86400;
  earthGroup.rotation.y += rotationSpeed;

  // =====================
  // SOL
  // =====================
  const sunDir = getSunDirection(now);

  sunLight.position.copy(sunDir.clone().multiplyScalar(10));
  sunLight.target.position.set(0,0,0);

  // =====================
  // CAMERA SMOOTH
  // =====================
  rotY += (targetRotY - rotY) * 0.08;
  distance += (targetDistance - distance) * 0.08;

  camera.position.x = distance * Math.sin(rotY);
  camera.position.z = distance * Math.cos(rotY);
  camera.position.y = 1.2;

  camera.lookAt(0,0,0);

  renderer.render(scene,camera);
}

</script>

</body>
</html>
