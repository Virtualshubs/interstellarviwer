<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Biomass 3D Voxel Test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#eee;font-family:Arial,sans-serif}
#controls{height:23vh;padding:12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;overflow:auto}
input,textarea,button{background:#1b1b1b;color:#eee;border:1px solid #555;border-radius:4px;padding:7px}
textarea{width:600px;height:55px;font-family:monospace;font-size:11px}
button{cursor:pointer}
button:hover{background:#292929}
label{font-size:12px}
#stats{width:100%;text-align:center;font-size:11px;color:#aaa;line-height:1.6}
#container{width:100vw;height:77vh}
</style>
</head>
<body>

<div id="controls">

<label>Imagen:
<input type="file" id="fileInput" accept="image/*">
</label>

<textarea id="urlInput" placeholder="Pega aquí la URL de la imagen"></textarea>

<label>Lat min:
<input id="latMin" type="number" step="0.000001" value="38.888889">
</label>

<label>Lat max:
<input id="latMax" type="number" step="0.000001" value="39.444444">
</label>

<label>Lon min:
<input id="lonMin" type="number" step="0.000001" value="-2.777778">
</label>

<label>Lon max:
<input id="lonMax" type="number" step="0.000001" value="-2.222222">
</label>

<label>Resolución:
<input id="resolution" type="number" value="100" min="1">
m
</label>

<button id="loadURL">CARGAR URL</button>

<div id="stats">Esperando imagen...</div>

</div>

<div id="container"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

<script>
const container=document.getElementById("container");
const fileInput=document.getElementById("fileInput");
const urlInput=document.getElementById("urlInput");
const loadURL=document.getElementById("loadURL");
const stats=document.getElementById("stats");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x111111);

const camera=new THREE.PerspectiveCamera(
45,
window.innerWidth/(window.innerHeight*0.77),
0.1,
100000
);
camera.position.set(0,0,1.5);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight*0.77);
container.appendChild(renderer.domElement);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

let currentImage=null;
let voxelGroup=null;

function getDimensions(){

const latMin=parseFloat(document.getElementById("latMin").value);
const latMax=parseFloat(document.getElementById("latMax").value);
const lonMin=parseFloat(document.getElementById("lonMin").value);
const lonMax=parseFloat(document.getElementById("lonMax").value);
const resolution=parseFloat(document.getElementById("resolution").value);

const latCenter=(latMin+latMax)/2;

const heightMeters=(latMax-latMin)*111320;
const widthMeters=(lonMax-lonMin)*111320*Math.cos(latCenter*Math.PI/180);

const cols=Math.ceil(widthMeters/resolution);
const rows=Math.ceil(heightMeters/resolution);

return{
latMin,latMax,lonMin,lonMax,
resolution,
widthMeters,
heightMeters,
cols,rows
};
}

function createVoxels(img){

if(voxelGroup){
scene.remove(voxelGroup);
voxelGroup.traverse(o=>{
if(o.geometry)o.geometry.dispose();
if(o.material)o.material.dispose();
});
}

const d=getDimensions();

const canvas=document.createElement("canvas");

const cols=d.cols;
const rows=d.rows;

canvas.width=cols;
canvas.height=rows;

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0,cols,rows);

const data=ctx.getImageData(0,0,cols,rows).data;

voxelGroup=new THREE.Group();

const geometry=new THREE.BoxGeometry(
d.resolution/1000,
d.resolution/1000,
d.resolution/1000
);

const centerX=d.widthMeters/2000;
const centerY=d.heightMeters/2000;

let total=0;
let red=0;
let green=0;
let blue=0;
let other=0;

for(let y=0;y<rows;y++){
for(let x=0;x<cols;x++){

const i=(y*cols+x)*4;

const r=data[i];
const g=data[i+1];
const b=data[i+2];
const a=data[i+3];

if(a<50)continue;

const material=new THREE.MeshBasicMaterial({
color:(r<<16)|(g<<8)|b,
transparent:true,
opacity:0.95
});

const voxel=new THREE.Mesh(geometry,material);

const px=(x+0.5)*d.resolution/1000-centerX;
const py=centerY-(y+0.5)*d.resolution/1000;

voxel.position.set(
px,
py,
0
);

voxelGroup.add(voxel);

total++;

if(r>g*1.15&&r>b*1.15)red++;
else if(g>r*1.15&&g>b*1.05)green++;
else if(b>r*1.15&&b>g*1.05)blue++;
else other++;

}
}

scene.add(voxelGroup);

const maxDimension=Math.max(d.widthMeters,d.heightMeters)/1000;

camera.position.set(
maxDimension*0.8,
maxDimension*0.8,
maxDimension*1.2
);

controls.target.set(0,0,0);
controls.update();

stats.innerHTML=
`Área aproximada: ${d.widthMeters.toFixed(0)} × ${d.heightMeters.toFixed(0)} m · `+
`Resolución: ${d.resolution} m · `+
`Malla: ${cols} × ${rows} · `+
`Voxels: ${total.toLocaleString()}<br>`+
`Rojo: ${(red/total*100||0).toFixed(1)}% · `+
`Verde: ${(green/total*100||0).toFixed(1)}% · `+
`Azul: ${(blue/total*100||0).toFixed(1)}% · `+
`Otros: ${(other/total*100||0).toFixed(1)}%`;
}

function loadImage(src,crossOrigin=false){

const img=new Image();

if(crossOrigin)img.crossOrigin="anonymous";

img.onload=()=>{
currentImage=img;
createVoxels(img);
};

img.onerror=()=>{
stats.textContent="No se pudo cargar la imagen. Si es una URL remota, puede ser un problema de CORS.";
};

img.src=src;
}

fileInput.addEventListener("change",e=>{

const file=e.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=e=>{
loadImage(e.target.result);
};

reader.readAsDataURL(file);

});

loadURL.addEventListener("click",()=>{

const url=urlInput.value.trim();

if(!url)return;

loadImage(url,true);

});

[
"latMin",
"latMax",
"lonMin",
"lonMax",
"resolution"
].forEach(id=>{
document.getElementById(id).addEventListener("change",()=>{
if(currentImage)createVoxels(currentImage);
});
});

function animate(){
requestAnimationFrame(animate);
controls.update();
renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{

camera.aspect=window.innerWidth/(window.innerHeight*0.77);
camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight*0.77
);

});
</script>

</body>
</html>
