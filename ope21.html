const COLORS = {
  COPERNICUS: 0xff7a18,
  WEATHER: 0xb06cff,
  ISS: 0x4aa3ff
};

function getColor(id){
  const sat = SAT_INFO[id];
  if(!sat) return 0xffffff;

  const name = sat.name.toLowerCase();

  if(name.includes("sentinel")) return COLORS.COPERNICUS;
  if(name.includes("noaa") || name.includes("meteosat")) return COLORS.WEATHER;
  if(name.includes("iss")) return COLORS.ISS;

  return 0xffffff;
}

// INIT
// ======================================================
init();
animate();

function init(){

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
  );

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;

  // =========================
  //  LIGHTS (UNCHANGED)
  // =========================
  sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
  scene.add(sunLight);
  scene.add(sunLight.target);

function createLatCircle(radius, lat, segments = 128) {
  const points = [];

  const phi = THREE.MathUtils.degToRad(90 - lat);

  for (let i = 0; i <= segments; i++) {
    const theta = (i / segments) * Math.PI * 2;

    const x = radius * Math.sin(phi) * Math.cos(theta);
    const y = radius * Math.cos(phi);
    const z = radius * Math.sin(phi) * Math.sin(theta);

    points.push(new THREE.Vector3(x, y, z));
  }

  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const material = new THREE.LineBasicMaterial({
    color: 0x39FF14,
    transparent: true,
    opacity: 0.75,
      blending: THREE.AdditiveBlending,
  depthWrite: false
  });

  return new THREE.LineLoop(geometry, material);
}


  function createLonCircle(radius, lon, segments = 128) {
  const points = [];

  const theta = THREE.MathUtils.degToRad(lon + 180);

  for (let i = 0; i <= segments; i++) {
    const phi = (i / segments) * Math.PI;

    const x = radius * Math.sin(phi) * Math.cos(theta);
    const y = radius * Math.cos(phi);
    const z = radius * Math.sin(phi) * Math.sin(theta);

    points.push(new THREE.Vector3(x, y, z));
  }

  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const material = new THREE.LineBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.15,
      blending: THREE.AdditiveBlending,
  depthWrite: false
  });

  return new THREE.Line(geometry, material);
}


function buildStarSphere(){

    // Grupo independiente
    starSphere = new THREE.Group();

    scene.add(starSphere);

    const STAR_COUNT = 1200;
    const STAR_RADIUS = 250;
    const positions = [];
    for(let i=0;i<STAR_COUNT;i++){

        // distribución uniforme sobre una esfera
        const u = Math.random();
        const v = Math.random();
        const theta = 2 * Math.PI * u;
        const phi = Math.acos(2 * v - 1);
        const x = STAR_RADIUS * Math.sin(phi) * Math.cos(theta);
        const y = STAR_RADIUS * Math.cos(phi);
        const z = STAR_RADIUS * Math.sin(phi) * Math.sin(theta);

        positions.push(x,y,z);

    }

    const geometry = new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions,3)
    );

    const material = new THREE.PointsMaterial({

        color:0xffffff,

        size:0.7,

        transparent:true,

        opacity:0.9,

        depthWrite:false

    });

    stars = new THREE.Points(geometry,material);
    starSphere.add(stars);

}

    createSatMesh(id);
    return;

  }

  const group = SAT_INFO[id].group;

  const file = EPHEMERIS_FILES[group];

  if(!file){
    console.error("No hay archivo para",group);
    return;

  }

  const response = await fetch(file);
  const data = await response.json();
  const sat = data.find(
      s => String(s.NORAD_CAT_ID) === String(id)
  );

  if(!sat){
      console.warn("Satélite no encontrado:",id);
      return;
  }

const satrec = satellite.json2satrec(sat);

  TLE_CACHE[id]=satrec;
  satrecs[id]=satrec;
  createSatMesh(id);

}

function updateSatellites(){

  const now = new Date();
  const gmst = satellite.gstime(now);

  for(const id in satrecs){

    const satrec = satrecs[id];

    const pv = satellite.propagate(satrec, now);

    if(!pv.position) continue;

    const geo = satellite.eciToGeodetic(pv.position, gmst);

    const lat = satellite.degreesLat(geo.latitude);
    const lon = satellite.degreesLong(geo.longitude);
    const altKm = geo.height;

    // Velocidad orbital (km/s)
    const velocity = pv.velocity
      ? Math.sqrt(
          pv.velocity.x * pv.velocity.x +
          pv.velocity.y * pv.velocity.y +
          pv.velocity.z * pv.velocity.z
        )
      : 0;

    const mesh = satMeshes[id];
    if(!mesh) continue;

    // Guardamos datos para futuras herramientas
    mesh.userData.lat = lat;
    mesh.userData.lon = lon;
    mesh.userData.alt = altKm;
    mesh.userData.speed = velocity;

// Posición visual
const pos = latLonToVec3(lat, lon - 180, 1.4);

pos.applyAxisAngle(
    new THREE.Vector3(0, 0, 1),
    THREE.MathUtils.degToRad(23.44)
);

mesh.position.copy(pos);

    if(id === currentSat){

      currentLat = lat;
      currentLon = lon;
      currentAlt = altKm;
      currentSpeed = velocity;

      mesh.scale.set(2,2,2);
      mesh.material.color.set(0x00ff00);

    }else{

      mesh.scale.set(1,1,1);
      mesh.material.color.set(getColor(id));

    }

  }

}

function latLonToVec3(lat, lon, r){

  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon + 180);

  return new THREE.Vector3(
    -(r * Math.sin(phi) * Math.cos(theta)),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

function getPasses(id, days = 7){

    const satrec = satrecs[id];

    if(!satrec) return [];

    const value = document.getElementById("citySelect").value;

    if(value==="custom") return [];

    const [lat,lon]=value.split(",").map(Number);

    const observer={
        latitude:satellite.degreesToRadians(lat),
        longitude:satellite.degreesToRadians(lon),
        height:0
    };

    // Comenzar siempre en minuto exacto
    const start=new Date();
    start.setSeconds(0);
    start.setMilliseconds(0);

    const passes=[];
    let current=null;

    for(let t=0;t<=days*86400;t+=10){

        const date=new Date(start.getTime()+t*1000);

        const pv=satellite.propagate(satrec,date);

        if(!pv.position) continue;

        const gmst=satellite.gstime(date);

        const ecf=satellite.eciToEcf(pv.position,gmst);

        const look=satellite.ecfToLookAngles(observer,ecf);

        const elev=satellite.radiansToDegrees(look.elevation);

        const az=satellite.radiansToDegrees(look.azimuth);

        if(elev>0){

            if(!current){

                current={

                    start:date,

                    maxElev:elev,

                    maxDate:date,

                    azStart:az,

                    azMax:az

                };

            }

            if(elev>current.maxElev){

                current.maxElev=elev;

                current.maxDate=date;

                current.azMax=az;

            }

        }else{

            if(current){

                current.end=date;

                current.azEnd=az;

                current.duration=

                    (current.end-current.start)/60000;

                current.score=

                    current.maxElev*2+

                    current.duration;

                current.quality=getPassQuality(current.score);

                passes.push(current);

                current=null;

            }

        }

    }

    passes.sort((a,b)=>b.score-a.score);

    return passes;

}

function azimuthToText(az){

    const dirs=[

        "Norte",
        "Norte-Noreste",
        "Noreste",
        "Este-Noreste",
        "Este",
        "Este-Sureste",
        "Sureste",
        "Sur-Sureste",
        "Sur",
        "Sur-Suroeste",
        "Suroeste",
        "Oeste-Suroeste",
        "Oeste",
        "Oeste-Noroeste",
        "Noroeste",
        "Norte-Noroeste"

    ];

    az=((az%360)+360)%360;

    return dirs[Math.round(az/22.5)%16];

}


  

function getPassQuality(score){

    if(score>220) return "★★★★★ Excelente";

    if(score>170) return "★★★★ Muy bueno";

    if(score>120) return "★★★ Bueno";

    if(score>70) return "★★ Aceptable";

    return "★ Bajo";

}

// LOOP
// ======================================================
function animate(){

  requestAnimationFrame(animate);

  const now = new Date();

  // EARTH ROTATION (UNCHANGED)
  const elapsedSeconds = (Date.now() - startTime) / 1000;
  const rotation = (elapsedSeconds / 86400) * (2 * Math.PI);
  earthGroup.rotation.y = rotation;

  // SUN (NO TOUCH - STABLE SYSTEM)
  const dayOfYear = Math.floor(
    (now - new Date(now.getFullYear(),0,0)) / 86400000
  );

  const decl = THREE.MathUtils.degToRad(
    23.44 * Math.sin((2*Math.PI/365) * (dayOfYear - 81))
  );

  const frac = (now.getTime() % 86400000) / 86400000;
  const angle = frac * Math.PI * 2;

  const sunDir = new THREE.Vector3(
    Math.cos(angle),
    Math.sin(decl),
    Math.sin(angle)
  ).normalize();

  sunLight.position.copy(sunDir.clone().multiplyScalar(50));
  sunLight.target.position.set(0,0,0);

  //  SATELLITES
  updateSatellites();
  updateUI();

  //  CAMERA
  rotY += (targetRotY-rotY)*0.08;
  rotX += (targetRotX-rotX)*0.08;
  distance += (targetDistance-distance)*0.08;

  camera.position.x = distance*Math.cos(rotX)*Math.sin(rotY);
  camera.position.y = distance*Math.sin(rotX);
  camera.position.z = distance*Math.cos(rotX)*Math.cos(rotY);

  camera.lookAt(0,0,0);

  renderer.render(scene,camera);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
