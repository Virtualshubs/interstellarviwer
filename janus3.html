<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>JANUS V3</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#050505;
font-family:Arial,Helvetica,sans-serif;
color:#fff;
}

canvas{
display:block;
}

#ui{
position:absolute;
left:15px;
top:15px;
width:260px;
padding:15px;
background:rgba(15,15,15,.95);
border:1px solid #333;
border-radius:8px;
z-index:10;
}

#ui h2{
font-size:18px;
margin-bottom:15px;
}

label{
display:block;
margin-top:10px;
margin-bottom:4px;
font-size:13px;
color:#aaa;
}

select{
width:100%;
padding:8px;
background:#222;
color:#fff;
border:1px solid #444;
}

button{
width:100%;
padding:10px;
margin-top:10px;
background:#222;
border:1px solid #444;
color:white;
cursor:pointer;
}

button:hover{
background:#333;
}

.row{
display:flex;
justify-content:space-between;
margin-top:8px;
}

#info{
position:absolute;
right:15px;
top:15px;
width:230px;
padding:15px;
background:rgba(15,15,15,.95);
border:1px solid #333;
border-radius:8px;
z-index:10;
}

#cellInfo{
margin-top:10px;
line-height:20px;
font-size:14px;
}

</style>

</head>

<body>

<div id="ui">

<h2>JANUS V3</h2>

<label>Universe Size</label>

<select id="gridSize">

<option value="5">5 × 5</option>
<option value="10">10 × 10</option>
<option value="15">15 × 15</option>
<option value="20">20 × 20</option>

</select>

<label>Mode</label>

<select id="mode">

<option value="free">Free</option>

</select>

<button id="generate">

Generate Universe

</button>

<div class="row">

<span>Observed</span>

<span id="obs">

0 / 0

</span>

</div>

<div class="row">

<span>α</span>

<span id="aa">

--

</span>

</div>

<div class="row">

<span>β</span>

<span id="bb">

--

</span>

</div>

<div class="row">

<span>Accuracy</span>

<span id="acc">

--

</span>

</div>

<button id="solve">

Predict Universe

</button>

<button id="reveal">

Reveal Universe

</button>

</div>

<div id="info">

<h3>Information</h3>

<div id="cellInfo">

Press Generate Universe

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134/build/three.min.js"></script>

<script>

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050505);

const camera=new THREE.PerspectiveCamera(
45,
innerWidth/innerHeight,
0.1,
2000
);

camera.position.set(0,0,45);

const renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1));

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

let N=5;
let STEP=4.2;

const REAL_A=.8;
const REAL_B=.6;

let observed=0;
let required=9;
let solved=false;

const cells=[];

const geometry=new THREE.BoxGeometry(
3.2,
3.2,
0.45
);

function state(x,y,a,b){

const v=Math.sin(x*a)+Math.cos(y*b);

if(v>.5)return 1;
if(v<-.5)return -1;

return 0;

}

function paint(cell,stateValue,opacity=1){

if(stateValue==1)
cell.mesh.material.color.set(0xff4444);

else if(stateValue==-1)
cell.mesh.material.color.set(0x4488ff);

else
cell.mesh.material.color.set(0xffffff);

cell.mesh.material.transparent=true;
cell.mesh.material.opacity=opacity;

}

function clearUniverse(){

for(const c of cells){

scene.remove(c.mesh);

}

cells.length=0;

observed=0;
solved=false;

document.getElementById("obs").textContent="0 / 0";
document.getElementById("aa").textContent="--";
document.getElementById("bb").textContent="--";
document.getElementById("acc").textContent="--";

}

function createUniverse(){

clearUniverse();

N=parseInt(document.getElementById("gridSize").value);

required=9;

STEP=Math.min(4.2,28/N);

const center=(N-1)/2;

for(let y=0;y<N;y++){

for(let x=0;x<N;x++){

const material=new THREE.MeshBasicMaterial({

color:0x222222

});

const mesh=new THREE.Mesh(

geometry,
material

);

mesh.scale.setScalar(5/N);

mesh.position.set(

(x-center)*STEP,
-(y-center)*STEP,
0

);

const value=state(

x,
y,
REAL_A,
REAL_B

);

const cell={

id:cells.length,

x,
y,

real:value,

pred:null,

obs:false,

mesh

};

mesh.userData.cell=cell;

cells.push(cell);

scene.add(mesh);

}

}

document.getElementById("obs").textContent=

observed+" / "+required;

document.getElementById("cellInfo").innerHTML=

"<b>Universe</b><br><br>"+

N+" × "+N+

"<br><br>"+

"Click any "+required+" cells.";

}

document.getElementById("generate").onclick=()=>{

createUniverse();

};

createUniverse();

function solve(){

let best=Infinity;
let bestA=0;
let bestB=0;

for(let a=.1;a<1.5;a+=.02){

for(let b=.1;b<1.5;b+=.02){

let error=0;

for(const c of cells){

if(!c.obs)continue;

if(state(c.x,c.y,a,b)!=c.real)
error++;

}

if(error<best){

best=error;
bestA=a;
bestB=b;

}

}

}

document.getElementById("aa").textContent=bestA.toFixed(2);
document.getElementById("bb").textContent=bestB.toFixed(2);

for(const c of cells){

if(c.obs)continue;

c.pred=state(c.x,c.y,bestA,bestB);

paint(c,c.pred,.35);

}

solved=true;

}

renderer.domElement.addEventListener("pointerdown",e=>{

if(solved)return;

mouse.x=(e.clientX/innerWidth)*2-1;
mouse.y=-(e.clientY/innerHeight)*2+1;

raycaster.setFromCamera(mouse,camera);

const hit=raycaster.intersectObjects(scene.children);

if(hit.length==0)return;

const cell=hit[0].object.userData.cell;

if(!cell)return;
if(cell.obs)return;

cell.obs=true;

observed++;

paint(cell,cell.real);

document.getElementById("obs").textContent=

observed+" / "+required;

document.getElementById("cellInfo").innerHTML=

"<b>Cell</b> "+cell.id+

"<br><br>"+

"Grid : ("+cell.x+","+cell.y+")"+

"<br>"+

"State : "+cell.real;

if(observed>=required){

solve();

}

});

document.getElementById("solve").onclick=()=>{

if(!solved){

solve();

}

};

document.getElementById("reveal").onclick=()=>{

let ok=0;
let total=0;

for(const c of cells){

if(!c.obs){

total++;

if(c.pred==c.real)
ok++;

}

paint(c,c.real,1);

}

let acc=100;

if(total>0){

acc=Math.round((ok/total)*100);

}

document.getElementById("acc").textContent=acc+"%";

};

window.addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);

});

(function animate(){

requestAnimationFrame(animate);

renderer.render(scene,camera);

})();

</script>

</body>
</html>
