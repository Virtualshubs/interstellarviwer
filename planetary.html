<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Microsoft Planetary Computer STAC Test</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
}

header{
padding:24px;
background:#222;
color:#fff;
}

main{
max-width:1200px;
margin:0 auto;
padding:24px;
}

.panel{
background:#fff;
border:1px solid #ddd;
border-radius:8px;
padding:18px;
margin-bottom:18px;
}

h1,h2,h3{
margin-top:0;
}

button,
select,
input{
font:inherit;
padding:9px 11px;
border:1px solid #bbb;
border-radius:5px;
background:#fff;
}

button{
cursor:pointer;
background:#222;
color:#fff;
border-color:#222;
}

.controls{
display:flex;
gap:8px;
flex-wrap:wrap;
}

input{
flex:1;
min-width:260px;
}

#status{
margin-top:12px;
color:#666;
}

#collections{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(250px,1fr));
gap:10px;
}

.collection{
padding:14px;
border:1px solid #ddd;
border-radius:6px;
background:#fafafa;
cursor:pointer;
}

.collection:hover{
background:#eee;
}

.collection strong{
display:block;
margin-bottom:6px;
}

.meta{
font-size:13px;
color:#666;
}

pre{
white-space:pre-wrap;
word-break:break-word;
max-height:600px;
overflow:auto;
background:#f1f1f1;
padding:14px;
border-radius:6px;
font-size:12px;
}

#details{
display:none;
}

#items{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(250px,1fr));
gap:10px;
margin-top:15px;
}
</style>
</head>

<body>

<header>
<h1>Microsoft Planetary Computer — STAC Test</h1>
<div>Direct STAC API test</div>
</header>

<main>

<section class="panel">

<h2>STAC API</h2>

<div class="controls">

<input
id="stacUrl"
value="https://planetarycomputer.microsoft.com/api/stac/v1"
>

<button id="loadBtn">
Load catalog
</button>

</div>

<div id="status">
Ready
</div>

</section>


<section class="panel">

<h2>API diagnostics</h2>

<pre id="diagnostic">Not tested yet.</pre>

</section>


<section class="panel">

<h2>Root</h2>

<pre id="rootJson"></pre>

</section>


<section class="panel">

<h2>Collections</h2>

<div id="collections"></div>

</section>


<section
class="panel"
id="details"
>

<h2 id="collectionTitle"></h2>

<div
id="collectionMeta"
class="meta"
></div>


<h3 style="margin-top:20px">
Collection JSON
</h3>

<pre id="collectionJson"></pre>


<h3 style="margin-top:20px">
Items
</h3>

<div
id="itemsStatus"
class="meta"
></div>

<div id="items"></div>

<pre id="itemJson"></pre>

</section>

</main>


<script>

const BASE=
"https://planetarycomputer.microsoft.com/api/stac/v1";

let collections=[];
let activeCollection=null;


const $=id=>
document.getElementById(id);


/* ===============================
   DIRECT FETCH
   =============================== */

async function request(url){

console.log(
"STAC REQUEST:",
url
);

try{

const res=
await fetch(
url,
{
method:"GET",
mode:"cors",
cache:"no-store"
}
);


console.log(
"STATUS:",
res.status
);

console.log(
"TYPE:",
res.type
);

console.log(
"URL:",
res.url
);


if(!res.ok){

throw new Error(
`HTTP ${res.status} ${res.statusText}`
);

}


const text=
await res.text();


console.log(
"BODY PREVIEW:",
text.slice(0,500)
);


return JSON.parse(text);

}catch(error){

console.error(
"REQUEST ERROR:",
url,
error
);

throw error;

}

}


/* ===============================
   LOAD ROOT
   =============================== */

async function loadRoot(){

const base=
$("stacUrl")
.value
.trim()
.replace(/\/+$/,"");

const url=
`${base}/`;

$("diagnostic").textContent=
"REQUESTING ROOT:\n\n"+
url;

try{

const data=
await request(url);

$("rootJson").textContent=
JSON.stringify(
data,
null,
2
);

$("diagnostic").textContent=
"ROOT SUCCESS\n\n"+
url+
"\n\n"+
"STAC VERSION:\n"+
(
data.stac_version||
"not present"
)+
"\n\n"+
"TYPE:\n"+
(
data.type||
"not present"
)+
"\n\n"+
"TITLE:\n"+
(
data.title||
"not present"
);

return data;

}catch(error){

$("diagnostic").textContent=
"ROOT FAILED\n\n"+
url+
"\n\n"+
error.name+
"\n"+
error.message;

throw error;

}

}


/* ===============================
   LOAD COLLECTIONS
   =============================== */

async function loadCollections(){

const base=
$("stacUrl")
.value
.trim()
.replace(/\/+$/,"");

const url=
`${base}/collections`;

$("diagnostic").textContent+=
"\n\nREQUESTING COLLECTIONS:\n\n"+
url;

try{

const data=
await request(url);

collections=
data.collections||[];

$("diagnostic").textContent+=
"\n\nCOLLECTIONS SUCCESS\n\n"+
"COUNT: "+
collections.length;

renderCollections(
collections
);

return data;

}catch(error){

$("diagnostic").textContent+=
"\n\nCOLLECTIONS FAILED\n\n"+
error.name+
"\n"+
error.message;

throw error;

}

}


/* ===============================
   LOAD CATALOG
   =============================== */

async function loadCatalog(){

$("status").textContent=
"Loading STAC API...";

$("collections").innerHTML="";

$("details").style.display=
"none";

$("rootJson").textContent="";

$("diagnostic").textContent=
"Starting direct STAC test...";


try{

await loadRoot();

await loadCollections();

$("status").textContent=
`${collections.length} collections loaded`;

}catch(error){

console.error(
"CATALOG ERROR:",
error
);

$("status").textContent=
`Error: ${error.message}`;

}

}


/* ===============================
   RENDER COLLECTIONS
   =============================== */

function renderCollections(list){

const container=
$("collections");

container.innerHTML="";


if(!list.length){

container.textContent=
"No collections found.";

return;

}


list.forEach(col=>{

const card=
document.createElement("div");

card.className=
"collection";


const title=
document.createElement("strong");

title.textContent=
col.title||col.id;


const id=
document.createElement("div");

id.className=
"meta";

id.textContent=
col.id;


card.appendChild(title);
card.appendChild(id);


card.onclick=()=>
openCollection(col);


container.appendChild(card);

});

}


/* ===============================
   OPEN COLLECTION
   =============================== */

async function openCollection(col){

activeCollection=
col;

$("details").style.display=
"block";

$("collectionTitle").textContent=
col.title||col.id;

$("collectionMeta").textContent=
col.id;

$("collectionJson").textContent=
JSON.stringify(
col,
null,
2
);

$("items").innerHTML="";

$("itemJson").textContent="";

$("itemsStatus").textContent=
"";


const collectionLink=
col.links?.find(
link=>link.rel==="self"
)?.href;


const itemsLink=
col.links?.find(
link=>link.rel==="items"
)?.href;


if(!collectionLink){

$("itemsStatus").textContent=
"No self link in this collection.";

return;

}


try{

$("itemsStatus").textContent=
"Loading collection...";


const collection=
await request(
collectionLink
);

$("collectionJson").textContent=
JSON.stringify(
collection,
null,
2
);


}catch(error){

console.error(
"COLLECTION ERROR:",
error
);

$("itemsStatus").textContent=
`Collection error: ${error.message}`;

return;

}


if(!itemsLink){

$("itemsStatus").textContent=
"No items link in this collection.";

return;

}


try{

$("itemsStatus").textContent=
"Loading items...";


const data=
await request(
itemsLink
);

const features=
data.features||[];

$("itemsStatus").textContent=
`${features.length} items loaded`;

renderItems(
features
);


if(features.length){

$("itemJson").textContent=
JSON.stringify(
features[0],
null,
2
);

}

}catch(error){

console.error(
"ITEM ERROR:",
error
);

$("itemsStatus").textContent=
`Item error: ${error.message}`;

}

}


/* ===============================
   RENDER ITEMS
   =============================== */

function renderItems(features){

const container=
$("items");

container.innerHTML="";


features
.slice(0,100)
.forEach(item=>{

const card=
document.createElement("div");

card.className=
"collection";


const title=
document.createElement("strong");

title.textContent=
item.properties?.datetime||
item.id||
"Item";


const id=
document.createElement("div");

id.className=
"meta";

id.textContent=
item.id||"";


card.appendChild(title);
card.appendChild(id);


card.onclick=function(){

$("itemJson").textContent=
JSON.stringify(
item,
null,
2
);

};


container.appendChild(card);

});

}


/* ===============================
   EVENTS
   =============================== */

$("loadBtn").onclick=
loadCatalog;


loadCatalog();

</script>

</body>
</html>
