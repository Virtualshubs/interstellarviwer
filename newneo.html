<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NASA GIBS Explorer v3</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{

height:100vh;
display:flex;
background:#090d14;
color:white;

}



#panel{

width:430px;
background:#141b26;
padding:25px;
overflow:auto;
border-right:1px solid rgba(255,255,255,.08);

}



h1{

font-size:22px;
margin-bottom:5px;

}



small{

color:#7d8ca5;

}



.group{

margin-top:20px;

}



label{

display:block;
margin-bottom:6px;
font-size:13px;
color:#bfc9d9;

}



select,
input{

width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#1f2838;
color:white;

}



button{

width:100%;
margin-top:20px;
padding:12px;
border:none;
border-radius:8px;
background:#0099ff;
color:white;
cursor:pointer;

}



button:hover{

background:#00b7ff;

}



textarea{

width:100%;
height:120px;
margin-top:15px;
background:#10151d;
color:#65ff7c;
border:none;
border-radius:8px;
padding:10px;
font-size:12px;

}



#status{

margin-top:15px;
font-size:13px;
color:#7fe28f;

}



#count{

margin-top:15px;
color:#8fc7ff;
font-size:13px;

}



#viewer{

flex:1;
display:flex;
align-items:center;
justify-content:center;

}



img{

max-width:95%;
max-height:95%;
border-radius:10px;

}


</style>


</head>


<body>



<div id="panel">


<h1>
NASA GIBS Explorer
</h1>


<small>
Dynamic WMS Catalog Browser
</small>



<div id="count">
Loading layers...
</div>




<div class="group">


<label>
Search Layer
</label>


<input
id="search"
placeholder="cloud, fire, temperature..."
>


</div>




<div class="group">


<label>
Dataset
</label>


<select id="layer"></select>


</div>




<div class="group">


<label>
Available Date
</label>


<select id="date"></select>


</div>





<div class="group">


<label>
Image Quality
</label>


<select id="size">


<option value="1800,900">
Preview · 1800x900
</option>


<option value="3600,1800" selected>
Standard · 3600x1800
</option>


<option value="5400,2700">
High · 5400x2700
</option>


<option value="7200,3600">
Ultra · 7200x3600
</option>


</select>


</div>





<div class="group">


<label>
Width
</label>


<input
id="width"
type="number"
value="3600"
>


</div>





<div class="group">


<label>
Height
</label>


<input
id="height"
type="number"
value="1800"
>


</div>





<button id="generate">

Generate Image

</button>



<textarea id="url" readonly></textarea>



<div id="status">

Waiting...

</div>



</div>





<div id="viewer">


<img id="preview">


</div>





<script>


const CAPABILITIES =

"https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetCapabilities";



let layers=[];


const layerSelect =
document.getElementById("layer");


const dateSelect =
document.getElementById("date");


const sizeSelect =
document.getElementById("size");


const preview =
document.getElementById("preview");


const status =
document.getElementById("status");


const output =
document.getElementById("url");


const search =
document.getElementById("search");



document.getElementById("size")
.onchange=function(){


const values =
this.value.split(",");


document.getElementById("width").value =
values[0];


document.getElementById("height").value =
values[1];


};






async function loadCapabilities(){


try{


status.innerHTML=
"Loading capabilities...";


const response =
await fetch(CAPABILITIES);

const text =
await response.text();

const xml =
new DOMParser()
.parseFromString(text,"text/xml");


const nodes =
xml.querySelectorAll("Layer > Layer");



layers=[];



nodes.forEach(node=>{

const name =
node.querySelector(":scope > Name");

if(!name) return;

const title =
node.querySelector(":scope > Title");

let times=[];

const dimensions =
node.querySelectorAll(":scope > Dimension");

dimensions.forEach(dim=>{


if(
dim.getAttribute("name")
==="time"
){

times =
parseTime(
dim.textContent.trim()
);

}


});




layers.push({

name:name.textContent.trim(),

title:title?
title.textContent.trim():
name.textContent.trim(),

times:times


});



});





document.getElementById("count").innerHTML=

"Available layers: "
+
layers.length;



buildMenu();



status.innerHTML=
"✅ Capabilities loaded";


}

catch(e){


console.error(e);

status.innerHTML=
"❌ Capability error";


}


}







function parseTime(value){


if(!value)
return [];

let dates=[];

if(value.includes(",")){


dates=value
.split(",")
.map(v=>v.trim());


}



else if(value.includes("/")){


const parts=value.split("/");


let current=
new Date(parts[0]);


const end=
new Date(parts[1]);



while(current<=end){


dates.push(
current.toISOString()
.substring(0,10)
);



current.setDate(
current.getDate()+1
);


}


}



return dates.reverse();


}








function buildMenu(){

layerSelect.innerHTML="";

layers
.slice(0,500)
.forEach((layer,index)=>{

const option =
document.createElement("option");

option.value=index;

option.textContent =
layer.title;

layerSelect.appendChild(option);



});


updateDates();

updateRecommendedSize();


}






function updateDates(){

dateSelect.innerHTML="";

const layer =
layers[layerSelect.value];

if(!layer || layer.times.length===0){


const option =
document.createElement("option");
option.value =
new Date()
.toISOString()
.substring(0,10);

option.textContent =
"Default";

dateSelect.appendChild(option);


return;


}




layer.times.forEach(date=>{


const option =
document.createElement("option");
option.value=date;
option.textContent=date;
dateSelect.appendChild(option);


});


}




function updateRecommendedSize(){


const layer =
layers[layerSelect.value];


if(!layer)
return;



let size="3600,1800";



const name =
(
layer.name+
" "+
layer.title

)
.toLowerCase();




if(

name.includes("blue")

||

name.includes("truecolor")

||

name.includes("viirs")

){

size="5400,2700";

}



if(

name.includes("fire")

||

name.includes("active")

){

size="1800,900";

}



if(

name.includes("aerosol")

||

name.includes("temperature")

||

name.includes("precipitation")

){

size="3600,1800";

}



sizeSelect.value=size;



const values =
size.split(",");


document.getElementById("width").value =
values[0];


document.getElementById("height").value =
values[1];


}


layerSelect.onchange=function(){


updateDates();

updateRecommendedSize();


};



search.oninput=function(){


const value =
search.value.toLowerCase();



layerSelect.innerHTML="";



layers

.filter(layer=>


layer.title
.toLowerCase()
.includes(value)

||

layer.name
.toLowerCase()
.includes(value)

)

.slice(0,500)

.forEach(layer=>{


const option =
document.createElement("option");


option.value =
layers.indexOf(layer);


option.textContent =
layer.title;


layerSelect.appendChild(option);


});


updateDates();

updateRecommendedSize();


};









function generate(){

const layer =
layers[layerSelect.value];

const params =
new URLSearchParams({


SERVICE:"WMS",

REQUEST:"GetMap",

VERSION:"1.3.0",

LAYERS:
layer.name,

FORMAT:"image/jpeg",

CRS:"EPSG:4326",

BBOX:"-90,-180,90,180",

WIDTH:
document.getElementById("width").value,

HEIGHT:
document.getElementById("height").value,

TIME:
dateSelect.value


});




const url =

"https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?"

+
params.toString();


output.value=url;

status.innerHTML=
"Loading image...";

preview.onload=function(){

status.innerHTML=
"✅ Image loaded";


};



preview.onerror=function(){


status.innerHTML=
"❌ No data available";


};


preview.src=url;

}

document
.getElementById("generate")
.onclick=
generate;

loadCapabilities();



</script>


</body>

</html>
