<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NASA GIBS Explorer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:#0b1018;
    color:#fff;

    display:flex;

    height:100vh;

}

#panel{

    width:360px;

    background:#141b26;

    padding:25px;

    overflow:auto;

    border-right:1px solid rgba(255,255,255,.08);

}

h1{

    font-size:22px;
    margin-bottom:5px;

}

small{

    color:#7d8ca5;

}

.group{

    margin-top:22px;

}

label{

    display:block;

    margin-bottom:6px;

    font-size:13px;

    color:#bfc9d9;

}

select,
input{

    width:100%;

    padding:10px;

    background:#1f2838;

    color:white;

    border:none;

    border-radius:8px;

}

button{

    width:100%;

    margin-top:25px;

    padding:12px;

    border:none;

    border-radius:8px;

    background:#0099ff;

    color:white;

    font-size:15px;

    cursor:pointer;

}

button:hover{

    background:#00b7ff;

}

textarea{

    width:100%;

    height:120px;

    margin-top:15px;

    background:#10151d;

    color:#65ff7c;

    border:none;

    border-radius:8px;

    padding:10px;

    resize:none;

    font-size:12px;

}

#status{

    margin-top:18px;

    font-size:13px;

    color:#7fe28f;

}

#viewer{

    flex:1;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#090d14;

}

img{

    max-width:95%;

    max-height:95%;

    border-radius:10px;

    box-shadow:0 0 30px rgba(0,0,0,.4);

}

</style>

</head>
<body>

<div id="panel">

<h1>NASA GIBS Explorer</h1>

<small>Dynamic WMS URL Generator</small>

<div class="group">

<label>Dataset</label>

<select id="layer">

<option value="BlueMarble_NextGeneration">
Blue Marble
</option>

<option value="MODIS_Terra_CorrectedReflectance_TrueColor">
True Color
</option>

<option value="MODIS_Terra_CorrectedReflectance_Bands367">
Bands 367
</option>

<option value="MODIS_Terra_SurfaceReflectance_Bands143">
Surface Reflectance
</option>

</select>

</div>

<div class="group">

<label>Date</label>

<input
type="date"
id="date">

</div>

<div class="group">

<label>Width</label>

<input
id="width"
type="number"
value="3600">

</div>

<div class="group">

<label>Height</label>

<input
id="height"
type="number"
value="1800">

</div>

<div class="group">

<label>Format</label>

<select id="format">

<option value="image/jpeg">
JPEG
</option>

<option value="image/png">
PNG
</option>

</select>

</div>

<button id="generate">

Generate URL

</button>

<textarea
id="url"
readonly></textarea>

<div id="status">

Waiting...

</div>

</div>

<div id="viewer">

<img id="preview">

</div>

<script>

const preview=document.getElementById("preview");

const status=document.getElementById("status");

const output=document.getElementById("url");

document.getElementById("date").value=
new Date().toISOString().substring(0,10);

document
.getElementById("generate")
.onclick=generate;



function generate(){

    const params=new URLSearchParams({

        SERVICE:"WMS",

        REQUEST:"GetMap",

        VERSION:"1.3.0",

        LAYERS:
        document.getElementById("layer").value,

        FORMAT:
        document.getElementById("format").value,

        CRS:"EPSG:4326",

        BBOX:"-90,-180,90,180",

        WIDTH:
        document.getElementById("width").value,

        HEIGHT:
        document.getElementById("height").value,

        TIME:
        document.getElementById("date").value

    });

    const url=
    "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?"
    +params.toString();

    output.value=url;

    status.innerHTML="Loading image...";

    preview.onload=function(){

        status.innerHTML="✅ Image Loaded";

    }

    preview.onerror=function(){

        status.innerHTML="❌ Unable to load image";

    }

    preview.src=url;

}

generate();

</script>

</body>
</html>
