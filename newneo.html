<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NASA GIBS Dynamic Explorer</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}


body{

    height:100vh;
    display:flex;

    background:#090d14;
    color:white;

}



#panel{

    width:420px;

    background:#141b26;

    padding:25px;

    overflow:auto;

    border-right:
    1px solid rgba(255,255,255,.08);

}



h1{

    font-size:22px;
    margin-bottom:5px;

}



small{

    color:#7d8ca5;

}



.group{

    margin-top:20px;

}



label{

    display:block;

    font-size:13px;

    color:#bfc9d9;

    margin-bottom:6px;

}



select,
input{

    width:100%;

    padding:10px;

    border:none;

    border-radius:8px;

    background:#1f2838;

    color:white;

}



button{

    width:100%;

    margin-top:20px;

    padding:12px;

    border:none;

    border-radius:8px;

    background:#0099ff;

    color:white;

    cursor:pointer;

}



button:hover{

    background:#00b7ff;

}



textarea{

    width:100%;

    height:120px;

    margin-top:15px;

    background:#10151d;

    color:#65ff7c;

    border:none;

    border-radius:8px;

    padding:10px;

    font-size:12px;

}



#status{

    margin-top:15px;

    font-size:13px;

    color:#7fe28f;

}



#count{

    margin-top:15px;

    font-size:13px;

    color:#8fc7ff;

}



#viewer{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

}



img{

    max-width:95%;
    max-height:95%;

    border-radius:10px;

}



</style>


</head>


<body>


<div id="panel">


<h1>
NASA GIBS Explorer
</h1>


<small>
Dynamic GetCapabilities Browser
</small>



<div id="count">

Loading layers...

</div>



<div class="group">


<label>
Search Layer
</label>


<input
id="search"
placeholder="cloud, fire, temperature..."
>


</div>



<div class="group">


<label>
Dataset
</label>


<select id="layer">


</select>


</div>




<div class="group">


<label>
Date
</label>


<input
type="date"
id="date"
>


</div>




<div class="group">


<label>
Width
</label>


<input
id="width"
type="number"
value="3600"
>


</div>



<div class="group">


<label>
Height
</label>


<input
id="height"
type="number"
value="1800"
>


</div>




<button id="generate">

Generate Image

</button>




<textarea
id="url"
readonly
></textarea>



<div id="status">

Waiting...

</div>



</div>



<div id="viewer">

<img id="preview">

</div>




<script>


const CAPABILITIES =

"https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetCapabilities";



let layers=[];



const select =
document.getElementById("layer");


const search =
document.getElementById("search");


const preview =
document.getElementById("preview");


const status =
document.getElementById("status");


const output =
document.getElementById("url");




document.getElementById("date").value =

new Date().toISOString().substring(0,10);





async function loadCapabilities(){


try{


status.innerHTML="Loading capabilities...";



const response =
await fetch(CAPABILITIES);



const text =
await response.text();



const xml =
new DOMParser()
.parseFromString(text,"text/xml");



const nodes =
xml.querySelectorAll("Layer > Layer > Name");



layers=[];



nodes.forEach(node=>{


const name =
node.textContent;



const parent =
node.parentElement;



const title =
parent.querySelector("Title");


layers.push({

name:name,

title:title?
title.textContent:
name

});


});



document.getElementById("count").innerHTML =

"Available layers: "
+
layers.length;



buildMenu();



status.innerHTML=
"✅ Capabilities loaded";


}

catch(e){


status.innerHTML=
"❌ Error loading capabilities";


console.error(e);


}


}




function buildMenu(){


select.innerHTML="";



layers
.slice(0,500)
.forEach((layer)=>{


const option =
document.createElement("option");


option.value=
layer.name;


option.textContent=
layer.title;


select.appendChild(option);


});


}





search.oninput=function(){


const value =
search.value.toLowerCase();



select.innerHTML="";



layers

.filter(l=>

l.title
.toLowerCase()
.includes(value)

||

l.name
.toLowerCase()
.includes(value)

)

.slice(0,500)

.forEach(layer=>{


const option =
document.createElement("option");


option.value=
layer.name;


option.textContent=
layer.title;


select.appendChild(option);


});


};






function generate(){



const params =
new URLSearchParams({


SERVICE:"WMS",

REQUEST:"GetMap",

VERSION:"1.3.0",

LAYERS:
select.value,

FORMAT:"image/jpeg",

CRS:"EPSG:4326",

BBOX:"-90,-180,90,180",

WIDTH:
document.getElementById("width").value,

HEIGHT:
document.getElementById("height").value,

TIME:
document.getElementById("date").value


});



const url =

"https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?"

+
params.toString();



output.value=url;



status.innerHTML=
"Loading image...";



preview.onload=function(){

status.innerHTML=
"✅ Image loaded";

};



preview.onerror=function(){

status.innerHTML=
"❌ Layer unavailable";

};



preview.src=url;


}



document
.getElementById("generate")
.onclick=generate;




loadCapabilities();



</script>


</body>

</html>
