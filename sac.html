<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SAC v2</title>

<style>
body{margin:0;background:#0b1018;color:#fff;font-family:Arial;overflow:hidden}
#container{display:flex;height:100vh}
#viewer{flex:1;background:#111}
#panel{width:420px;background:#151c28;padding:20px;overflow:auto}

textarea{
 width:100%;
 height:180px;
 background:#0d1320;
 color:#7dffcb;
 margin-bottom:10px;
}

button{width:100%;padding:10px;margin:6px 0}

.box{
 background:#0d1320;
 padding:10px;
 margin-top:10px;
 white-space:pre-wrap;
 font-size:12px;
}

h3{margin:10px 0 5px 0;font-size:14px}
</style>
</head>

<body>
<div id="container">
  <div id="viewer"></div>

  <div id="panel">

    <input type="file" id="glbInput" accept=".glb,.gltf">

    <h3>Metadatos del GLB (originales)</h3>
    <div id="originalBox" class="box">Esperando modelo...</div>

    <h3>Nuevos datos estructurados (Space)</h3>
    <textarea id="spaceInput" placeholder='Pega aquí el JSON Space'></textarea>

    <button id="mergeBtn" disabled>Fusionar Space</button>
    <button id="validateBtn" disabled>Validar resultado</button>
    <button id="sealBtn" disabled>Sellar activo</button>
    <button id="downloadBtn" disabled>Descargar GLB</button>

    <h3>Metadatos finales</h3>
    <div id="finalBox" class="box"></div>

    <div id="status" class="box">Esperando modelo...</div>
  </div>
</div>

<script src="https://unpkg.com/three@0.134.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.134.0/examples/js/exporters/GLTFExporter.js"></script>

<script>
let scene,camera,renderer,controls;
let currentModel=null;
let originalMetadata={};
let finalMetadata=null;
let sealed=false;

const viewer=document.getElementById("viewer");

scene=new THREE.Scene();
scene.background=new THREE.Color(0x10141d);

camera=new THREE.PerspectiveCamera(60,1,0.1,1000);
camera.position.set(2,2,4);

renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth-420,window.innerHeight);
viewer.appendChild(renderer.domElement);

controls=new THREE.OrbitControls(camera,renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.2));
const dl=new THREE.DirectionalLight(0xffffff,2);
dl.position.set(5,5,5);
scene.add(dl);

scene.add(new THREE.GridHelper(10,10));

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();

/* =======================
   1. CARGAR GLB
======================= */
document.getElementById("glbInput").onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;

 const url=URL.createObjectURL(file);

 new THREE.GLTFLoader().load(url,gltf=>{

   if(currentModel) scene.remove(currentModel);

   currentModel=gltf.scene;
   scene.add(currentModel);

   /* LEER METADATOS ORIGINALES */
   originalMetadata =
     gltf.parser?.json?.asset?.extras || {};

   document.getElementById("originalBox").textContent =
     JSON.stringify(originalMetadata,null,2);

   document.getElementById("status").textContent =
     "Modelo cargado";

   document.getElementById("mergeBtn").disabled=false;

   URL.revokeObjectURL(url);
 });
};

/* =======================
   2. FUSIONAR SPACE
======================= */
document.getElementById("mergeBtn").onclick=()=>{

 try{
   const spaceData =
     JSON.parse(document.getElementById("spaceInput").value || "{}");

   finalMetadata = {
     ...originalMetadata,
     Space: spaceData
   };

   document.getElementById("finalBox").textContent =
     JSON.stringify(finalMetadata,null,2);

   document.getElementById("status").textContent =
     "Space añadido correctamente";

   document.getElementById("validateBtn").disabled=false;

 }catch(err){
   document.getElementById("status").textContent =
     "JSON inválido en Space";
 }
};

/* =======================
   3. VALIDAR
======================= */
document.getElementById("validateBtn").onclick=()=>{

 if(!finalMetadata){
   alert("Primero fusiona Space");
   return;
 }

 document.getElementById("status").textContent =
   "Metadatos validados";

 document.getElementById("sealBtn").disabled=false;
};

/* =======================
   4. SELLAR
======================= */
document.getElementById("sealBtn").onclick=()=>{

 if(!currentModel || !finalMetadata) return;

 currentModel.userData.asset = {
   extras: finalMetadata
 };

 sealed=true;

 document.getElementById("status").textContent =
   "Activo sellado";

 document.getElementById("downloadBtn").disabled=false;
};

/* =======================
   5. DESCARGAR
======================= */
document.getElementById("downloadBtn").onclick=()=>{

 if(!sealed) return;

 const exporter=new THREE.GLTFExporter();

 exporter.parse(scene,result=>{

   const blob=new Blob(
     [JSON.stringify(result,null,2)],
     {type:"model/gltf+json"}
   );

   const a=document.createElement("a");
   a.href=URL.createObjectURL(blob);
   a.download="sac_asset.gltf";
   a.click();

 },{binary:false});
};
</script>
</body>
</html>
