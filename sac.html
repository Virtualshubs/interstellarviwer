<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SAC v2</title>

<style>
body{margin:0;background:#0b1018;color:#fff;font-family:Arial;overflow:hidden}
#container{display:flex;height:100vh}
#viewer{flex:1;background:#111}
#panel{width:420px;background:#151c28;padding:20px;overflow:auto}

textarea{
 width:100%;
 height:160px;
 background:#0d1320;
 color:#7dffcb;
 margin-bottom:10px;
}

button{width:100%;padding:10px;margin:6px 0}

.box{
 background:#0d1320;
 padding:10px;
 margin-top:10px;
 white-space:pre-wrap;
 font-size:12px;
}

h3{margin:10px 0 5px 0;font-size:14px}
</style>
</head>

<body>
<div id="container">
  <div id="viewer"></div>

  <div id="panel">

    <input type="file" id="glbInput" accept=".glb,.gltf">

   <label>Satélite predefinido</label>

   <div class="section">

    <label>Modelo 3D</label>

    <input
        id="modelUrlInput"
        type="text"
        placeholder="URL del modelo GLB">

    <small>
        Modelo predefinido. Puedes sustituirlo por el GLB de tu propia biblioteca.
    </small>

</div>

<div class="section">

    <label>Satélite</label>

    <select id="satelliteSelector">

        <option value="">Seleccionar...</option>

    </select>

</div>

    <h3>Metadatos del GLB (originales)</h3>
    <div id="originalBox" class="box">Esperando modelo...</div>

    <h3>Datos estructurados (Space)</h3>
 <textarea id="spaceInput">
{
  "identity": {
    "name": "Sentinel-2A",
    "norad": 40697,
    "cospar": "2015-028A"
  },
  "mission": {
    "agency": "ESA",
    "operator": "Copernicus",
    "mission": "Earth Observation",
    "type": "Optical Multispectral",
    "status": "Active"
  },
  "orbit": {
    "provider": "celestrak",
    "format": "TLE",
    "query": {
      "mode": "CATNR",
      "value": 40697
    }
  },
  "payload": {
    "instruments": [
      "MSI"
    ]
  },
  "capabilities": [
    "Agriculture",
    "Water",
    "Vegetation"
  ]
}
</textarea>

    <button id="mergeBtn" disabled>Fusionar Space</button>
    <button id="validateBtn" disabled>Validar resultado</button>
    <button id="sealBtn" disabled>Sellar activo</button>
    <button id="downloadBtn" disabled>Descargar GLB</button>

    <h3>Metadatos finales</h3>
    <div id="finalBox" class="box"></div>

    <div id="status" class="box">Esperando modelo...</div>
  </div>
</div>

 
<script src="/sat-info.js"></script>
<script src="https://unpkg.com/three@0.134.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.134.0/examples/js/exporters/GLTFExporter.js"></script>

<script>

let scene,camera,renderer,controls;
let currentModel=null;

scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b1018);

/* ================= CAMERA ================= */
camera=new THREE.PerspectiveCamera(
  50,
  (window.innerWidth - 420) / window.innerHeight,
  0.1,
  2000
);
camera.position.set(2.5,2,4);

/* ================= RENDERER (MEJORADO) ================= */
renderer=new THREE.WebGLRenderer({
  antialias:true,
  alpha:false,
  powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth-420,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

/* 🔥 CALIDAD VISUAL */
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

document.getElementById("viewer").appendChild(renderer.domElement);

/* ================= CONTROLS ================= */
controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=0.05;
controls.minDistance=1;
controls.maxDistance=50;

/* ================= LIGHTING (MEJORADO) ================= */

// Luz ambiente suave
scene.add(new THREE.AmbientLight(0xffffff,0.35));

// Luz hemisférica más natural
const hemi=new THREE.HemisphereLight(0xffffff,0x223344,0.8);
scene.add(hemi);

// Luz direccional principal (tipo sol)
const dl=new THREE.DirectionalLight(0xffffff,2.2);
dl.position.set(5,8,5);
dl.castShadow=false;
scene.add(dl);

// Luz secundaria para relleno
const dl2=new THREE.DirectionalLight(0x88aaff,0.6);
dl2.position.set(-5,3,-5);
scene.add(dl2);

/* ================= GRID (OPCIONAL MÁS LIMPIO) ================= */
const grid=new THREE.GridHelper(10,10,0x334455,0x1a2633);
grid.position.y=0;
scene.add(grid);

/* ================= LOOP ================= */
function animate(){
  requestAnimationFrame(animate);

  controls.update();

  renderer.render(scene,camera);
}

 initSatelliteSelector();
animate();

/* ================= RESIZE FIX ================= */
window.addEventListener("resize",()=>{

  camera.aspect=(window.innerWidth-420)/window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth-420,window.innerHeight);
});




/* =================select satelite ================= */





function initSatelliteSelector(){

    const selector=document.getElementById("satelliteSelector");

    for(const norad in SAT_INFO){

        const sat=SAT_INFO[norad];

        const option=document.createElement("option");

        option.value=norad;

        option.textContent=sat.name;

        selector.appendChild(option);

    }

    selector.addEventListener("change",()=>{

        const sat=SAT_INFO[selector.value];

        if(!sat)return;

        fillSpaceTemplate(sat);

    });

}

document
.getElementById("modelUrlInput")
.addEventListener("change",()=>{

    const url =
        document.getElementById("modelUrlInput").value.trim();

    if(url){

        loadRemoteModel(url);

    }

});

function fillSpaceTemplate(sat){

    const norad = Object.keys(SAT_INFO).find(
        id => SAT_INFO[id] === sat
    );

    const space={

        norad:parseInt(norad),

        name:sat.name,

        type:sat.type,

        mission:sat.mission,

        image:sat.image,

        patch:sat.patch,

        instruments:sat.instruments,

        capabilities:sat.capabilities

    };

    document.getElementById("spaceInput").value =
        JSON.stringify(space,null,2);

    document.getElementById("modelUrlInput").value =
        sat.modelUrl || "";

    if(sat.modelUrl){

        loadRemoteModel(sat.modelUrl);

    }

}


 function loadRemoteModel(url){

    if(!url)return;

    const loader = new THREE.GLTFLoader();

    loader.load(

        url,

        gltf=>{

            if(currentModel){

                scene.remove(currentModel);

            }

            currentModel = gltf.scene;

            scene.add(currentModel);

            const json = gltf.parser.json;

            originalMetadata = extractMetadata(json);

            document.getElementById("originalBox").textContent =
                JSON.stringify(originalMetadata,null,2);

            document.getElementById("status").textContent =
                "Modelo cargado desde biblioteca.";

            document.getElementById("mergeBtn").disabled = false;

        },

        undefined,

        err=>{

            console.error(err);

            document.getElementById("status").textContent =
                "No se pudo cargar el modelo.";

        }

    );

}

 
/* ================= METADATA EXTRACTOR ================= */

function extractMetadata(json){

  return {
    asset: json.asset?.extras || {},
    scene: (json.scenes || []).map(s => s.extras || {}),
    nodes: (json.nodes || []).map(n => n.extras || {})
  };
}

/* ================= 1. LOAD GLB ================= */

document.getElementById("glbInput").onchange = e => {

  const file = e.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);

  new THREE.GLTFLoader().load(url, gltf => {

    if (currentModel) scene.remove(currentModel);

    currentModel = gltf.scene;
    scene.add(currentModel);

    const json = gltf.parser.json;

    originalMetadata = extractMetadata(json);

    document.getElementById("originalBox").textContent =
      JSON.stringify(originalMetadata,null,2);

    document.getElementById("status").textContent =
      "Modelo cargado + metadatos leídos";

    document.getElementById("mergeBtn").disabled = false;

    URL.revokeObjectURL(url);
  });
};

/* ================= 2. MERGE SPACE ================= */

document.getElementById("mergeBtn").onclick = () => {

  try {

    let space = JSON.parse(
      document.getElementById("spaceInput").value || "{}"
    );

    // 🔥 NORMALIZACIÓN CRÍTICA
    if (space.Space) {
      space = space.Space;
    }

    finalMetadata = {
      ...originalMetadata,
      Space: space
    };

    document.getElementById("finalBox").textContent =
      JSON.stringify(finalMetadata, null, 2);

    document.getElementById("status").textContent =
      "Space añadido correctamente";

    document.getElementById("validateBtn").disabled = false;

  } catch (e) {
    document.getElementById("status").textContent =
      "JSON inválido en Space";
  }
};

/* ================= 3. VALIDATE ================= */

document.getElementById("validateBtn").onclick = () => {

  if (!finalMetadata) return;

  document.getElementById("status").textContent =
    "Metadatos validados";

  document.getElementById("sealBtn").disabled = false;
};

/* ================= 4. SEAL ================= */

document.getElementById("sealBtn").onclick = () => {

  if (!currentModel || !finalMetadata) return;

  currentModel.userData.asset = {
    extras: finalMetadata
  };

  sealed = true;

  document.getElementById("status").textContent =
    "Activo sellado";

  document.getElementById("downloadBtn").disabled = false;
};

/* ================= 5. DOWNLOAD ================= */

document.getElementById("downloadBtn").onclick = () => {

  if (!sealed) return;

  const exporter = new THREE.GLTFExporter();

  exporter.parse(scene, result => {

    const blob = new Blob(
      [JSON.stringify(result, null, 2)],
      { type: "model/gltf+json" }
    );

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "sac_asset.gltf";
    a.click();

  }, { binary:false });

};

</script>
</body>
</html>
