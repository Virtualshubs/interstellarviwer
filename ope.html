<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Orbital Pass Engine</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background: radial-gradient(circle at 50% 30%, #05070d, #000 70%);
  color: #E6F1FF;
}

canvas { display: block; }

#ui {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 10;

  width: 460px;
  max-height: 92vh;
  overflow: auto;

  padding: 16px;
  border-radius: 16px;

  background: rgba(8, 12, 20, 0.78);
  backdrop-filter: blur(14px);

  border: 1px solid rgba(120, 180, 255, 0.18);

  box-shadow:
    0 0 45px rgba(70, 120, 255, 0.10),
    inset 0 0 25px rgba(255,255,255,0.02);
}

#ui::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(120, 180, 255, 0.5),
    transparent
  );
  opacity: 0.6;
}


#ui h3 {
  margin: 0 0 12px 0;
  font-weight: 600;
  letter-spacing: 0.14em;
  font-size: 13px;
  color: #9CCBFF;
  text-transform: uppercase;
}

button, select, input {
  width: 100%;
  padding: 10px;
  margin-top: 8px;

  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(120, 180, 255, 0.14);

  color: #E6F1FF;

  border-radius: 10px;
  outline: none;

  font-size: 12px;
  letter-spacing: 0.02em;

  transition: all 0.2s ease;
}

button:hover {
  border-color: rgba(120, 180, 255, 0.35);
  background: rgba(120, 180, 255, 0.06);
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}


.highlight {
  margin-top: 14px;
  padding: 14px;

  border-radius: 14px;

  background: linear-gradient(
    180deg,
    rgba(0, 255, 170, 0.08),
    rgba(0, 120, 255, 0.06)
  );

  border: 1px solid rgba(0, 255, 170, 0.18);

  font-size: 13px;
  line-height: 1.55;

  box-shadow: inset 0 0 18px rgba(0,255,150,0.05);
}

.insightBlock {
  margin-top: 10px;
  padding: 12px;

  border-radius: 12px;

  background: rgba(255,255,255,0.03);

  border: 1px solid rgba(120, 180, 255, 0.12);

  position: relative;
}

/* left accent bar (HUD feel) */
.insightBlock::before {
  content: "";
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 2px;
  background: rgba(120, 180, 255, 0.35);
  border-radius: 2px;
}

.insightTitle {
  font-size: 30px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #7FB3FF;
  margin-bottom: 8px;
  opacity: 0.9;
}

.insightItem {
  font-size: 12px;
  opacity: 0.92;
  margin: 3px 0;
  padding-left: 8px;
  border-left: 1px solid rgba(120, 180, 255, 0.25);
}


.rankCard {
  margin-top: 8px;
  padding: 10px;

  border-radius: 12px;

  background: rgba(255,255,255,0.03);

  border: 1px solid rgba(255,255,255,0.08);

  font-size: 12px;

  transition: all 0.2s ease;
}

.rankCard:hover {
  border-color: rgba(120, 180, 255, 0.28);
  background: rgba(120, 180, 255, 0.05);
}



pre {
  white-space: pre-wrap;
  font-size: 11px;
  margin-top: 10px;

  opacity: 0.65;

  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas;
}



#ui::-webkit-scrollbar {
  width: 6px;
}

#ui::-webkit-scrollbar-thumb {

  border-radius: 10px;
}

#ui::-webkit-scrollbar-track {

<script>


let scene, camera, renderer;
let earth;
let zoom = 420;
let targetZoom = 420;
  
window.currentMission = null;
window.latestSatrec = null;

init();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    1,
    20000
  );

  camera.position.set(0, 140, zoom);
  camera.lookAt(0, 0, 0);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);


  earth = new THREE.Mesh(
    new THREE.SphereGeometry(100, 32, 32),
    new THREE.MeshBasicMaterial({
      color: 0x2233ff,
      wireframe: true
    })
  );

  scene.add(earth);

  const satMesh = new THREE.Mesh(
    new THREE.SphereGeometry(3, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xff4444 })
  );

  scene.add(satMesh);
  window.satMesh = satMesh;


window.addEventListener("wheel", (e) => {
  const el = e.target;
  if (
    el.closest("#roadmapModal") ||
    el.closest("#best") ||
    el.closest("#ranking") ||
    el.closest("#out")
  ) {
    return;
  }

  targetZoom += e.deltaY * 0.2;
  targetZoom = Math.max(180, Math.min(800, targetZoom));
});



  
  
  animate();

  window.lat = 40.4168;
  window.lon = -3.7038;
  window.currentCATNR = "25544";

  const satSelect = document.getElementById("satSelect");
  if (satSelect) satSelect.value = "25544";

  const citySelect = document.getElementById("citySelect");
  if (citySelect) citySelect.value = "40.4168,-3.7038";

  window.currentCityName = "Madrid";

  loadSatellite("25544");
}

function animate() {

  requestAnimationFrame(animate);

  const now = new Date();


  if (earth) {
    const gmst = satellite.gstime(now);
    earth.rotation.y = -gmst;
  }


  if (window.latestSatrec) {
    updateSatellitePosition(window.latestSatrec, now);
  }

  zoom += (targetZoom - zoom) * 0.1;

  camera.position.set(0, 140, zoom);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}


function getObserver() {
  return {
    latitude: window.lat || 40.4168,
    longitude: window.lon || -3.7038,
    height: 0.3
  };
}

// =========================
// SAT POSITION
// =========================
function updateSatellitePosition(satrec, date) {

  const pv = satellite.propagate(satrec, date);
  if (!pv.position) return;

  const gmst = satellite.gstime(date);
  const ecf = satellite.eciToEcf(pv.position, gmst);

  const scale = 0.05;

  window.satMesh.position.set(
    ecf.x * scale,
    ecf.z * scale,
    ecf.y * scale
  );
}

// =========================
// ENGINE
// =========================
function scorePass(maxElev, durationMin) {
  return (maxElev * maxElev) * (durationMin / 10);
}

function getClass(maxElev) {
  if (maxElev >= 75) return "🟢 PERFECTO";
  if (maxElev >= 60) return "🟢 EXCELENTE";
  if (maxElev >= 45) return "🟡 MUY BUENO";
  if (maxElev >= 30) return "🟡 BUENO";
  if (maxElev >= 15) return "🟠 DÉBIL";
  return "🔴 MUY BAJO";
}

function getContextInsight(satId, maxElev) {

  const info = SAT_INFO[satId];

  let insights = [];

  // =========================
  // BASE INFO
  // =========================
  if (info) {
    insights.push({ title: "MISIÓN", items: [info.mission] });
    insights.push({ title: "TIPO", items: [info.type] });
    insights.push({ title: "INSTRUMENTOS", items: info.instruments });
    insights.push({ title: "CAPACIDADES", items: info.capabilities });
  }

  // =========================
  // 🌍 CITY / EARTH USE LAYER
  // =========================
  let cityUse = [];

  // =========================
  // 🛰 SENTINEL-1 (RADAR)
  // =========================
  if (satId === "39634" || satId === "39084") {
    cityUse = [
      "Inundaciones",
      "Deformación del terreno",
      "Hielo marino",
      "Infraestructura crítica"
    ];
  }

  // =========================
  // 🌱 SENTINEL-2 (ÓPTICO)
  // =========================
  if (satId === "42063" || satId === "29780") {
    cityUse = [
      "Agricultura de precisión",
      "Vegetación y salud de cultivos",
      "Uso del suelo",
      "Urbanismo",
      "Recursos hídricos"
    ];
  }

  // =========================
  // 🌊 SENTINEL-3 (OCÉANOS)
  // =========================
  if (satId === "28654") {
    cityUse = [
      "Temperatura del océano",
      "Nivel del mar",
      "Color del agua",
      "Clima global"
    ];
  }

  // =========================
  // 🌫 SENTINEL-5P (ATMÓSFERA)
  // =========================
  if (satId === "43618") {
    cityUse = [
      "Calidad del aire",
      "Contaminación urbana",
      "Ozono atmosférico",
      "Emisiones industriales"
    ];
  }

  // =========================
  // 🧑‍🚀 ISS
  // =========================
  if (satId === "25544") {
    cityUse = [
      "Observación orbital",
      "Investigación científica",
      "Experimentos en microgravedad"
    ];
  }

  // =========================
  // 🌦 NOAA (USA METEO POLAR)
  // =========================
  if (satId === "25338") {
    cityUse = [
      "Predicción del tiempo",
      "Tormentas",
      "Nubosidad",
      "Temperatura global"
    ];
  }

  // =========================
  // 🌍 METEOSAT (EU GEO STATIONARY)
  // =========================
  if (satId === "38552") {
    cityUse = [
      "Tormentas en tiempo real",
      "Seguimiento de borrascas",
      "Nubes sobre Europa y África",
      "Fenómenos extremos (huracanes, DANA)"
    ];
  }

  // =========================
  // 🌍 METOP (EU / NOAA COOPERATION)
  // =========================
  if (satId === "38771" || satId === "37849" || satId === "29499") {
    cityUse = [
      "Temperatura atmosférica",
      "Humedad global",
      "Predicción meteorológica avanzada",
      "Monitoreo climático europeo"
    ];
  }

  // =========================
  // FINAL PUSH
  // =========================
  insights.push({
    title: "USO",
    items: cityUse
  });

  // =========================
  // 📊 QUALITY SYSTEM
  // =========================
  if (maxElev > 70) {
    insights.push({ title: "CALIDAD", items: ["MUY ALTA 🔥"] });
  } else if (maxElev > 45) {
    insights.push({ title: "CALIDAD", items: ["MEDIA 🟡"] });
  } else {
    insights.push({ title: "CALIDAD", items: ["BAJA 🟠"] });
  }

  return insights;
}

// =========================
// PASSES
// =========================
function getPasses(satrec, startDate, hours = 168) {

  const observerGd = getObserver();

  const step = 20;
  const passes = [];
  let current = null;

  for (let t = 0; t <= hours * 3600; t += step) {

    const date = new Date(startDate.getTime() + t * 1000);

    const pv = satellite.propagate(satrec, date);
    if (!pv.position) continue;

    const gmst = satellite.gstime(date);
    const ecf = satellite.eciToEcf(pv.position, gmst);

    const look = satellite.ecfToLookAngles(observerGd, ecf);

    const elev = look.elevation * 180 / Math.PI;
    const visible = elev > 0;

    if (visible && !current) {
      current = { start: date, maxElev: elev, duration: 0 };
    }

    if (current) {
      current.duration += step;
      if (elev > current.maxElev) current.maxElev = elev;

      if (!visible) {

        const durMin = current.duration / 60;

        if (current.maxElev < 5) {
          current = null;
          continue;
        }

        passes.push({
          start: current.start,
          end: date,
          maxElev: current.maxElev,
          duration: durMin,
          score: scorePass(current.maxElev, durMin),
          class: getClass(current.maxElev)
        });

        current = null;
      }
    }
  }

  return passes;
}

async function loadSatellite(catnr) {

  const url = `https://celestrak.org/NORAD/elements/gp.php?CATNR=${catnr}&FORMAT=TLE`;

  const res = await fetch(url);
  const text = await res.text();

  const lines = text.trim().split("\n");
  const satrec = satellite.twoline2satrec(lines[1], lines[2]);

  window.latestSatrec = satrec;
  window.currentCATNR = catnr;

  renderSatPatch(catnr);

  run();
}

// =========================
// RUN
// =========================
async function run() {

  const best = document.getElementById("best");
  const ranking = document.getElementById("ranking");
  const out = document.getElementById("out");

  if (!window.latestSatrec) return;

  const passes = getPasses(window.latestSatrec, new Date(), 168);

  passes.sort((a,b) => b.score - a.score);

  const top = passes[0];

  // =========================
  // 🧠 SIEMPRE ACTUALIZAR PANEL INFO
  // =========================
  renderSatInfoPanel(
    window.currentCATNR,
    top ? top.maxElev : 0
  );

  renderMissionNav();
  renderMissionPanel();

  // =========================
  // 🛰 CASO SIN PASOS
  // =========================
  if (!passes.length || !top || top.maxElev < 5) {

    best.innerHTML = `
      🔴 SIN PASOS VISIBLES<br>
      Satélite: <b>${SATS[window.currentCATNR]}</b><br>
      <br>
      <i>El satélite no cruza este punto en el periodo analizado</i>
    `;

    ranking.innerHTML = "";
    out.innerText = "";
  

    return;
  }

  // =========================
  // 🛰 CASO NORMAL
  // =========================
  best.innerHTML = `
    🟢 MEJOR PASO<br>
    Satélite: <b>${SATS[window.currentCATNR]}</b><br>
    Elevación: <b>${top.maxElev.toFixed(1)}°</b><br>
    Score: <b>${Math.round(top.score)}</b><br>
    Inicio: ${top.start}<br>
  `;

  ranking.innerHTML = "<b>🏆 TOP 5 PASOS</b>";

  passes.slice(0,5).forEach((p,i)=>{
    ranking.innerHTML += `
      <div class="rankCard">
        #${i+1} ${p.class}<br>
        Elev: ${p.maxElev.toFixed(1)}°<br>
        Score: ${Math.round(p.score)}<br>
      </div>
    `;
  });

  out.innerText = passes.map((p,i)=>`
PASS ${i+1} ${p.class}
──────────────────
Inicio: ${p.start}
Fin: ${p.end}
Elev max: ${p.maxElev.toFixed(1)}°
Duración: ${p.duration.toFixed(1)} min
Score: ${Math.round(p.score)}
`).join("\n");
}

function selectMission(id) {
  const mission = MISSIONS[id];
  if (!mission) return;

  window.currentMission = id;

  renderMissionPanel();
  renderMissionNav();

  const firstSat = mission.satellites[0];
  loadSatellite(firstSat);
}
