<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Orbital Pass Engine</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background: radial-gradient(circle at 50% 30%, #05070d, #000 70%);
  color: #E6F1FF;
}

canvas { display: block; }

#ui {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 10;

  width: 460px;
  max-height: 92vh;
  overflow: auto;

  padding: 16px;
  border-radius: 16px;

  background: rgba(8, 12, 20, 0.78);
  backdrop-filter: blur(14px);

  border: 1px solid rgba(120, 180, 255, 0.18);

  box-shadow:
    0 0 45px rgba(70, 120, 255, 0.10),
    inset 0 0 25px rgba(255,255,255,0.02);
}

#ui::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(120, 180, 255, 0.5),
    transparent
  );
  opacity: 0.6;
}


#ui h3 {
  margin: 0 0 12px 0;
  font-weight: 600;
  letter-spacing: 0.14em;
  font-size: 30px;
  color: #9CCBFF;
  text-transform: uppercase;
}

button, select, input {
  width: 100%;
  padding: 10px;
  margin-top: 8px;

  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(120, 180, 255, 0.14);

  color: #E6F1FF;

  border-radius: 10px;
  outline: none;

  font-size: 12px;
  letter-spacing: 0.02em;

  transition: all 0.2s ease;
}

button:hover {
  border-color: rgba(120, 180, 255, 0.35);
  background: rgba(120, 180, 255, 0.06);
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}


.highlight {
  margin-top: 14px;
  padding: 14px;

  border-radius: 14px;

  background: linear-gradient(
    180deg,
    rgba(0, 255, 170, 0.08),
    rgba(0, 120, 255, 0.06)
  );

  border: 1px solid rgba(0, 255, 170, 0.18);

  font-size: 13px;
  line-height: 1.55;

  box-shadow: inset 0 0 18px rgba(0,255,150,0.05);
}

.insightBlock {
  margin-top: 10px;
  padding: 12px;

  border-radius: 12px;

  background: rgba(255,255,255,0.03);

  border: 1px solid rgba(120, 180, 255, 0.12);

  position: relative;
}

/* left accent bar (HUD feel) */
.insightBlock::before {
  content: "";
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 2px;
  background: rgba(120, 180, 255, 0.35);
  border-radius: 2px;
}

.insightTitle {
  font-size: 30px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #7FB3FF;
  margin-bottom: 8px;
  opacity: 0.9;
}

.insightItem {
  font-size: 12px;
  opacity: 0.92;
  margin: 3px 0;
  padding-left: 8px;
  border-left: 1px solid rgba(120, 180, 255, 0.25);
}


.rankCard {
  margin-top: 8px;
  padding: 10px;

  border-radius: 12px;

  background: rgba(255,255,255,0.03);

  border: 1px solid rgba(255,255,255,0.08);

  font-size: 12px;

  transition: all 0.2s ease;
}

.rankCard:hover {
  border-color: rgba(120, 180, 255, 0.28);
  background: rgba(120, 180, 255, 0.05);
}



pre {
  white-space: pre-wrap;
  font-size: 11px;
  margin-top: 10px;

  opacity: 0.65;

  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas;
}



#ui::-webkit-scrollbar {
  width: 6px;
}

#ui::-webkit-scrollbar-thumb {
  background: rgba(120, 180, 255, 0.25);
  border-radius: 10px;
}

#ui::-webkit-scrollbar-track {
  background: transparent;
}

  margin-bottom: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #9CCBFF;
}

  .satBlock {

}

  .satBlock::before {

}

  .satItem {
  font-size: 12px;

  margin: 3px 0;

  opacity: 0.92;

  padding-left: 6px;

  border-left: 1px solid rgba(120, 180, 255, 0.25);
}

  #satInfoPanel {
  animation: satFadeIn 0.25s ease-out;
}

@keyframes satFadeIn {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#satPatch {
  position: fixed;

  bottom: 18px;
  right: 18px;

  width: 72px;
  height: 72px;

  border-radius: 50%;

  background: radial-gradient(
    circle at 30% 30%,
    rgba(255,255,255,0.18),
    rgba(120,180,255,0.10) 45%,
    rgba(10,14,20,0.92) 100%
  );

  box-shadow:
    0 0 20px rgba(120,180,255,0.25),
    inset 0 0 14px rgba(255,255,255,0.05);

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  z-index: 50;

  /* pequeño “peso HUD” */
  backdrop-filter: blur(10px);
}
  #satPatch {
  transition: transform 0.2s ease, box-shadow 0.3s ease;
}

#satPatch:hover {
  transform: scale(1.08);
  box-shadow:
    0 0 28px rgba(120,180,255,0.35),
    inset 0 0 14px rgba(255,255,255,0.06);
}
  
#satPatch img {
  width: 100px;
  height: 100px;
  object-fit: contain;
 

  filter: drop-shadow(0 0 6px rgba(120,180,255,0.4));
}

#missionNav {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  z-index: 9999;

.missionSlot {

.missionMeta {

.missionLabel {

 position:fixed;

</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js/dist/satellite.min.js"></script>
<script src="https://unpkg.com/suncalc/suncalc.js"></script>

<script>


let scene, camera, renderer;
let earth;
let zoom = 420;
let targetZoom = 420;


let isDragging = false;
let previousMouse = { x: 0, y: 0 };

let cameraLon = 0;
let cameraLat = 20;

let targetLon = cameraLon;
let targetLat = cameraLat;

  
window.currentMission = null;
window.latestSatrec = null;

init();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    1,
    20000
  );

  camera.position.set(0, 140, zoom);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  
window.sunLight = new THREE.DirectionalLight(0xffffff, 1.4);

scene.add(window.sunLight);

// 🔥 FIX CRÍTICO
window.sunLight.target = new THREE.Object3D();
scene.add(window.sunLight.target);

// =========================
// 🌍 EARTH (textura real)
// =========================

const textureLoader = new THREE.TextureLoader();

const earthTexture = textureLoader.load(
  "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
);

// opcional pero recomendado (mejora calidad)
earthTexture.colorSpace = THREE.SRGBColorSpace;

earth = new THREE.Mesh(
  new THREE.SphereGeometry(100, 64, 64),
  new THREE.MeshStandardMaterial({
    map: earthTexture,
    emissive: new THREE.Color(0x111111),
    emissiveIntensity: 0.2
  })
);

scene.add(earth);

const atmosphereInner = new THREE.Mesh(
  new THREE.SphereGeometry(103, 64, 64),
  new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.06,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);

const atmosphereOuter = new THREE.Mesh(
  new THREE.SphereGeometry(106, 64, 64),
  new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.03,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);

const atmosphereGlow = new THREE.Mesh(
  new THREE.SphereGeometry(112, 64, 64),
  new THREE.MeshBasicMaterial({
    color: 0x88ccff,
    transparent: true,
    opacity: 0.015,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
  
  // =========================
  // 🛰 SAT
  // =========================
  const satMesh = new THREE.Mesh(
    new THREE.SphereGeometry(3, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xff4444 })
  );

  scene.add(satMesh);
  window.satMesh = satMesh;

  // =========================
  // 🎯 RAYCASTER GLOBAL
  // =========================
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();


  window.addEventListener("mousedown", (e) => {
  isDragging = true;
  previousMouse.x = e.clientX;
  previousMouse.y = e.clientY;
});

window.addEventListener("mouseup", () => {
  isDragging = false;
});

window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;

  const deltaX = e.clientX - previousMouse.x;
  const deltaY = e.clientY - previousMouse.y;

  previousMouse.x = e.clientX;
  previousMouse.y = e.clientY;

 const speed = 0.2;

targetLon -= deltaX * speed;
targetLat += deltaY * speed;

// evitar dar la vuelta por los polos
targetLat = Math.max(-85, Math.min(85, targetLat));
});

  // =========================
  // 🖱️ CLICK EN GLOBO
  // =========================
  renderer.domElement.addEventListener("pointerdown", onGlobeClick);

  // =========================
  // 🌀 ZOOM
  // =========================
  window.addEventListener("wheel", onWheelZoom);

  // =========================
  // 🧼 UI INIT
  // =========================
  window.addEventListener("DOMContentLoaded", () => {
    const panel = document.getElementById("missionPanel");
    if (panel) panel.style.display = "none";

    const lat = document.getElementById("lat");
    const lon = document.getElementById("lon");

    if (lat) lat.style.display = "none";
    if (lon) lon.style.display = "none";
  });

  // =========================
  // 🌍 DEFAULT STATE
  // =========================
  window.lat = 40.4168;
  window.lon = -3.7038;
  window.currentCATNR = "25544";
  window.currentCityName = "Madrid";

  const satSelect = document.getElementById("satSelect");
  if (satSelect) satSelect.value = "25544";

  const citySelect = document.getElementById("citySelect");
  if (citySelect) citySelect.value = "40.4168,-3.7038";

  loadSatellite("25544");

  animate();
}



  
function onGlobeClick(event) {
  const rect = renderer.domElement.getBoundingClientRect();

  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObject(earth);

  if (!intersects.length) return;

  // =========================
  // 🔥 punto de intersección
  // =========================
  let point = intersects[0].point.clone();

  // =========================
  // 🧭 COMPENSAR ROTACIÓN TIERRA (GMST)
  // =========================
  const gmst = satellite.gstime(new Date());
  const invRotation = new THREE.Matrix4().makeRotationY(gmst);
  point.applyMatrix4(invRotation);

  point.normalize();

  // =========================
  // 🌍 LAT / LON
  // =========================
  const lat = Math.asin(point.y) * 180 / Math.PI;

  let lon = Math.atan2(point.z, point.x) * 180 / Math.PI;

  // 🔥 FIX MERIDIANO (ESTE/OESTE INVERTIDO)
  lon = -lon;

  // normalización estándar
  lon = ((lon + 180) % 360) - 180;

  // =========================
  // 📍 GUARDAR ESTADO
  // =========================
  window.lat = lat;
  window.lon = lon;

  document.getElementById("citySelect").value = "custom";

  const latInput = document.getElementById("lat");
  const lonInput = document.getElementById("lon");

  if (latInput) latInput.value = lat.toFixed(4);
  if (lonInput) lonInput.value = lon.toFixed(4);

  window.currentCityName = "Custom (Globe)";

  run();
}

function onWheelZoom(e) {
  const el = e.target;

  if (
    el.closest("#roadmapModal") ||
    el.closest("#best") ||
    el.closest("#ranking") ||
    el.closest("#out")
  ) return;

  targetZoom += e.deltaY * 0.2;
  targetZoom = Math.max(180, Math.min(800, targetZoom));
}
  


function getSunECI(date) {
  const pos = SunCalc.getPosition(date, 0, 0);

  const local = new THREE.Vector3(
    Math.cos(pos.altitude) * Math.cos(pos.azimuth),
    Math.sin(pos.altitude),
    Math.cos(pos.altitude) * Math.sin(pos.azimuth)
  );

  const gmst = satellite.gstime(date);
  const rot = new THREE.Matrix4().makeRotationY(-gmst);

  return local.applyMatrix4(rot).normalize();
}




  function animate() {

  requestAnimationFrame(animate);

  const now = new Date();

  // =========================
  // 🌍 ROTACIÓN TIERRA (GMST)
  // =========================
  if (earth) {
    const gmst = satellite.gstime(now);
    earth.rotation.y = -gmst;
  }

  // =========================
  // 🛰 SATÉLITES
  // =========================
  if (window.latestSatrec) {
    updateSatellitePosition(window.latestSatrec, now);
  }

// =========================
// 🌞 SOL SEGURO (NO BREAKING)
// =========================

if (typeof satellite !== "undefined") {

  const sunECI = satellite.sunPosition
    ? satellite.sunPosition(now)
    : null;

  if (sunECI) {

    const sunDir = new THREE.Vector3(
      sunECI.x,
      sunECI.y,
      sunECI.z
    ).normalize();

    if (!window.sunLight) {
      window.sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
      scene.add(window.sunLight);
    }

window.sunLight.position.set(
    sunDir.z * 1000,
    sunDir.y * 1000,
   -sunDir.x * 1000
);
    window.sunLight.target.position.set(0, 0, 0);
    window.sunLight.target.updateMatrixWorld();
  }
}

  // =========================
  // 🎥 CÁMARA
  // =========================
  zoom += (targetZoom - zoom) * 0.1;

  cameraLon += (targetLon - cameraLon) * 0.1;
  cameraLat += (targetLat - cameraLat) * 0.1;

  const phi = THREE.MathUtils.degToRad(90 - cameraLat);
  const theta = THREE.MathUtils.degToRad(cameraLon);

  camera.position.x = zoom * Math.sin(phi) * Math.cos(theta);
  camera.position.y = zoom * Math.cos(phi);
  camera.position.z = zoom * Math.sin(phi) * Math.sin(theta);

  camera.lookAt(0, 0, 0);

  // =========================
  // 🎬 RENDER
  // =========================
  renderer.render(scene, camera);
}
  

function getObserver() {

function updateSatellitePosition(satrec, date) {

  const pv = satellite.propagate(satrec, date);
  if (!pv.position) return;

  const gmst = satellite.gstime(date);
  const ecf = satellite.eciToEcf(pv.position, gmst);

  const scale = 0.05;

  window.satMesh.position.set(
    ecf.x * scale,
    ecf.z * scale,
    ecf.y * scale
  );
}

function scorePass(maxElev, durationMin) {
  return (maxElev * maxElev) * (durationMin / 10);

// =========================
// PASSES
// =========================
function getPasses(satrec, startDate, hours = 168) {

  const observerGd = getObserver();

const step = 10; // ultra precisión (más coste CPU)
  const passes = [];

  let current = null;

  for (let t = 0; t <= hours * 3600; t += step) {

    const date = new Date(startDate.getTime() + t * 1000);

    const pv = satellite.propagate(satrec, date);
    if (!pv.position) continue;

    const gmst = satellite.gstime(date);
    const ecf = satellite.eciToEcf(pv.position, gmst);

    const look = satellite.ecfToLookAngles(observerGd, ecf);
    const elev = look.elevation * 180 / Math.PI;

    const visible = elev > 0;

    // =========================
    // INICIO PASO
    // =========================
    if (visible && !current) {
      current = {
        start: date,
        maxElev: elev,
        maxDate: date,
        duration: 0
      };
    }

    // =========================
    // DURANTE PASO
    // =========================
    if (current) {

      current.duration += step;

      if (elev > current.maxElev) {
        current.maxElev = elev;
        current.maxDate = date;
      }

      // =========================
      // FIN PASO
      // =========================
      if (!visible) {

        // 🔍 refinamiento inicio
        const refinedStart = refineBoundary(satrec, current.start, -1);

        // 🔍 refinamiento fin
        const refinedEnd = refineBoundary(satrec, date, 1);

        // 🔍 refinamiento máximo
        const refinedMax = refineMaximum(satrec, current.maxDate);
        
const duration = Math.max(
  0,
  (refinedEnd.getTime() - refinedStart.getTime()) / 60000
);

       passes.push({
  start: refinedStart,
  end: refinedEnd,
  maxElev: refinedMax.elevation,
  duration,
  score: scorePass(refinedMax.elevation, duration),
  class: getClass(refinedMax.elevation),
  city: window.currentCityName,
  lat: window.lat,
  lon: window.lon
});
        current = null;
      }
    }
  }

  return passes;
}


  function refineMaximum(satrec, approxTime) {
  let bestElev = -999;
  let bestDate = approxTime;

  for (let dt = -30; dt <= 30; dt += 1) {
    const date = new Date(approxTime.getTime() + dt * 1000);
    const elev = getElevation(satrec, date);

    if (elev !== null && elev > bestElev) {
      bestElev = elev;
      bestDate = date;
    }
  }

  return { date: bestDate, elevation: bestElev };
}

function refineBoundary(satrec, approxTime, direction) {
  let best = approxTime;

  for (let dt = -30; dt <= 30; dt += 1) {
    const t = direction > 0 ? dt : -dt;

    const date = new Date(approxTime.getTime() + t * 1000);
    const elev = getElevation(satrec, date);

    if (elev !== null && elev > 0) {
      best = date;
    }
  }

  return best;
}


  function getElevation(satrec, date) {
  const pv = satellite.propagate(satrec, date);
  if (!pv.position) return null;

  const gmst = satellite.gstime(date);
  const ecf = satellite.eciToEcf(pv.position, gmst);

  const observer = getObserver();
  const look = satellite.ecfToLookAngles(observer, ecf);

  return look.elevation * 180 / Math.PI;
}

async function loadSatellite(catnr) {

  const url = `https://celestrak.org/NORAD/elements/gp.php?CATNR=${catnr}&FORMAT=TLE`;

  const res = await fetch(url);
  const text = await res.text();

  const lines = text.trim().split("\n");

  window.latestSatrec = satrec;

  renderSatPatch(catnr);

  run();

  });

  // =========================
  // 📄 OUTPUT DETALLADO
  // =========================
  out.innerText = passes.map((p, i) => `
PASS ${i + 1} ${p.class}
──────────────────
Inicio: ${p.start}
Fin: ${p.end}
Elev max: ${p.maxElev.toFixed(1)}°
Duración: ${p.duration.toFixed(1)} min
Score: ${Math.round(p.score)}
`).join("\n");
}



  function applyCoordsIfCustom() {
  const val = document.getElementById("citySelect").value;

  if (val !== "custom") return;

  const lat = parseFloat(document.getElementById("lat").value);
  const lon = parseFloat(document.getElementById("lon").value);

  if (!isNaN(lat) && !isNaN(lon)) {
    window.lat = lat;
    window.lon = lon;
    window.currentCityName = "Custom";
  }
}

  
function renderMissionNav() {
  const nav = document.getElementById("missionNav");

  nav.innerHTML = Object.entries(MISSIONS).map(([id, m]) => `
    <div class="missionSlot ${window.currentMission === id ? "active" : ""}"
         title="${m.label}"
         onclick="selectMission('${id}')">

      <img src="${m.icon}">

      <div class="missionMeta">
        <div class="missionLabel">${m.label}</div>
      </div>

    </div>
  `).join("");
}


function renderMissionPanel() {
  const panel = document.getElementById("missionPanel");
  const id = window.currentMission;

  if (!panel || !id) return;

  const mission = MISSIONS[id];
  if (!mission) return;

  panel.innerHTML = `
    <button class="missionCloseBtn" onclick="closeMissionPanel()">
      ✕
    </button>

    <div class="missionTitle">
      🧭 ${mission.label}
    </div>

    <div class="missionDesc">
      ${mission.description}
    </div>

    <div class="missionSatCount">
      🛰 ${mission.satellites.length} satélites activos
    </div>

    <div class="missionObjectives">
      <div class="sectionTitle">🎯 Objetivo de la misión</div>
      <ul>
        ${mission.objectives.map(o => `<li>${o}</li>`).join("")}
      </ul>
    </div>

    <div class="missionSatelliteObjectives">
      <div class="sectionTitle">📡 Función del conjunto orbital</div>
      <ul>
        ${mission.satelliteObjectives.map(o => `<li>${o}</li>`).join("")}
      </ul>
    </div>
  `;
}

 function closeMissionPanel() {
  const panel = document.getElementById("missionPanel");

  panel.style.display = "none";
  window.currentMission = null;

  renderMissionNav(); // para quitar highlight activo
}


function openMissionPanel() {
  const panel = document.getElementById("missionPanel");
  panel.style.display = "block";
  renderMissionPanel();
}
  
  
function selectMission(id) {
  window.currentMission = id;

  renderMissionNav();
  openMissionPanel();

  loadSatellite(MISSIONS[id].satellites[0]);
}
  
</script>
