<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Bingo Stream Creator</title>

<style>

body{
    font-family: 'Arial', sans-serif;
    background: radial-gradient(circle at top, #1a1a2e, #0a0a0f);
    color:white;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    font-size:32px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#a855f7;
    text-shadow:0 0 10px #a855f7, 0 0 20px #7c3aed;
}

.container{
    max-width:1200px;
    margin:auto;
}

button{
    cursor:pointer;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    color:white;
    padding:10px 14px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    letter-spacing:1px;
    box-shadow:0 0 10px rgba(124,58,237,0.4);
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px rgba(124,58,237,0.8);
}

select, textarea{
    background:#111827;
    color:white;
    border:1px solid #2e2e3e;
    border-radius:8px;
}

.grid-editor,
.grid-play{
    display:grid;
    gap:10px;
    margin-top:20px;
}

.cell-input{
    width:100%;
    min-height:70px;
    resize:none;
    background:#0f0f1a;
    border:1px solid #2e2e3e;
    color:white;
    border-radius:10px;
    padding:8px;
}

.bingo-cell{
    min-height:95px;
    background: linear-gradient(145deg, #111827, #0b0b12);
    border:1px solid #2e2e3e;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px;
    cursor:pointer;
    transition:0.2s;
    user-select:none;
}

.bingo-cell:hover{
    transform:scale(1.03);
    border-color:#a855f7;
}

/* NORMAL */
.marked{
    background: linear-gradient(145deg, #16a34a, #22c55e);
}

/* 🟡 CASILLA DORADA */
.gold{
    background: linear-gradient(145deg, #fbbf24, #f59e0b) !important;
    border-color:#fbbf24 !important;
    box-shadow:0 0 25px rgba(255,200,0,0.6);
}

/* LÍNEA */
.win-line{
    box-shadow:0 0 18px #22c55e;
    border-color:#22c55e !important;
}

/* ANIMACIÓN SOLO UNA VEZ */
.win-animate{
    animation: winPulse 0.8s ease;
}

@keyframes winPulse{
    0%{ transform:scale(1); }
    50%{
        transform:scale(1.08);
        box-shadow:0 0 40px #22c55e, 0 0 70px #7c3aed;
    }
    100%{ transform:scale(1.03); }
}

/* PROGRESS */
.progress-wrap{
    width:100%;
    max-width:600px;
    margin:0 auto 20px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
}

.progress-bar-bg{
    width:100%;
    height:14px;
    background:#1f1f2e;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #2e2e3e;
}

.progress-bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#7c3aed,#22c55e);
}

/* WIDGET */
#widgetBar{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    z-index:9999;
    background:#0f0f1a;
    border:1px solid #2e2e3e;
    border-radius:12px;
    padding:10px;
    display:none;
    justify-content:space-between;
}

.hidden{display:none}

/* 🔔 mensaje dorado */
#goldToast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#fbbf24;
    color:black;
    padding:10px 20px;
    border-radius:12px;
    font-weight:bold;
    display:none;
    box-shadow:0 0 30px rgba(255,200,0,0.6);
}

</style>
</head>

<body>

<div id="widgetBar">
    🎮 Bingo <button onclick="toggleWidget()">↔</button>
</div>

<div class="container">

<div id="editor">
<h1>BORJABINGO</h1>

<select id="gridSize">
<option value="4">4x4</option>
<option value="5">5x5</option>
<option value="6">6x6</option>
</select>

<button onclick="generateEditor()">Generar</button>
<button onclick="exportBingo()">Crear</button>
<button onclick="toggleWidget()">Minimizar</button>

<div id="editorGrid"></div>
<textarea id="url"></textarea>
</div>

<div id="player" class="hidden">

<div class="topbar">
<h1>BINGO</h1>
<button onclick="resetMarks()">Reset</button>
<button onclick="toggleWidget()">Minimizar</button>
</div>

<div class="progress-wrap">
<div class="progress-bar-bg">
<div id="progressBar" class="progress-bar-fill"></div>
</div>
</div>

<div id="playGrid" class="grid-play"></div>

</div>

</div>

<div id="goldToast">🟡 CASILLA DORADA ACTIVADA</div>

<script>

const activatedLines = new Set();
let isMinimized=false;

/* ================= WIDGET ================= */
function toggleWidget(){
    isMinimized=!isMinimized;

    const editor=document.getElementById("editor");
    const player=document.getElementById("player");
    const bar=document.getElementById("widgetBar");

    if(isMinimized){
        editor.style.display="none";
        player.style.display="none";
        bar.style.display="flex";
    }else{
        bar.style.display="none";
        if(document.querySelector(".bingo-cell")){
            player.style.display="block";
        }else{
            editor.style.display="block";
        }
    }
}

/* ================= EDITOR ================= */
function generateEditor(){
    const size=+gridSize.value;
    const grid=document.getElementById("editorGrid");

    grid.innerHTML="";
    grid.style.gridTemplateColumns=`repeat(${size},1fr)`;

    for(let i=0;i<size*size;i++){
        const t=document.createElement("textarea");
        t.className="cell-input";
        t.placeholder="Casilla "+(i+1);
        grid.appendChild(t);
    }
}

function exportBingo(){
    const size=+gridSize.value;
    const cells=[...document.querySelectorAll(".cell-input")].map(e=>e.value);
    const data={size,cells};

    const url=btoa(JSON.stringify(data));
    document.getElementById("url").value=location.href+"#"+url;
}

/* ================= PROGRESS ================= */
function updateProgress(){
    const all=document.querySelectorAll(".bingo-cell");
    const marked=document.querySelectorAll(".marked");

    const p=Math.round(marked.length/all.length*100);
    document.getElementById("progressBar").style.width=p+"%";
}

/* ================= GOLD SYSTEM ================= */
function maybeGold(cell){
    if(Math.random()<0.5 && !cell.classList.contains("marked")){
        cell.classList.add("gold");
        showGoldToast();
    }
}

function showGoldToast(){
    const t=document.getElementById("goldToast");
    t.style.display="block";
    setTimeout(()=>t.style.display="none",2000);
}

/* ================= CHECK BINGO ================= */
function checkBingo(){
    const cells=[...document.querySelectorAll(".bingo-cell")];
    const size=Math.sqrt(cells.length);

    const grid=[];
    for(let i=0;i<size;i++){
        grid.push(cells.slice(i*size,(i+1)*size));
    }

    let winLines=[];

    for(let r=0;r<size;r++){
        if(grid[r].every(c=>c.classList.contains("marked")))
            winLines.push(grid[r]);
    }

    for(let c=0;c<size;c++){
        let col=[];
        for(let r=0;r<size;r++) col.push(grid[r][c]);
        if(col.every(c=>c.classList.contains("marked")))
            winLines.push(col);
    }

    let d1=[],d2=[];
    for(let i=0;i<size;i++){
        d1.push(grid[i][i]);
        d2.push(grid[i][size-1-i]);
    }

    if(d1.every(c=>c.classList.contains("marked"))) winLines.push(d1);
    if(d2.every(c=>c.classList.contains("marked"))) winLines.push(d2);

    winLines.forEach(line=>{
        line.forEach(c=>{
            c.classList.add("win-line","win-animate");
            setTimeout(()=>c.classList.remove("win-animate"),800);
        });
    });
}

/* ================= LOAD ================= */
function loadPlayer(data){
    document.getElementById("editor").classList.add("hidden");
    document.getElementById("player").classList.remove("hidden");

    const grid=document.getElementById("playGrid");
    grid.style.gridTemplateColumns=`repeat(${data.size},1fr)`;

    data.cells.forEach(t=>{
        const c=document.createElement("div");
        c.className="bingo-cell";
        c.textContent=t;

        c.onclick=()=>{
            c.classList.toggle("marked");
            maybeGold(c);
            updateProgress();
            checkBingo();
        };

        grid.appendChild(c);
    });
}

/* ================= RESET ================= */
function resetMarks(){
    activatedLines.clear();
    document.querySelectorAll(".bingo-cell")
        .forEach(c=>c.classList.remove("marked","gold","win-line","win-animate"));
}

window.onload=()=>{
    if(location.hash){
        loadPlayer(JSON.parse(atob(location.hash.slice(1))));
    }else{
        generateEditor();
    }
};
</script>

</body>
</html>
