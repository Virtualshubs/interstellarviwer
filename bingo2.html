<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Bingo Stream Creator</title>

<style>
    
body{
    font-family: 'Arial', sans-serif;
    background: radial-gradient(circle at top, #1a1a2e, #0a0a0f);
    color:white;
    margin:0;
    padding:20px;
}

/* TITULO */
h1{
    text-align:center;
    font-size:32px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#a855f7;
    text-shadow:0 0 10px #a855f7, 0 0 20px #7c3aed;
}

/* CONTENEDOR */
.container{
    max-width:1200px;
    margin:auto;
}

/* BOTONES */
button{
    cursor:pointer;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    color:white;
    padding:10px 14px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    letter-spacing:1px;
    box-shadow:0 0 10px rgba(124,58,237,0.4);
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px rgba(124,58,237,0.8);
}

/* SELECT / INPUT */
select, textarea{
    background:#111827;
    color:white;
    border:1px solid #2e2e3e;
    border-radius:8px;
}

/* GRID */
.grid-editor,
.grid-play{
    display:grid;
    gap:10px;
    margin-top:20px;
}

/* EDITOR */
.cell-input{
    width:100%;
    min-height:70px;
    resize:none;
    background:#0f0f1a;
    border:1px solid #2e2e3e;
    color:white;
    border-radius:10px;
    padding:8px;
}

/* JUEGO */
.bingo-cell{
    min-height:95px;
    background: linear-gradient(145deg, #111827, #0b0b12);
    border:1px solid #2e2e3e;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px;
    cursor:pointer;
    transition:0.2s;
    user-select:none;
    position:relative;
    overflow:hidden;
}

.bingo-cell:hover{
    transform:scale(1.03);
    border-color:#a855f7;
}

/* MARCADA */
.marked{
    background: linear-gradient(145deg, #16a34a, #22c55e);
    border-color:#22c55e;
}

/* 🔥 NUEVO: LINEA GANADORA */
.win-line{
    animation: winPulse 1s infinite alternate;
    box-shadow:0 0 25px #a855f7, 0 0 50px #22c55e;
    border-color:#22c55e !important;
    transform:scale(1.05);
}

@keyframes winPulse{
    0%{ filter:brightness(1); }
    100%{ filter:brightness(1.5); }
}

/* PROGRESS BAR */
.progress-wrap{
    width:100%;
    max-width:600px;
    margin:0 auto 20px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
}

.progress-bar-bg{
    width:100%;
    height:14px;
    background:#1f1f2e;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #2e2e3e;
}

.progress-bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#7c3aed,#22c55e);
    transition:0.25s;
}

.topbar{
    text-align:center;
    margin-bottom:20px;
}

.url-box{
    width:100%;
    margin-top:15px;
    background:#0f0f1a;
    color:#a855f7;
    border:1px solid #2e2e3e;
}

</style>
</head>

<body>

<div class="container">

<div id="editor">

<h1>🎮 Borjabingo</h1>

<div class="controls">
<select id="gridSize">
<option value="4">4 x 4</option>
<option value="5">5 x 5</option>
<option value="6">6 x 6</option>
<option value="9">9 x 9</option>
</select>

<button onclick="generateEditor()">Generar Cuadrícula</button>
<button onclick="exportBingo()">Crear bingo</button>
</div>

<div id="editorGrid" class="grid-editor"></div>

<textarea id="generatedUrl" class="url-box" rows="4"></textarea>

</div>

<div id="player" class="hidden">

<div class="topbar">
<h1>🎯 Bingo</h1>
<button onclick="resetMarks()">Reiniciar</button>
</div>

<div class="progress-wrap">
<div class="progress-top">
<span>Progreso</span>
<span id="progressText">0%</span>
</div>
<div class="progress-bar-bg">
<div id="progressBar" class="progress-bar-fill"></div>
</div>
</div>

<div id="playGrid" class="grid-play"></div>

</div>

</div>

<script>

function generateEditor(){
    const size = +document.getElementById('gridSize').value;
    const grid = document.getElementById('editorGrid');

    grid.innerHTML='';
    grid.style.gridTemplateColumns=`repeat(${size},1fr)`;

    for(let i=0;i<size*size;i++){
        const input=document.createElement('textarea');
        input.className='cell-input';
        input.placeholder=`Casilla ${i+1}`;
        grid.appendChild(input);
    }
}

function exportBingo(){

    const size = +document.getElementById('gridSize').value;

    const cells=[...document.querySelectorAll('.cell-input')]
        .map(e=>e.value.trim());

    const data={size,cells};

    const encoded=btoa(encodeURIComponent(JSON.stringify(data)));

    const url=location.origin+location.pathname+'#'+encoded;

    document.getElementById('generatedUrl').value=url;
}

/* =========================
   PROGRESO
========================= */
function updateProgress(){

    const cells=document.querySelectorAll('.bingo-cell');
    const marked=document.querySelectorAll('.bingo-cell.marked');

    const percent=Math.round((marked.length/cells.length)*100);

    document.getElementById('progressBar').style.width=percent+'%';
    document.getElementById('progressText').textContent=percent+'%';
}

/* =========================
   CHECK BINGO LINES
========================= */
function checkBingo(){

    const cells=[...document.querySelectorAll('.bingo-cell')];
    const size=Math.sqrt(cells.length);

    const grid=[];

    for(let i=0;i<size;i++){
        grid.push(cells.slice(i*size,(i+1)*size));
    }

    let winLines=[];

    // filas
    for(let r=0;r<size;r++){
        if(grid[r].every(c=>c.classList.contains('marked'))){
            winLines.push(grid[r]);
        }
    }

    // columnas
    for(let c=0;c<size;c++){
        let col=[];
        for(let r=0;r<size;r++){
            col.push(grid[r][c]);
        }
        if(col.every(c=>c.classList.contains('marked'))){
            winLines.push(col);
        }
    }

    // diagonal ↘
    let d1=[];
    for(let i=0;i<size;i++) d1.push(grid[i][i]);
    if(d1.every(c=>c.classList.contains('marked'))) winLines.push(d1);

    // diagonal ↙
    let d2=[];
    for(let i=0;i<size;i++) d2.push(grid[i][size-1-i]);
    if(d2.every(c=>c.classList.contains('marked'))) winLines.push(d2);

    cells.forEach(c=>c.classList.remove('win-line'));

    winLines.forEach(line=>{
        line.forEach(cell=>{
            cell.classList.add('win-line');
        });
    });
}

/* =========================
   LOAD PLAYER
========================= */
function loadPlayer(data){

    document.getElementById('editor').classList.add('hidden');
    document.getElementById('player').classList.remove('hidden');

    const grid=document.getElementById('playGrid');

    grid.style.gridTemplateColumns=`repeat(${data.size},1fr)`;

    data.cells.forEach(text=>{

        const cell=document.createElement('div');
        cell.className='bingo-cell';
        cell.textContent=text||'—';

        cell.addEventListener('click',()=>{
            cell.classList.toggle('marked');
            updateProgress();
            checkBingo();
        });

        grid.appendChild(cell);
    });

    updateProgress();
}

/* =========================
   RESET
========================= */
function resetMarks(){

    document.querySelectorAll('.bingo-cell')
        .forEach(c=>c.classList.remove('marked','win-line'));

    updateProgress();
}

/* =========================
   INIT
========================= */
window.addEventListener('load',()=>{

    if(location.hash){
        const data=JSON.parse(
            decodeURIComponent(atob(location.hash.substring(1)))
        );
        loadPlayer(data);
    }else{
        generateEditor();
    }
});

</script>

</body>
</html>
