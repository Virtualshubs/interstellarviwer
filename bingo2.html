<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Bingo Stream Creator</title>

<style>
    
body{
    font-family: 'Arial', sans-serif;
    background: radial-gradient(circle at top, #1a1a2e, #0a0a0f);
    color:white;
    margin:0;
    padding:20px;
}

/* TITULO */
h1{
    text-align:center;
    font-size:32px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#a855f7;
    text-shadow:0 0 10px #a855f7, 0 0 20px #7c3aed;
}

/* CONTENEDOR */
.container{
    max-width:1200px;
    margin:auto;
}

/* BOTONES */
button{
    cursor:pointer;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    color:white;
    padding:10px 14px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    letter-spacing:1px;
    box-shadow:0 0 10px rgba(124,58,237,0.4);
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px rgba(124,58,237,0.8);
}

/* SELECT / INPUT */
select, textarea{
    background:#111827;
    color:white;
    border:1px solid #2e2e3e;
    border-radius:8px;
}

/* GRID EDITOR */
.grid-editor,
.grid-play{
    display:grid;
    gap:10px;
    margin-top:20px;
}

/* CASILLAS EDITOR */
.cell-input{
    width:100%;
    min-height:70px;
    resize:none;
    background:#0f0f1a;
    border:1px solid #2e2e3e;
    color:white;
    border-radius:10px;
    padding:8px;
    outline:none;
}

.cell-input:focus{
    border-color:#a855f7;
    box-shadow:0 0 10px #7c3aed;
}

/* CASILLAS JUEGO */
.bingo-cell{
    min-height:95px;
    background: linear-gradient(145deg, #111827, #0b0b12);
    border:1px solid #2e2e3e;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px;
    cursor:pointer;
    transition:0.2s;
    user-select:none;
    position:relative;
    overflow:hidden;
}

/* efecto hover tipo videojuego */
.bingo-cell:hover{
    transform:scale(1.03);
    border-color:#a855f7;
    box-shadow:0 0 12px rgba(168,85,247,0.4);
}

/* CASILLA MARCADA */
.marked{
    background: linear-gradient(145deg, #16a34a, #22c55e);
    border-color:#22c55e;
    box-shadow:0 0 20px rgba(34,197,94,0.6);
}

/* efecto “energía” */
.marked::after{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background: radial-gradient(circle, rgba(255,255,255,0.2), transparent 60%);
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    0%{ transform:scale(0.8); opacity:0.6; }
    100%{ transform:scale(1.2); opacity:0; }
}

/* TOP BAR */
.topbar{
    text-align:center;
    margin-bottom:20px;
}

/* URL BOX */
.url-box{
    width:100%;
    margin-top:15px;
    background:#0f0f1a;
    color:#a855f7;
    border:1px solid #2e2e3e;
}

/* PROGRESS BAR */
.progress-wrap{
    width:100%;
    max-width:600px;
    margin:0 auto 20px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    margin-bottom:6px;
}

.progress-bar-bg{
    width:100%;
    height:14px;
    background:#1f1f2e;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #2e2e3e;
}

.progress-bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#7c3aed,#22c55e);
    transition:0.25s;
}

</style>
</head>
<body>

<div class="container">

<div id="editor">

<h1>🎮 Borjabingo </h1>

<div class="controls">
<select id="gridSize">
<option value="4">4 x 4</option>
<option value="5">5 x 5</option>
<option value="6">6 x 6</option>
<option value="9">9 x 9</option>
</select>

<button onclick="generateEditor()">
Generar Cuadrícula
</button>

<button onclick="exportBingo()">
Crear bingo
</button>
</div>

<div id="editorGrid" class="grid-editor"></div>

<textarea
id="generatedUrl"
class="url-box"
rows="4"
placeholder="Aquí aparecerá la URL..."
></textarea>

</div>

<div id="player" class="hidden">

<div class="topbar">
<h1>🎯 Bingo</h1>
<button onclick="resetMarks()">Reiniciar</button>
</div>

<!-- PROGRESS BAR -->
<div class="progress-wrap">
    <div class="progress-top">
        <span>Progreso</span>
        <span id="progressText">0%</span>
    </div>
    <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
    </div>
</div>

<div id="playGrid" class="grid-play"></div>

</div>

</div>

<script>

function generateEditor(){

    const size = parseInt(
        document.getElementById('gridSize').value
    );

    const grid =
        document.getElementById('editorGrid');

    grid.innerHTML='';

    grid.style.gridTemplateColumns =
        `repeat(${size},1fr)`;

    for(let i=0;i<size*size;i++){

        const input =
            document.createElement('textarea');

        input.className='cell-input';

        input.placeholder=
            `Casilla ${i+1}`;

        grid.appendChild(input);
    }
}

function exportBingo(){

    const size =
        parseInt(
        document.getElementById('gridSize').value
    );

    const cells =
        [...document.querySelectorAll('.cell-input')]
        .map(el=>el.value.trim());

    const data = {
        size,
        cells
    };

    const encoded =
        btoa(
            encodeURIComponent(
                JSON.stringify(data)
            )
        );

    const url =
        location.origin +
        location.pathname +
        '#' +
        encoded;

    document.getElementById(
        'generatedUrl'
    ).value = url;
}

function updateProgress(){

    const cells =
        document.querySelectorAll('.bingo-cell');

    const marked =
        document.querySelectorAll('.bingo-cell.marked');

    const percent =
        Math.round((marked.length / cells.length) * 100);

    document.getElementById('progressBar').style.width =
        percent + '%';

    document.getElementById('progressText').textContent =
        percent + '%';
}

function loadPlayer(data){

    document.getElementById('editor')
        .classList.add('hidden');

    document.getElementById('player')
        .classList.remove('hidden');

    const grid =
        document.getElementById('playGrid');

    grid.style.gridTemplateColumns =
        `repeat(${data.size},1fr)`;

    data.cells.forEach(text=>{

        const cell =
            document.createElement('div');

        cell.className='bingo-cell';

        cell.textContent =
            text || '—';

        cell.addEventListener(
            'click',
            ()=>{
                cell.classList.toggle('marked');
                updateProgress();
            }
        );

        grid.appendChild(cell);
    });

    updateProgress();
}

function resetMarks(){

    document
    .querySelectorAll('.bingo-cell')
    .forEach(cell=>{
        cell.classList.remove('marked');
    });

    updateProgress();
}

window.addEventListener('load',()=>{

    if(location.hash){

        try{

            const encoded =
                location.hash.substring(1);

            const data =
                JSON.parse(
                    decodeURIComponent(
                        atob(encoded)
                    )
                );

            loadPlayer(data);

        }catch(e){

            console.error(e);

            alert(
                'Error al cargar el bingo'
            );
        }

    }else{

        generateEditor();

    }

});
</script>

</body>
</html>
