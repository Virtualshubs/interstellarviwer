<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Bingo Stream Creator</title>

<style>

body{
    font-family: 'Arial', sans-serif;
    background: radial-gradient(circle at top, #1a1a2e, #0a0a0f);
    color:white;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    font-size:32px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#a855f7;
    text-shadow:0 0 10px #a855f7, 0 0 20px #7c3aed;
}

button{
    cursor:pointer;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    color:white;
    padding:10px 14px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

/* GRID */
.grid-editor,
.grid-play{
    display:grid;
    gap:10px;
    margin-top:20px;
}

.cell-input{
    width:100%;
    min-height:70px;
    background:#0f0f1a;
    border:1px solid #2e2e3e;
    color:white;
    border-radius:10px;
    padding:8px;
}

.bingo-cell{
    min-height:95px;
    background:#111827;
    border:1px solid #2e2e3e;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
}

.marked{
    background:linear-gradient(145deg,#16a34a,#22c55e);
}

/* WIN */
.win-line{
    box-shadow:0 0 18px #22c55e;
}

.win-animate{
    animation: winPulse 0.8s ease;
}

@keyframes winPulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.08); filter:brightness(1.4);}
    100%{transform:scale(1.03);}
}

/* =========================
   FLOATING WIDGET SYSTEM
========================= */

#launcherBtn{
    position:fixed;
    bottom:20px;
    right:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:linear-gradient(135deg,#7c3aed,#22c55e);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    cursor:pointer;
    z-index:99999;
}

#widgetPanel{
    position:fixed;
    bottom:90px;
    right:20px;
    width:420px;
    max-width:90vw;
    background:#0f0f1a;
    border:1px solid #2e2e3e;
    border-radius:14px;
    z-index:99998;
    display:none;
    overflow:hidden;
}

#widgetHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    background:#111827;
    border-bottom:1px solid #2e2e3e;
}

#widgetContent{
    padding:15px;
}

</style>
</head>

<body>

<!-- BOTÓN FLOTANTE -->
<div id="launcherBtn" onclick="toggleWidget()">🎮</div>

<!-- PANEL -->
<div id="widgetPanel">

    <div id="widgetHeader">
        <span>🎮 Borjabingo</span>
        <button onclick="toggleWidget()">✖</button>
    </div>

    <div id="widgetContent">

        <!-- ================= EDITOR ================= -->
        <div id="editor">

            <h1>🎮 Borjabingo</h1>

            <div class="controls">
                <select id="gridSize">
                    <option value="4">4 x 4</option>
                    <option value="5">5 x 5</option>
                    <option value="6">6 x 6</option>
                    <option value="9">9 x 9</option>
                </select>

                <button onclick="generateEditor()">Generar</button>
                <button onclick="exportBingo()">Exportar</button>
            </div>

            <div id="editorGrid" class="grid-editor"></div>

        </div>

        <!-- ================= PLAYER ================= -->
        <div id="player" class="hidden">

            <h1>🎯 Bingo</h1>

            <div id="playGrid" class="grid-play"></div>

        </div>

    </div>
</div>

<script>

let widgetOpen = false;
const activatedLines = new Set();

/* =========================
   WIDGET TOGGLE REAL
========================= */
function toggleWidget(){

    widgetOpen = !widgetOpen;

    const panel = document.getElementById('widgetPanel');

    panel.style.display = widgetOpen ? 'block' : 'none';
}

/* =========================
   EDITOR
========================= */
function generateEditor(){

    const size = +document.getElementById('gridSize').value;
    const grid = document.getElementById('editorGrid');

    grid.innerHTML='';
    grid.style.gridTemplateColumns=`repeat(${size},1fr)`;

    for(let i=0;i<size*size;i++){
        const input=document.createElement('textarea');
        input.className='cell-input';
        input.placeholder=`Casilla ${i+1}`;
        grid.appendChild(input);
    }
}

function exportBingo(){

    const size = +document.getElementById('gridSize').value;

    const cells=[...document.querySelectorAll('.cell-input')]
        .map(e=>e.value.trim());

    const data={size,cells};

    const encoded=btoa(encodeURIComponent(JSON.stringify(data)));

    const url=location.origin+location.pathname+'#'+encoded;

    alert("URL creada:\n\n" + url);
}

/* =========================
   LOAD
========================= */
function loadPlayer(data){

    document.getElementById('editor').classList.add('hidden');
    document.getElementById('player').classList.remove('hidden');

    const grid=document.getElementById('playGrid');

    grid.style.gridTemplateColumns=`repeat(${data.size},1fr)`;

    data.cells.forEach(text=>{

        const cell=document.createElement('div');
        cell.className='bingo-cell';
        cell.textContent=text||'—';

        cell.onclick=()=>cell.classList.toggle('marked');

        grid.appendChild(cell);
    });
}

/* =========================
   INIT
========================= */
window.addEventListener('load',()=>{

    if(location.hash){
        const data=JSON.parse(
            decodeURIComponent(atob(location.hash.substring(1)))
        );
        loadPlayer(data);
    }else{
        generateEditor();
    }

});

</script>

</body>
</html>
