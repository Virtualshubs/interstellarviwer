<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🎮 TurboBingo</title>

<style>

body{
    font-family: 'Arial', sans-serif;
    background: radial-gradient(circle at top, #1a1a2e, #0a0a0f);
    color:white;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    font-size:32px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#a855f7;
    text-shadow:0 0 10px #a855f7, 0 0 20px #7c3aed;
}

.container{ max-width:1200px; margin:auto; }

button{
    cursor:pointer;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    color:white;
    padding:10px 14px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    box-shadow:0 0 10px rgba(124,58,237,0.4);
}

.grid-editor,.grid-play{display:grid;gap:10px;margin-top:20px;}

.cell-input{
    width:100%;min-height:70px;
    background:#0f0f1a;color:white;
    border-radius:10px;padding:8px;
}

.bingo-cell{
    min-height:95px;
    background:#111827;
    border:1px solid #2e2e3e;
    border-radius:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:0.2s;
}

.marked{ background:#22c55e; }

.win-line{ box-shadow:0 0 18px #22c55e; }

.win-animate{ animation: winPulse 0.8s ease; }

@keyframes winPulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.08);}
    100%{transform:scale(1.03);}
}

/* ⭐ RECOMPENSA FINAL */
#rewardOverlay{
    position:fixed;
    inset:0;
    pointer-events:none;
    display:none;
    overflow:hidden;
    z-index:99999;
}

.star{
    position:absolute;
    font-size:24px;
    animation: fall 2s linear forwards;
}

@keyframes fall{
    0%{ transform:translateY(-50px) scale(1); opacity:1; }
    100%{ transform:translateY(110vh) rotate(360deg) scale(1.5); opacity:0; }
}

</style>
</head>

<body>

<div id="rewardOverlay"></div>

<div class="container">

<h1>🎮 Turbo Bingo</h1>

<select id="gridSize">
<option value="4">4x4</option>
<option value="5">5x5</option>
<option value="6">6x6</option>
</select>

<button onclick="generateEditor()">Generar</button>
<button onclick="startGame()">Crear</button>

<div id="editorGrid" class="grid-editor"></div>

<div id="playGrid" class="grid-play"></div>

</div>

<script>

let bingoCompleted = false;

function generateEditor(){
    const size=+gridSize.value;
    const grid=document.getElementById("editorGrid");

    grid.innerHTML="";
    grid.style.gridTemplateColumns=`repeat(${size},1fr)`;

    for(let i=0;i<size*size;i++){
        const t=document.createElement("textarea");
        t.className="cell-input";
        grid.appendChild(t);
    }
}

function startGame(){
    const size=+gridSize.value;
    const cells=[...document.querySelectorAll(".cell-input")].map(e=>e.value);

    const grid=document.getElementById("playGrid");
    grid.innerHTML="";
    grid.style.gridTemplateColumns=`repeat(${size},1fr)`;

    cells.forEach(text=>{
        const c=document.createElement("div");
        c.className="bingo-cell";
        c.textContent=text;

        c.onclick=()=>{
            c.classList.toggle("marked");
            checkWin();
        };

        grid.appendChild(c);
    });
}

function checkWin(){

    const cells=[...document.querySelectorAll(".bingo-cell")];
    const size=Math.sqrt(cells.length);

    let allMarked=cells.every(c=>c.classList.contains("marked"));

    if(allMarked && !bingoCompleted){
        bingoCompleted=true;
        triggerReward();
    }
}

/* ⭐ RECOMPENSA FINAL */
function triggerReward(){

    const overlay=document.getElementById("rewardOverlay");
    overlay.style.display="block";

    for(let i=0;i<80;i++){
        const star=document.createElement("div");
        star.className="star";
        star.textContent="⭐";

        star.style.left=Math.random()*100+"vw";
        star.style.top="-50px";
        star.style.fontSize=(10+Math.random()*30)+"px";
        star.style.animationDuration=(1+Math.random()*2)+"s";

        overlay.appendChild(star);
    }

    setTimeout(()=>{
        overlay.innerHTML="";
        overlay.style.display="none";
    },3000);
}

</script>

</body>
</html>
