<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🎮 TurboBingo</title>

<style>

body{
    font-family: 'Arial', sans-serif;
    background: radial-gradient(circle at top, #1a1a2e, #0a0a0f);
    color:white;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    font-size:32px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#a855f7;
    text-shadow:0 0 10px #a855f7, 0 0 20px #7c3aed;
}

.container{
    max-width:1200px;
    margin:auto;
}

button{
    cursor:pointer;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    color:white;
    padding:10px 14px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    letter-spacing:1px;
    box-shadow:0 0 10px rgba(124,58,237,0.4);
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px rgba(124,58,237,0.8);
}

select, textarea{
    background:#111827;
    color:white;
    border:1px solid #2e2e3e;
    border-radius:8px;
}

.grid-editor,
.grid-play{
    display:grid;
    gap:10px;
    margin-top:20px;
}

.cell-input{
    width:100%;
    min-height:70px;
    resize:none;
    background:#0f0f1a;
    border:1px solid #2e2e3e;
    color:white;
    border-radius:10px;
    padding:8px;
}

.bingo-cell{
    min-height:95px;
    background: linear-gradient(145deg, #111827, #0b0b12);
    border:1px solid #2e2e3e;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px;
    cursor:pointer;
    transition:0.2s;
    user-select:none;
    position:relative;
    overflow:hidden;
}

.bingo-cell:hover{
    transform:scale(1.03);
    border-color:#a855f7;
}

.marked{
    background: linear-gradient(145deg, #16a34a, #22c55e);
    border-color:#22c55e;
}


.win-line{
    box-shadow:0 0 18px #22c55e;
    border-color:#22c55e !important;
}


.win-animate{
    animation: winPulse 0.8s ease;
}

/* =========================
   BINGO FINAL MESSAGE
========================= */

#bingoMessage{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:10000;
    backdrop-filter:blur(6px);
}

.bingo-box{
    background:#111827;
    border:2px solid #22c55e;
    border-radius:20px;
    padding:40px;
    text-align:center;
    max-width:500px;
    box-shadow:
        0 0 40px rgba(34,197,94,.6),
        0 0 80px rgba(124,58,237,.4);
    animation:bingoAppear .5s ease;
}

.bingo-box h2{
    margin-top:0;
    font-size:36px;
    color:#22c55e;
    text-shadow:0 0 20px #22c55e;
}

.bingo-box p{
    font-size:18px;
    margin:20px 0;
}

@keyframes bingoAppear{

    from{
        transform:scale(.7);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}
    
@keyframes winPulse{
    0%{
        transform:scale(1);
        filter:brightness(1);
    }
    50%{
        transform:scale(1.08);
        box-shadow:0 0 40px #22c55e, 0 0 70px #7c3aed;
        filter:brightness(1.5);
    }
    100%{
        transform:scale(1.03);
        filter:brightness(1);
    }
}

.progress-wrap{
    width:100%;
    max-width:600px;
    margin:0 auto 20px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
}

.progress-bar-bg{
    width:100%;
    height:14px;
    background:#1f1f2e;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #2e2e3e;
}

.progress-bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#7c3aed,#22c55e);
    transition:0.25s;
}

.topbar{
    text-align:center;
    margin-bottom:20px;
}

.url-box{
    width:100%;
    margin-top:15px;
    background:#0f0f1a;
    color:#a855f7;
    border:1px solid #2e2e3e;
}

.hidden{ display:none; }


#widgetBar{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    z-index:9999;
    background:#0f0f1a;
    border:1px solid #2e2e3e;
    border-radius:12px;
    padding:10px 14px;
    display:none;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 0 20px rgba(124,58,237,0.3);
}

#widgetBar button{
    padding:6px 10px;
    font-size:12px;
}

</style>
</head>

<body>

<div id="widgetBar">
    <span>🎮 TurboBingo</span>
    <button onclick="toggleWidget()">↔ Expandir</button>
</div>

<div class="container">

<div id="editor">

<h1>🎮 Turbo Bingo</h1>

<div class="controls">
<select id="gridSize">
<option value="4">4 x 4</option>
<option value="5">5 x 5</option>
<option value="6">6 x 6</option>
<option value="9">9 x 9</option>
</select>

<button onclick="generateEditor()">Generar Cuadrícula</button>
<button onclick="exportBingo()">Crear bingo</button>
<button onclick="toggleWidget()">⤵ Minimizar</button>
</div>

<div id="editorGrid" class="grid-editor"></div>

<textarea id="generatedUrl" class="url-box" rows="4"></textarea>
<div id="bingoMessage">

    <div class="bingo-box">
        <h2>🎉 BINGO COMPLETADO 🎉</h2>

        <p>
            ¡Has completado todas las casillas!
        </p>

        <button onclick="closeBingoMessage()">
            Seguir jugando
        </button>
    </div>

</div>
</div>

<div id="player" class="hidden">

<div class="topbar">
<h1>🎯Turbo Bingo</h1>
<button onclick="resetMarks()">Reiniciar</button>
<button onclick="toggleWidget()">⤵ Minimizar</button>
</div>

<div class="progress-wrap">
<div class="progress-top">
<span>Progreso</span>
<span id="progressText">0%</span>
</div>
<div class="progress-bar-bg">
<div id="progressBar" class="progress-bar-fill"></div>
</div>
</div>

<div id="playGrid" class="grid-play"></div>

</div>

</div>

<script>

const activatedLines = new Set();
let isMinimized = false;
let bingoCompleted = false;


function toggleWidget(){

    isMinimized = !isMinimized;

    const editor = document.getElementById('editor');
    const player = document.getElementById('player');
    const bar = document.getElementById('widgetBar');

    if(isMinimized){

        editor.style.display = 'none';
        player.style.display = 'none';
        bar.style.display = 'flex';

    }else{

        bar.style.display = 'none';

        if(document.querySelector('.bingo-cell')){
            player.style.display = 'block';
        }else{
            editor.style.display = 'block';
        }
    }
}


/* =========================
   FINAL BINGO MESSAGE
========================= */

function showBingoMessage(){

    if(bingoCompleted) return;

    bingoCompleted = true;

    const messages = [

        "🎉 ¡BINGO COMPLETADO!",
        "🔥 ¡Evento desbloqueado!",
        "👑 ¡El chat reclama su premio!",
        "⭐ ¡Victoria legendaria!",
        "🎲 ¡Reto completado!",
        "🚀 ¡Turbo Bingo conseguido!",
        "🏆 ¡Tablero completado!"

    ];

    const title = document.querySelector('#bingoMessage h2');

    if(title){

        title.textContent =
            messages[Math.floor(Math.random()*messages.length)];
    }

    document.getElementById("bingoMessage").style.display = "flex";
}

function closeBingoMessage(){

    document.getElementById("bingoMessage").style.display = "none";
}


/* =========================
   EDITOR
========================= */

function generateEditor(){

    const size = +document.getElementById('gridSize').value;
    const grid = document.getElementById('editorGrid');

    grid.innerHTML='';
    grid.style.gridTemplateColumns=`repeat(${size},1fr)`;

    for(let i=0;i<size*size;i++){

        const input=document.createElement('textarea');

        input.className='cell-input';
        input.placeholder=`Casilla ${i+1}`;

        grid.appendChild(input);
    }
}
    
function exportBingo(){

    const size = +document.getElementById('gridSize').value;

    const cells=[...document.querySelectorAll('.cell-input')]
        .map(e=>e.value.trim());

    const data={size,cells};

    const encoded=btoa(
        encodeURIComponent(
            JSON.stringify(data)
        )
    );

    const url=location.origin+location.pathname+'#'+encoded;

    document.getElementById('generatedUrl').value=url;

    // Añadir el Bingo a la URL
    window.location.hash = encoded;

    // Recargar la misma página para que INIT lo detecte
    window.location.reload();
}
/* =========================
   PROGRESS
========================= */

function updateProgress(){

    const cells=document.querySelectorAll('.bingo-cell');
    const marked=document.querySelectorAll('.bingo-cell.marked');

    const percent=Math.round((marked.length/cells.length)*100);

    document.getElementById('progressBar').style.width=percent+'%';
    document.getElementById('progressText').textContent=percent+'%';

    if(percent === 100){

        showBingoMessage();
    }
}

function getLineId(type,index){

    return type+"-"+index;
}


/* =========================
   CHECK BINGO
========================= */

function checkBingo(){

    const cells=[...document.querySelectorAll('.bingo-cell')];
    const size=Math.sqrt(cells.length);

    const grid=[];

    for(let i=0;i<size;i++){

        grid.push(
            cells.slice(i*size,(i+1)*size)
        );
    }

    let winLines=[];

    for(let r=0;r<size;r++){

        const id=getLineId("row",r);

        if(
            grid[r].every(c=>c.classList.contains('marked'))
            &&
            !activatedLines.has(id)
        ){
            activatedLines.add(id);
            winLines.push(grid[r]);
        }
    }

    for(let c=0;c<size;c++){

        let col=[];

        for(let r=0;r<size;r++){

            col.push(grid[r][c]);
        }

        const id=getLineId("col",c);

        if(
            col.every(c=>c.classList.contains('marked'))
            &&
            !activatedLines.has(id)
        ){
            activatedLines.add(id);
            winLines.push(col);
        }
    }

    let d1=[], d2=[];

    for(let i=0;i<size;i++){

        d1.push(grid[i][i]);
        d2.push(grid[i][size-1-i]);
    }

    if(
        d1.every(c=>c.classList.contains('marked'))
        &&
        !activatedLines.has("diag-1")
    ){
        activatedLines.add("diag-1");
        winLines.push(d1);
    }

    if(
        d2.every(c=>c.classList.contains('marked'))
        &&
        !activatedLines.has("diag-2")
    ){
        activatedLines.add("diag-2");
        winLines.push(d2);
    }

    winLines.forEach(line=>{

        line.forEach(cell=>{

            cell.classList.add('win-line');
            cell.classList.add('win-animate');

            setTimeout(()=>{

                cell.classList.remove('win-animate');

            },800);

        });

    });
}


/* =========================
   PLAYER
========================= */

function loadPlayer(data){

    document.getElementById('editor')
        .classList.add('hidden');

    document.getElementById('player')
        .classList.remove('hidden');

    const grid=document.getElementById('playGrid');

    grid.style.gridTemplateColumns=
        `repeat(${data.size},1fr)`;

    data.cells.forEach(text=>{

        const cell=document.createElement('div');

        cell.className='bingo-cell';
        cell.textContent=text||'—';

        cell.addEventListener('click',()=>{

            cell.classList.toggle('marked');

            updateProgress();
            checkBingo();
        });

        grid.appendChild(cell);

    });

    updateProgress();
}


/* =========================
   RESET
========================= */

function resetMarks(){

    activatedLines.clear();

    bingoCompleted = false;

    const popup =
        document.getElementById("bingoMessage");

    if(popup){

        popup.style.display = "none";
    }

    document.querySelectorAll('.bingo-cell')
        .forEach(c=>{

            c.classList.remove(
                'marked',
                'win-line',
                'win-animate'
            );

        });

    updateProgress();
}


/* =========================
   INIT
========================= */

window.addEventListener('load',()=>{

    if(location.hash){

        const data=JSON.parse(

            decodeURIComponent(
                atob(
                    location.hash.substring(1)
                )
            )
        );

        loadPlayer(data);

    }else{

        generateEditor();
    }

});

</script>

</body>
</html>
